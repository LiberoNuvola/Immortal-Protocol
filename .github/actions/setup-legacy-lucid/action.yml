name: Setup legacy Lucid ESM runtime
description: Normalize lucid-cardano 0.10.11 for Node 22 and scope repository TS modules to ESM
runs:
  using: composite
  steps:
    - name: Normalize lucid-cardano ESM entrypoint
      shell: bash
      run: |
        python - <<'PY'
        import json
        from pathlib import Path

        package_path = Path("node_modules/lucid-cardano/package.json")
        package = json.loads(package_path.read_text())
        if not (package_path.parent / "esm" / "mod.js").is_file():
            raise SystemExit("lucid-cardano ESM entrypoint missing")

        package["type"] = "module"
        package["exports"] = {
            ".": {
                "types": "./types/mod.d.ts",
                "import": "./esm/mod.js",
            }
        }
        package_path.write_text(json.dumps(package, indent=2) + "\n")

        for directory in ("src", "Adapter"):
            scoped = Path(directory) / "package.json"
            if scoped.exists():
                raise SystemExit(f"Unexpected existing scoped package boundary: {scoped}")
            scoped.write_text(json.dumps({"type": "module"}) + "\n")

        print("Legacy lucid-cardano ESM runtime normalized")
        print("Scoped repository TS modules to ESM")
