name: Materios Runtime Artifact Match

on:
  workflow_dispatch:
  push:
    branches:
      - work/b3-materios-provenance-evidence
    paths:
      - "docs/04-verification/MATERIOS-GENESIS-BOOTSTRAP-EVIDENCE-REGISTER-v1.md"
      - ".github/workflows/materios-runtime-artifact-match.yml"

permissions:
  contents: read

jobs:
  compare-published-runtime:
    name: Match published runtime bytes to v6 genesis code
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout IMMORTAL
        uses: actions/checkout@v4

      - name: Prepare evidence directory
        run: mkdir -p out

      - name: Download and hash official v6 artifacts
        run: |
          set -euo pipefail
          BASE="https://materios.fluxpointstudios.com/releases"
          OUT="$GITHUB_WORKSPACE/out"
          EXPECTED_RAW_SHA256="77877aa63358af6cf0c78a3b106ac2d295da575973bec1c3ff51d53b3fa65aaa"

          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            "$BASE/chain-spec-v6-raw.json" --output "$OUT/chain-spec-v6-raw.json"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            "$BASE/SHA256SUMS" --output "$OUT/SHA256SUMS"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            "$BASE/materios-node-v6-x86_64-linux" --output "$OUT/materios-node-v6-x86_64-linux"
          chmod +x "$OUT/materios-node-v6-x86_64-linux"
          if "$OUT/materios-node-v6-x86_64-linux" build-spec --chain preprod --raw \
            > "$OUT/official-node-v6-built-raw.json" 2> "$OUT/official-node-v6-build-spec.stderr"; then
            printf 'success\n' > "$OUT/official-node-v6-build-spec-status.txt"
          else
            printf 'failure\n' > "$OUT/official-node-v6-build-spec-status.txt"
          fi

          assets=(
            "materios_runtime.compact.compressed.wasm"
            "materios_runtime.spec-201.wasm"
            "materios_runtime.spec-202.wasm"
            "materios_runtime.spec-203.wasm"
            "materios_runtime.spec-204.wasm"
            "materios_runtime.spec-205.wasm"
            "materios_runtime.spec-206.wasm"
            "materios_runtime.spec-209.wasm"
            "materios_runtime.spec-212.wasm"
            "materios_runtime.spec-215.wasm"
            "materios_runtime.spec-217.wasm"
          )

          for asset in "${assets[@]}"; do
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
              "$BASE/$asset" --output "$OUT/$asset"
          done

          node - "$OUT" "$EXPECTED_RAW_SHA256" <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const crypto = require("crypto");

          const out = process.argv[2];
          const expectedRawSha256 = process.argv[3];
          const digest = (bytes) => crypto.createHash("sha256").update(bytes).digest("hex");
          const rawPath = path.join(out, "chain-spec-v6-raw.json");
          const rawBytes = fs.readFileSync(rawPath);
          const rawSha256 = digest(rawBytes);
          const rawSpec = JSON.parse(rawBytes.toString("utf8"));
          const codeHex = rawSpec?.genesis?.raw?.top?.["0x3a636f6465"];
          if (typeof codeHex !== "string" || !/^0x(?:[0-9a-fA-F]{2})+$/.test(codeHex)) {
            throw new Error("Raw chain spec has no canonical 0x-prefixed :code entry.");
          }
          const genesisCodeSha256 = digest(Buffer.from(codeHex.slice(2), "hex"));

          const manifestText = fs.readFileSync(path.join(out, "SHA256SUMS"), "utf8");
          const manifest = new Map();
          for (const line of manifestText.split(/\r?\n/)) {
            const m = line.match(/^([a-f0-9]{64})\s+[* ]?(.+)$/i);
            if (m) manifest.set(m[2].trim(), m[1].toLowerCase());
          }

          const names = [
            "materios_runtime.compact.compressed.wasm",
            "materios_runtime.spec-201.wasm",
            "materios_runtime.spec-202.wasm",
            "materios_runtime.spec-203.wasm",
            "materios_runtime.spec-204.wasm",
            "materios_runtime.spec-205.wasm",
            "materios_runtime.spec-206.wasm",
            "materios_runtime.spec-209.wasm",
            "materios_runtime.spec-212.wasm",
            "materios_runtime.spec-215.wasm",
            "materios_runtime.spec-217.wasm"
          ];

          const candidates = names.map((name) => {
            const bytes = fs.readFileSync(path.join(out, name));
            const sha256 = digest(bytes);
            const manifestSha256 = manifest.get(name) ?? null;
            return {
              filename: name,
              size_bytes: bytes.length,
              sha256,
              matches_genesis_code: sha256 === genesisCodeSha256,
              publisher_manifest_sha256: manifestSha256,
              publisher_manifest_matches: manifestSha256 === null ? null : manifestSha256 === sha256
            };
          });

          const officialNodePath = path.join(out, "materios-node-v6-x86_64-linux");
          const officialNodeBytes = fs.readFileSync(officialNodePath);
          const officialNodeSha256 = digest(officialNodeBytes);
          const officialBuildSpecStatus = fs.existsSync(path.join(out, "official-node-v6-build-spec-status.txt"))
            ? fs.readFileSync(path.join(out, "official-node-v6-build-spec-status.txt"), "utf8").trim()
            : "unavailable";
          let officialBuiltRawSpec = null;
          try {
            officialBuiltRawSpec = JSON.parse(fs.readFileSync(path.join(out, "official-node-v6-built-raw.json"), "utf8"));
          } catch {}

          const manifestTextNode = manifest.get("materios-node-v6-x86_64-linux") ?? null;
          const manifestTextRaw = manifest.get("chain-spec-v6-raw.json") ?? null;
          let officialBuiltCodeSha256 = null;
          let officialBuiltTopMatchesPublished = false;
          let officialBuiltGenesisMetadata = null;
          if (officialBuiltRawSpec?.genesis?.raw?.top) {
            const builtTop = officialBuiltRawSpec.genesis.raw.top;
            const builtCodeHex = builtTop["0x3a636f6465"];
            if (typeof builtCodeHex === "string" && /^0x(?:[0-9a-fA-F]{2})+$/.test(builtCodeHex)) {
              officialBuiltCodeSha256 = digest(Buffer.from(builtCodeHex.slice(2), "hex"));
            }
            const sortDeep = (value) => Array.isArray(value)
              ? value.map(sortDeep)
              : value && typeof value === "object"
                ? Object.fromEntries(Object.keys(value).sort().map((key) => [key, sortDeep(value[key])]))
                : value;
            officialBuiltTopMatchesPublished = JSON.stringify(sortDeep(builtTop)) === JSON.stringify(sortDeep(rawSpec.genesis.raw.top));
            officialBuiltGenesisMetadata = {
              name: officialBuiltRawSpec.name ?? null,
              id: officialBuiltRawSpec.id ?? null,
              protocol_id: officialBuiltRawSpec.protocolId ?? null,
              raw_storage_entries: Object.keys(builtTop).length
            };
          }

          const matches = candidates.filter((x) => x.matches_genesis_code);
          const rawSpecMatchesExpected = rawSha256 === expectedRawSha256;
          const officialNodeBuildSpecDiagnostic = fs.existsSync(path.join(out, "official-node-v6-build-spec.stderr"))
            ? fs.readFileSync(path.join(out, "official-node-v6-build-spec.stderr"), "utf8").slice(0, 2000)
            : "unavailable";
          const manifestMatches = candidates.every((x) => x.publisher_manifest_matches !== false)
            && (manifestTextNode === null || manifestTextNode === officialNodeSha256)
            && (manifestTextRaw === null || manifestTextRaw === rawSha256);
          const officialBinaryReproducesRawSpec =
            officialBuildSpecStatus === "success"
            && officialBuiltTopMatchesPublished
            && officialBuiltCodeSha256 === genesisCodeSha256
            && manifestTextNode === officialNodeSha256;
          const report = {
            schema: "IMMORTAL-MATERIOS-RUNTIME-ARTIFACT-MATCH-v2",
            observed_at_utc: new Date().toISOString(),
            source: {
              release_index: "https://materios.fluxpointstudios.com/releases/",
              chain_spec: "https://materios.fluxpointstudios.com/releases/chain-spec-v6-raw.json",
              checksum_manifest: "https://materios.fluxpointstudios.com/releases/SHA256SUMS"
            },
            raw_genesis_spec: {
              size_bytes: rawBytes.length,
              sha256: rawSha256,
              expected_sha256: expectedRawSha256,
              matches_expected: rawSpecMatchesExpected
            },
            genesis_runtime_code: {
              size_bytes: Buffer.from(codeHex.slice(2), "hex").length,
              sha256: genesisCodeSha256
            },
            publisher_manifest: {
              entries_found_for_candidates: candidates.filter((x) => x.publisher_manifest_sha256 !== null).length,
              raw_spec_sha256: manifestTextRaw,
              raw_spec_manifest_matches: manifestTextRaw === null ? null : manifestTextRaw === rawSha256,
              official_node_sha256: manifestTextNode,
              official_node_manifest_matches: manifestTextNode === null ? null : manifestTextNode === officialNodeSha256,
              all_listed_entries_match_downloads: manifestMatches
            },
            official_node_binary: {
              filename: "materios-node-v6-x86_64-linux",
              size_bytes: officialNodeBytes.length,
              sha256: officialNodeSha256,
              build_spec_status: officialBuildSpecStatus,
              build_spec_diagnostic: officialNodeBuildSpecDiagnostic,
              built_in_chain_spec: officialBuiltGenesisMetadata,
              built_in_raw_code_sha256: officialBuiltCodeSha256,
              built_in_storage_matches_published_raw_spec: officialBuiltTopMatchesPublished,
              reproduces_published_raw_spec: officialBinaryReproducesRawSpec
            },
            candidates,
            exact_runtime_wasm_matches: matches.map((x) => x.filename),
            exact_runtime_wasm_match_count: matches.length,
            verdict: rawSpecMatchesExpected && manifestMatches && officialBinaryReproducesRawSpec
              ? "PASS_OFFICIAL_BINARY_RAW_SPEC_MATCH"
              : "FAIL",
            limitation: "A matching official binary and raw chain spec establish artifact consistency within one publisher's release. They do not prove source reproducibility, independent release provenance, GRANDPA finality, or authenticated authority-transition provenance."
          };

          fs.writeFileSync(path.join(out, "MateriosRuntimeArtifactMatch.json"), JSON.stringify(report, null, 2) + "\n");
          fs.unlinkSync(officialNodePath);
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: materios-runtime-artifact-match-${{ github.run_id }}
          path: |
            out/MateriosRuntimeArtifactMatch.json
            out/chain-spec-v6-raw.json
            out/SHA256SUMS
            out/official-node-v6-built-raw.json
            out/official-node-v6-build-spec.stderr
            out/official-node-v6-build-spec-status.txt
            out/*.wasm
          if-no-files-found: warn

      - name: Enforce raw-spec and artifact identity
        if: always()
        run: |
          set -euo pipefail
          REPORT="$GITHUB_WORKSPACE/out/MateriosRuntimeArtifactMatch.json"
          test -f "$REPORT"
          test "$(jq -r '.verdict' "$REPORT")" = "PASS_OFFICIAL_BINARY_RAW_SPEC_MATCH"
