name: IMMORTAL Governance Standalone Conformance

on:
  workflow_dispatch:
  push:
    branches:
      - work/immortal-green-closure
    paths:
      - "IMMORTAL/governance/**"
      - ".github/workflows/immortal-governance-standalone-conformance.yml"
  pull_request:
    paths:
      - "IMMORTAL/governance/**"
      - ".github/workflows/immortal-governance-standalone-conformance.yml"

permissions:
  contents: read

jobs:
  governance-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Setup standalone Governance toolchain
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6.7"
          cabal-version: "3.12.1.0"

      - name: Update Cabal index
        working-directory: IMMORTAL/governance
        run: cabal update

      - name: Compile Governance library and all test components
        working-directory: IMMORTAL/governance
        run: cabal build all --enable-tests

      - name: Run Governance conformance suites
        working-directory: IMMORTAL/governance
        run: cabal test all --test-show-details=direct
