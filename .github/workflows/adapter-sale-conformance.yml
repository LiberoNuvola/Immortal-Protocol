name: Cardano Adapter Sale Conformance

on:
  push:
    branches:
      - audit/adapter-sale-conformance
  pull_request:
    branches:
      - b1-hardening

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
