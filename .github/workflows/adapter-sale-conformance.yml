name: Cardano Adapter Sale Conformance

on:
  push:
    branches:
      - audit/adapter-sale-conformance
      - work/immortal-green-closure
  pull_request:
    branches:
      - b1-hardening

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run src/__tests__/cardano-execution-adapter.test.ts src/__tests__/immortal-reveal-conformance.test.ts src/__tests__/immortal-cardano-adapter-conformance.test.ts
      - run: npm run build
