name: Agent A — Minswap V2 read-only decoder tests

on:
  push:
    branches:
      - work/immortal-green-closure
    paths:
      - "scripts/observeMinswapV2UsdmUtxosReadOnly.mjs"
      - "scripts/collectMinswapUsdmReadOnly.mjs"
      - "scripts/reconcileMinswapV2UsdmApiOnchainReadOnly.mjs"
      - "scripts/collectSuperCardanoUsdmReadOnly.mjs"
      - "scripts/observeDanogoClmmUsdmReadOnly.mjs"
      - "scripts/observeSaturnSwapUsdmOrderbookReadOnly.mjs"
      - "scripts/observeSaturnSwapUsdmOrderbookReadOnly.test.mjs"
      - "scripts/observeWingRidersV2UsdmReadOnly.mjs"
      - "scripts/collectDexScreenerCardanoUsdmReadOnly.mjs"
      - "scripts/collectGeckoTerminalCardanoUsdmReadOnly.mjs"
      - "scripts/collectMuesliSwapCardanoUsdmReadOnly.mjs"
      - "scripts/observeMinswapV2UsdmUtxosReadOnly.test.mjs"
      - ".github/workflows/minswap-v2-observer-tests.yml"
  pull_request:
    paths:
      - "scripts/observeMinswapV2UsdmUtxosReadOnly.mjs"
      - "scripts/observeMinswapV2UsdmUtxosReadOnly.test.mjs"
      - ".github/workflows/minswap-v2-observer-tests.yml"

permissions:
  contents: read

jobs:
  decoder-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Syntax-check all read-only market observers and reconcilers
        run: |
          node --check scripts/observeMinswapV2UsdmUtxosReadOnly.mjs
          node --check scripts/collectMinswapUsdmReadOnly.mjs
          node --check scripts/collectSuperCardanoUsdmReadOnly.mjs
          node --check scripts/reconcileMinswapV2UsdmApiOnchainReadOnly.mjs
          node --check scripts/observeDanogoClmmUsdmReadOnly.mjs
          node --check scripts/observeSaturnSwapUsdmOrderbookReadOnly.mjs
          node --check scripts/observeWingRidersV2UsdmReadOnly.mjs
      - name: Run synthetic decoder fixtures
        run: npx vitest run scripts/observeMinswapV2UsdmUtxosReadOnly.test.mjs scripts/observeSaturnSwapUsdmOrderbookReadOnly.test.mjs --reporter=verbose

  read-only-mainnet-observation:
    # Public-chain reads only. Never signs, submits, refreshes an oracle or writes to Cardano.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Observe official Minswap V2 address on Mainnet (read-only)
        run: node scripts/observeMinswapV2UsdmUtxosReadOnly.mjs --out audit/oracles/minswap-v2-usdm-utxos-readonly.json
      - name: Upload raw UTxO and datum evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minswap-v2-usdm-mainnet-readonly-${{ github.run_id }}
          path: audit/oracles/minswap-v2-usdm-utxos-readonly.json
          if-no-files-found: warn

  read-only-minswap-api-observation:
    # Public Minswap API market observations only; no transaction endpoints.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collect exact-USDM Minswap API observations (read-only)
        run: node scripts/collectMinswapUsdmReadOnly.mjs --out audit/oracles/minswap-usdm-readonly.json
      - name: Upload Minswap API evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minswap-usdm-api-readonly-${{ github.run_id }}
          path: audit/oracles/minswap-usdm-readonly.json
          if-no-files-found: warn

  reconcile-api-vs-onchain:
    if: ${{ github.event_name == 'push' }}
    needs:
      - read-only-mainnet-observation
      - read-only-minswap-api-observation
      - read-only-supercardano-observation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download Koios Mainnet evidence
        uses: actions/download-artifact@v4
        with:
          name: minswap-v2-usdm-mainnet-readonly-${{ github.run_id }}
          path: audit/onchain
      - name: Download Minswap API evidence
        uses: actions/download-artifact@v4
        with:
          name: minswap-usdm-api-readonly-${{ github.run_id }}
          path: audit/api
      - name: Download SuperCardano indexer evidence
        uses: actions/download-artifact@v4
        with:
          name: supercardano-usdm-readonly-${{ github.run_id }}
          path: audit/indexer
      - name: Reconcile Minswap API and independent indexer against Koios
        run: node scripts/reconcileMinswapV2UsdmApiOnchainReadOnly.mjs --onchain audit/onchain/minswap-v2-usdm-utxos-readonly.json --api audit/api/minswap-usdm-readonly.json --supercardano audit/indexer/supercardano-usdm-readonly.json --out audit/oracles/minswap-v2-api-onchain-reconciliation.json
      - name: Upload pool-set reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minswap-v2-usdm-api-onchain-reconciliation-${{ github.run_id }}
          path: audit/oracles/minswap-v2-api-onchain-reconciliation.json
          if-no-files-found: warn

  read-only-dexscreener-observation:
    if: ${{ github.event_name == 'push' }}
    needs:
      - read-only-minswap-api-observation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download same-run Minswap API pool census
        uses: actions/download-artifact@v4
        with:
          name: minswap-usdm-api-readonly-${{ github.run_id }}
          path: audit/api
      - name: Collect DEX Screener Cardano USDM and known V2 pairs (read-only)
        run: node scripts/collectDexScreenerCardanoUsdmReadOnly.mjs --api audit/api/minswap-usdm-readonly.json --out audit/oracles/dexscreener-cardano-usdm-readonly.json
      - name: Upload DEX Screener evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dexscreener-cardano-usdm-readonly-${{ github.run_id }}
          path: audit/oracles/dexscreener-cardano-usdm-readonly.json
          if-no-files-found: warn

  read-only-geckoterminal-observation:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collect exact-USDM Cardano pools from GeckoTerminal (read-only)
        run: node scripts/collectGeckoTerminalCardanoUsdmReadOnly.mjs --out audit/oracles/geckoterminal-cardano-usdm-readonly.json
      - name: Upload GeckoTerminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geckoterminal-cardano-usdm-readonly-${{ github.run_id }}
          path: audit/oracles/geckoterminal-cardano-usdm-readonly.json
          if-no-files-found: warn

  read-only-muesliswap-observation:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collect exact-USDM MuesliSwap pools (read-only)
        run: node scripts/collectMuesliSwapCardanoUsdmReadOnly.mjs --out audit/oracles/muesliswap-cardano-usdm-readonly.json
      - name: Upload MuesliSwap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muesliswap-cardano-usdm-readonly-${{ github.run_id }}
          path: audit/oracles/muesliswap-cardano-usdm-readonly.json
          if-no-files-found: warn


  read-only-supercardano-observation:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collect exact-USDM SuperCardano indexer observation
        run: node scripts/collectSuperCardanoUsdmReadOnly.mjs --out audit/oracles/supercardano-usdm-readonly.json
      - name: Upload SuperCardano raw market evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supercardano-usdm-readonly-${{ github.run_id }}
          path: audit/oracles/supercardano-usdm-readonly.json
          if-no-files-found: warn

  read-only-danogo-clmm-observation:
    if: ${{ github.event_name == 'push' }}
    needs:
      - read-only-supercardano-observation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download same-run SuperCardano USDM pool discovery
        uses: actions/download-artifact@v4
        with:
          name: supercardano-usdm-readonly-${{ github.run_id }}
          path: audit/indexer
      - name: Observe Danogo CLMM pool NFTs and datums on Mainnet (read-only)
        run: node scripts/observeDanogoClmmUsdmReadOnly.mjs --supercardano audit/indexer/supercardano-usdm-readonly.json --out audit/oracles/danogo-clmm-usdm-readonly.json
      - name: Upload Danogo CLMM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: danogo-clmm-usdm-readonly-${{ github.run_id }}
          path: audit/oracles/danogo-clmm-usdm-readonly.json
          if-no-files-found: warn

  read-only-wingriders-v2-observation:
    if: ${{ github.event_name == 'push' }}
    needs:
      - read-only-supercardano-observation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download same-run SuperCardano USDM pool discovery
        uses: actions/download-artifact@v4
        with:
          name: supercardano-usdm-readonly-${{ github.run_id }}
          path: audit/indexer
      - name: Observe WingRiders V2 pool share tokens and datums on Mainnet (read-only)
        run: node scripts/observeWingRidersV2UsdmReadOnly.mjs --supercardano audit/indexer/supercardano-usdm-readonly.json --out audit/oracles/wingriders-v2-usdm-readonly.json
      - name: Upload WingRiders V2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wingriders-v2-usdm-readonly-${{ github.run_id }}
          path: audit/oracles/wingriders-v2-usdm-readonly.json
          if-no-files-found: warn

  read-only-saturnswap-orderbook:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Observe SaturnSwap USDM / ADA CLOB orders (read-only)
        run: node scripts/observeSaturnSwapUsdmOrderbookReadOnly.mjs --out audit/oracles/saturnswap-usdm-orderbook-readonly.json
      - name: Upload SaturnSwap orderbook evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saturnswap-usdm-orderbook-readonly-${{ github.run_id }}
          path: audit/oracles/saturnswap-usdm-orderbook-readonly.json
          if-no-files-found: warn
