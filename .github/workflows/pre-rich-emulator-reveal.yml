name: PRE-RICH Emulator Reveal Conformance

# Canonical fresh-artifact emulator evidence path.
# P2.8 gate: exercise the current EconomicKernel import fix on every workflow change.
# This workflow must rebuild Plutus artifacts from the exact checkout before Reveal evidence.

on:
  push:
    branches:
      - work/immortal-green-closure
    paths:
      - "src/__tests__/immortal-cardano-reveal-emulator-b1.mjs"
      - "src/__tests__/immortal-cardano-emulator-smoke.mjs"
      - "src/plutusScripts/**"
      - "plutus/**"
      - "PRE-RICH/**"
      - "src/gameFlow.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pre-rich-emulator-reveal.yml"\n      - ".github/actions/setup-plutus/**"
  workflow_dispatch:

jobs:
  emulator-reveal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Normalize Lucid ESM entrypoint
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs"
          const p="node_modules/lucid-cardano/package.json"
          const x=JSON.parse(fs.readFileSync(p,"utf8"))
          if (!fs.existsSync("node_modules/lucid-cardano/esm/mod.js")) throw new Error("lucid-cardano ESM entrypoint missing")
          x.type="module"
          x.exports={".":{types:"./types/mod.d.ts",import:"./esm/mod.js"}}
          fs.writeFileSync(p, JSON.stringify(x,null,2)+"\n")
          NODE
      - name: Setup canonical Plutus CI
        uses: ./.github/actions/setup-plutus

      - name: Build and export fresh Plutus artifacts
        run: cabal run exe:export-scripts
      - name: Run isolated emulator smoke
        run: node src/__tests__/immortal-cardano-emulator-smoke.mjs
      - name: Run real PRE-RICH Reveal emulator conformance
        run: node src/__tests__/immortal-cardano-reveal-emulator-b1.mjs
