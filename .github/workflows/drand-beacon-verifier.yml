name: IMMORTAL drand Beacon Verification PoC

on:
  workflow_dispatch:
    inputs:
      round:
        description: "Preselected Quicknet round to verify"
        required: true
        default: "42"
        type: string
  push:
    branches:
      - work/b3-materios-provenance-evidence
    paths:
      - "poc/drand-beacon-verifier/**"
      - ".github/workflows/drand-beacon-verifier.yml"

permissions:
  contents: read

concurrency:
  group: drand-beacon-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aiken-compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Aiken
        uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.23
      - name: Isolate silent Aiken compiler failure
        working-directory: poc/drand-beacon-verifier/cardano
        env:
          RUST_BACKTRACE: full
          RUST_LOG: trace
        run: |
          set +e
          set -uo pipefail
          aiken --version

          echo "=== Check CLI diagnostics ==="
          aiken check --help > /tmp/aiken-check-help.log 2>&1
          cat /tmp/aiken-check-help.log

          echo "=== Minimal project smoke test ==="
          tmp="$(mktemp -d)"
          cp aiken.toml "$tmp/aiken.toml"
          mkdir -p "$tmp/lib" "$tmp/validators"
          printf 'pub fn smoke() -> Bool { True }\n' > "$tmp/lib/smoke.ak"
          (cd "$tmp" && aiken check) > /tmp/aiken-smoke.log 2>&1
          smoke_status=$?
          cat /tmp/aiken-smoke.log
          echo "aiken_smoke_exit=${smoke_status}"

          echo "=== Type-check current project without running tests ==="
          aiken check --skip-tests > /tmp/aiken-types.log 2>&1
          type_status=$?
          cat /tmp/aiken-types.log
          echo "aiken_typecheck_exit=${type_status}"

          echo "=== Isolate validator module ==="
          tmp_validator="$(mktemp -d)"
          cp aiken.toml "$tmp_validator/aiken.toml"
          cp -R lib "$tmp_validator/lib"
          mkdir -p "$tmp_validator/validators"
          (cd "$tmp_validator" && aiken check --skip-tests) > /tmp/aiken-no-validator.log 2>&1
          no_validator_status=$?
          cat /tmp/aiken-no-validator.log
          echo "aiken_without_validator_exit=${no_validator_status}"

          echo "=== Isolate validator body and types ==="
          tmp_val="$(mktemp -d)"
          cp aiken.toml "$tmp_val/aiken.toml"
          cp -R lib "$tmp_val/lib"
          mkdir -p "$tmp_val/validators"
          cat > "$tmp_val/validators/drand.ak" <<'AIKEN'
          use cardano/transaction.{OutputReference, Transaction}
          validator drand_beacon_verifier {
            spend(_datum: Option<Data>, _witness: Data, _own_ref: OutputReference, _context: Transaction) {
              True
            }
            else(_) {
              fail
            }
          }
          AIKEN
          (cd "$tmp_val" && aiken check --skip-tests) > /tmp/aiken-validator-stub.log 2>&1
          validator_stub_status=$?
          cat /tmp/aiken-validator-stub.log
          echo "aiken_validator_stub_exit=${validator_stub_status}"

          cat > "$tmp_val/validators/drand.ak" <<'AIKEN'
          use cardano/transaction.{OutputReference, Transaction}
          use immortal/drand-beacon-verifier/drand.{BeaconWitness, verify_quicknet_signature}
          validator drand_beacon_verifier {
            spend(_datum: Option<Data>, witness: BeaconWitness, _own_ref: OutputReference, _context: Transaction) {
              verify_quicknet_signature(witness.round, witness.signature, witness.public_key)
            }
            else(_) {
              fail
            }
          }
          AIKEN
          (cd "$tmp_val" && aiken check --skip-tests) > /tmp/aiken-validator-real.log 2>&1
          validator_real_status=$?
          cat /tmp/aiken-validator-real.log
          echo "aiken_validator_real_exit=${validator_real_status}"

          echo "=== Isolate drand module body ==="
          tmp_module="$(mktemp -d)"
          cp aiken.toml "$tmp_module/aiken.toml"
          mkdir -p "$tmp_module/lib" "$tmp_module/validators"
          cat > "$tmp_module/lib/drand.ak" <<'AIKEN'
          pub type BeaconWitness {
            round: Int,
            signature: ByteArray,
            public_key: ByteArray,
          }

          pub fn verify_quicknet_signature(
            round: Int,
            signature: ByteArray,
            public_key: ByteArray,
          ) -> Bool {
            round >= 1 && round <= 18446744073709551615 && signature != #"" && public_key != #""
          }

          test round_42_uses_big_endian_u64() {
            42 == 42
          }
          AIKEN
          (cd "$tmp_module" && aiken check --skip-tests) > /tmp/aiken-module-stub.log 2>&1
          module_stub_status=$?
          cat /tmp/aiken-module-stub.log
          echo "aiken_module_stub_exit=${module_stub_status}"

          echo "=== Isolate Aiken builtin import ==="
          tmp_imports="$(mktemp -d)"
          cp aiken.toml "$tmp_imports/aiken.toml"
          mkdir -p "$tmp_imports/lib" "$tmp_imports/validators"
          cat > "$tmp_imports/lib/drand.ak" <<'AIKEN'
          use aiken/builtin
          pub fn smoke() -> Bool { True }
          AIKEN
          (cd "$tmp_imports" && aiken check --skip-tests) > /tmp/aiken-builtin-import.log 2>&1
          builtin_import_status=$?
          cat /tmp/aiken-builtin-import.log
          echo "aiken_builtin_import_exit=${builtin_import_status}"

          echo "=== Isolate BLS g2 import ==="
          cat > "$tmp_imports/lib/drand.ak" <<'AIKEN'
          use aiken/crypto/bls12_381/g2
          pub fn smoke() -> Bool { True }
          AIKEN
          (cd "$tmp_imports" && aiken check --skip-tests) > /tmp/aiken-g2-import.log 2>&1
          g2_import_status=$?
          cat /tmp/aiken-g2-import.log
          echo "aiken_g2_import_exit=${g2_import_status}"

          echo "=== Isolate integer_to_bytearray builtin ==="
          cat > "$tmp_imports/lib/drand.ak" <<'AIKEN'
          use aiken/builtin
          pub fn smoke() -> Bool {
            builtin.integer_to_bytearray(True, 8, 42) == #"000000000000002a"
          }
          AIKEN
          (cd "$tmp_imports" && aiken check --skip-tests) > /tmp/aiken-integer.log 2>&1
          integer_status=$?
          cat /tmp/aiken-integer.log
          echo "aiken_integer_to_bytearray_exit=${integer_status}"

          echo "=== Isolate builtin BLS expression ==="
          cat > "$tmp_imports/lib/drand.ak" <<'AIKEN'
          use aiken/builtin
          use aiken/crypto/bls12_381/g2
          const quicknet_dst = "BLS_SIG_BLS12381G1_XMD:SHA-256_SSWU_RO_NUL_"
          pub fn smoke() -> Bool {
            let message = builtin.sha2_256(#"000000000000002a")
            let point = builtin.bls12_381_g1_hash_to_group(message, quicknet_dst)
            builtin.bls12_381_g1_equal(point, point)
          }
          AIKEN
          (cd "$tmp_imports" && aiken check --skip-tests) > /tmp/aiken-bls.log 2>&1
          bls_status=$?
          cat /tmp/aiken-bls.log
          echo "aiken_bls_expression_exit=${bls_status}"

          echo "=== Current project build ==="
          aiken build > /tmp/aiken-build.log 2>&1
          build_status=$?
          cat /tmp/aiken-build.log
          echo "aiken_build_exit=${build_status}"
          find . -maxdepth 3 -type f -name 'plutus.json' -print

          exit $(( smoke_status != 0 || type_status != 0 || no_validator_status != 0 || validator_stub_status != 0 || validator_real_status != 0 || module_stub_status != 0 || builtin_import_status != 0 || g2_import_status != 0 || integer_status != 0 || bls_status != 0 || build_status != 0 ))

  offchain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned verifier dependency
        working-directory: poc/drand-beacon-verifier
        run: npm install --no-audit --no-fund
      - name: Run positive and adversarial off-chain verification tests
        working-directory: poc/drand-beacon-verifier
        run: npm test
      - name: Capture verified round evidence
        working-directory: poc/drand-beacon-verifier
        run: npm run capture
        env:
          DRAND_ROUND: ${{ inputs.round || '42' }}
      - name: Upload verified beacon evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortal-drand-verified-beacon
          path: poc/drand-beacon-verifier/out/DrandVerifiedBeacon.json
          if-no-files-found: warn
