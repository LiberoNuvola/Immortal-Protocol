name: IMMORTAL drand Beacon Verification PoC

on:
  workflow_dispatch:
    inputs:
      round:
        description: "Preselected Quicknet round to verify"
        required: true
        default: "42"
        type: string
  push:
    branches:
      - work/b3-materios-provenance-evidence
    paths:
      - "poc/drand-beacon-verifier/**"
      - ".github/workflows/drand-beacon-verifier.yml"

permissions:
  contents: read

concurrency:
  group: drand-beacon-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aiken-compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Aiken
        uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.23
      - name: Record compiler and compile diagnostics
        working-directory: poc/drand-beacon-verifier/cardano
        run: |
          set +e
          set -uo pipefail
          aiken --version

          echo "=== Aiken check ==="
          aiken check > /tmp/aiken-check.log 2>&1
          check_status=$?
          cat /tmp/aiken-check.log
          echo "aiken_check_exit=${check_status}"

          echo "=== Aiken build ==="
          aiken build > /tmp/aiken-build.log 2>&1
          build_status=$?
          cat /tmp/aiken-build.log
          echo "aiken_build_exit=${build_status}"

          echo "=== Generated artifacts ==="
          find . -maxdepth 3 -type f -name 'plutus.json' -print
          exit $(( check_status != 0 || build_status != 0 ))

  offchain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned verifier dependency
        working-directory: poc/drand-beacon-verifier
        run: npm install --no-audit --no-fund
      - name: Run positive and adversarial off-chain verification tests
        working-directory: poc/drand-beacon-verifier
        run: npm test
      - name: Capture verified round evidence
        working-directory: poc/drand-beacon-verifier
        run: npm run capture
        env:
          DRAND_ROUND: ${{ inputs.round || '42' }}
      - name: Upload verified beacon evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortal-drand-verified-beacon
          path: poc/drand-beacon-verifier/out/DrandVerifiedBeacon.json
          if-no-files-found: warn
