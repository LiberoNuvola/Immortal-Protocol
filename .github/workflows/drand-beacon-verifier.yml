name: IMMORTAL drand Beacon Verification PoC

on:
  workflow_dispatch:
    inputs:
      round:
        description: "Preselected Quicknet round to verify"
        required: true
        default: "42"
        type: string
  push:
    branches:
      - work/b3-materios-provenance-evidence
    paths:
      - "poc/drand-beacon-verifier/**"
      - ".github/workflows/drand-beacon-verifier.yml"

permissions:
  contents: read

concurrency:
  group: drand-beacon-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aiken-compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Aiken
        uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.24
      - name: Check, test, and build Plutus V3 verifier
        working-directory: poc/drand-beacon-verifier/cardano
        run: |
          set -euo pipefail
          aiken --version
          aiken check
          aiken build
          test -s plutus.json
          echo "Aiken verification passed; blueprint generated at poc/drand-beacon-verifier/cardano/plutus.json"

      - name: Setup Node for local ledger probe
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install isolated Lucid dependency
        run: npm install --prefix poc/drand-beacon-verifier/cardano --no-audit --no-fund

      - name: Install pinned Yaci DevKit
        run: npm install --global @bloxbean/yaci-devkit@0.12.0

      - name: Start local Cardano devnet
        run: |
          set -euo pipefail
          mkdir -p poc/drand-beacon-verifier/cardano/out
          nohup yaci-devkit up --enable-yaci-store --enable-kupomios > poc/drand-beacon-verifier/cardano/out/yaci.log 2>&1 &
          echo $! > poc/drand-beacon-verifier/cardano/out/yaci.pid

      - name: Wait for Yaci Store with Ogmios evaluator
        run: |
          set -euo pipefail
          OUT=poc/drand-beacon-verifier/cardano/out
          ready=0
          for i in $(seq 1 180); do
            if curl --connect-timeout 1 --max-time 2 --fail --silent http://127.0.0.1:8080/api/v1/epochs/latest > "$OUT/yaci-epoch.json"; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            tail -300 "$OUT/yaci.log" || true
            echo "YACI_STORE_READY=0"
            exit 1
          fi
          if ! grep -Fq "Yaci Store tx evaluator mode: ogmios" "$OUT/yaci.log"; then
            echo "YACI_OGMIOS_EVALUATOR_READY=0"
            tail -300 "$OUT/yaci.log" || true
            exit 1
          fi
          grep -F "Yaci Store tx evaluator mode: ogmios" "$OUT/yaci.log"
          echo "YACI_STORE_READY=1"
          echo "YACI_OGMIOS_EVALUATOR_READY=1"

      - name: Execute verifier against local Cardano ledger
        working-directory: poc/drand-beacon-verifier/cardano
        run: node ledger-evaluation.mjs
        env:
          YACI_STORE_API: http://127.0.0.1:8080/api/v1

      - name: Upload Plutus V3 ledger evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortal-drand-plutus-ledger-evidence
          path: |
            poc/drand-beacon-verifier/cardano/out/DrandPlutusLedgerEvidence.json
            poc/drand-beacon-verifier/cardano/out/yaci.log
            poc/drand-beacon-verifier/cardano/out/yaci-epoch.json
          if-no-files-found: warn

  offchain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned verifier dependency
        working-directory: poc/drand-beacon-verifier
        run: npm install --no-audit --no-fund
      - name: Run positive and adversarial off-chain verification tests
        working-directory: poc/drand-beacon-verifier
        run: npm test
      - name: Capture verified round evidence
        working-directory: poc/drand-beacon-verifier
        run: npm run capture
        env:
          DRAND_ROUND: ${{ inputs.round || '42' }}
      - name: Upload verified beacon evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortal-drand-verified-beacon
          path: poc/drand-beacon-verifier/out/DrandVerifiedBeacon.json
          if-no-files-found: warn
