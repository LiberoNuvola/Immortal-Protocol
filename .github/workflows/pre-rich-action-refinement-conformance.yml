name: PRE-RICH Action Refinement Conformance

on:
  push:
    branches:
      - work/immortal-green-closure
    paths:
      - "PRE-RICH/profile/PreRichIssueEvidence.ts"
      - "PRE-RICH/profile/PreRichExpireRefinement.ts"
      - "PRE-RICH/profile/PreRichCertifiedTicket.ts"
      - "PRE-RICH/profile/PreRichJackpotPolicy.ts"
      - "PRE-RICH/profile/PreRichExpiryPolicy.ts"
      - "src/__tests__/preRichIssueEvidence.test.ts"
      - "src/__tests__/preRichExpireRefinement.test.ts"
      - "src/__tests__/preRichExpiryEvidence.test.ts"
      - "src/__tests__/preRichCertifiedTicket.test.ts"
      - "src/__tests__/preRichJackpotPolicy.test.ts"
      - "src/ticket3d.ts"
      - "src/gameFlow.ts"
      - "src/txHelpers.ts"
      - ".github/workflows/pre-rich-action-refinement-conformance.yml"
      - "PRE-RICH/profile/PreRichCertifiedTicket.ts"
      - "PRE-RICH/profile/PreRichJackpotPolicy.ts"
      - "PRE-RICH/profile/PreRichExpiryPolicy.ts"
      - "src/ticket3d.ts"
      - "src/gameFlow.ts"
      - "src/txHelpers.ts"
      - "src/*.ts"
  pull_request:
    branches:
      - work/immortal-green-closure
    paths:
      - "PRE-RICH/profile/PreRichIssueEvidence.ts"
      - "PRE-RICH/profile/PreRichExpireRefinement.ts"
      - "src/__tests__/preRichIssueEvidence.test.ts"
      - "src/__tests__/preRichExpireRefinement.test.ts"
      - ".github/workflows/pre-rich-action-refinement-conformance.yml"

jobs:
  action-refinement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Issue and Expire refinement conformance
        run: npx vitest run src/__tests__/preRichIssueEvidence.test.ts src/__tests__/preRichExpiryEvidence.test.ts src/__tests__/preRichCertifiedTicket.test.ts src/__tests__/preRichJackpotPolicy.test.ts src/__tests__/preRichExpireRefinement.test.ts
      
      - name: Typecheck PRE-RICH presentation/refinement code
        run: npx tsc --noEmit
