name: PRE-RICH Cardano Emulator Reveal

on:
  push:
    branches:
      - work/immortal-green-closure
  pull_request:

permissions:
  contents: read

jobs:
  emulator-reveal:
    name: P2.8-B.1 real emulator reveal
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      P2_8_B1_BUDGET_PROBE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnostic: swap legacy Lucid evaluator to 0.10.10
        run: npm install --no-save --package-lock=false lucid-cardano@0.10.10

      - name: Run real emulator reveal
        run: node src/__tests__/immortal-cardano-reveal-emulator-b1.mjs
