name: PRE-RICH ProtectedCapital source census tests

on:
  workflow_dispatch:
  push:
    branches:
      - work/immortal-green-closure
    paths:
      - audit/cardano-integration/preprod-protected-capital-census.mjs
      - relayer/koiosProtectedCapitalSourceCensus.js
      - relayer/koiosProtectedCapitalSourceCensus.test.js
      - PRE-RICH/src/PreRichProtectedCapitalItemLedger.ts
      - PRE-RICH/tests/conformance/PC-item-ledger-source-census.conformance.test.ts
      - .github/workflows/pre-rich-protected-capital-ticket-census.yml
  pull_request:
    paths:
      - audit/cardano-integration/preprod-protected-capital-census.mjs
      - relayer/koiosProtectedCapitalSourceCensus.js
      - relayer/koiosProtectedCapitalSourceCensus.test.js
      - PRE-RICH/src/PreRichProtectedCapitalItemLedger.ts
      - PRE-RICH/tests/conformance/PC-item-ledger-source-census.conformance.test.ts
      - .github/workflows/pre-rich-protected-capital-ticket-census.yml

permissions:
  contents: read

jobs:
  source-census-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run Koios provider pagination and provenance tests
        run: node --test relayer/koiosProtectedCapitalSourceCensus.test.js
      - name: Run ProtectedCapital item-ledger conformance tests
        run: npx vitest run PRE-RICH/tests/conformance/PC-item-ledger-source-census.conformance.test.ts
