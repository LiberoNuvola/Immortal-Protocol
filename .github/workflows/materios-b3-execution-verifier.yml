name: Materios B3 execution-proof verifier

concurrency:
  group: materios-b3-execution-verifier-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      run_live_execution_proof:
        description: Acquire a real Materios committee execution proof and verify it with Rust
        required: false
        type: boolean
        default: false
  push:
    branches:
      - work/immortal-green-closure
    paths:
      - "poc/materios-execution-verifier/**"
      - "poc/materios-checkpoint/**"
      - "poc/materios-grandpa/**"
      - ".github/workflows/materios-b3-execution-verifier.yml"
  pull_request:
    branches:
      - b1-hardening
    paths:
      - "poc/materios-execution-verifier/**"
      - "poc/materios-checkpoint/**"
      - ".github/workflows/materios-b3-execution-verifier.yml"

jobs:
  verifier:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: poc/materios-execution-verifier

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "poc/materios-execution-verifier"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run verifier tests
        run: cargo test

  checkpoint-typescript:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: poc/materios-checkpoint/package-lock.json

      - name: Install Materios checkpoint dependencies
        run: npm ci --prefix poc/materios-checkpoint

      - name: Typecheck checkpoint and B3-C collector
        run: npm --prefix poc/materios-checkpoint run typecheck

      - name: Test execution-proof packet bindings
        run: npm --prefix poc/materios-checkpoint run test:execution-proof

      - name: Test B3 RPC transport and exact-block bindings
        run: npm --prefix poc/materios-checkpoint run test:rpc-b3

      - name: Test on-chain attestation evidence decoding and membership checks
        run: npm --prefix poc/materios-checkpoint run test:attestation-evidence

  live-execution-proof:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_execution_proof == true
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: poc/materios-checkpoint/package-lock.json

      - name: Install Materios checkpoint dependencies
        run: npm ci --prefix poc/materios-checkpoint

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "poc/materios-execution-verifier"

      - name: Capture real execution proof and invoke existing Rust verifier
        run: npm --prefix poc/materios-checkpoint run capture:verify:execution
        env:
          MATERIOS_RPC: https://materios.fluxpointstudios.com/preprod-rpc
          MATERIOS_CHAIN_ID: materios_preprod_v6
          MATERIOS_B3_BLOCK_HASH: ${{ vars.MATERIOS_B3_BLOCK_HASH }}
          MATERIOS_B3_AUTHORITY_SELECTION_INPUTS_HEX: ${{ vars.MATERIOS_B3_AUTHORITY_SELECTION_INPUTS_HEX }}
          MATERIOS_B3_SIDECHAIN_EPOCH: ${{ vars.MATERIOS_B3_SIDECHAIN_EPOCH }}
          MATERIOS_B3_CARDANO_EPOCH_NONCE_HEX: ${{ vars.MATERIOS_B3_CARDANO_EPOCH_NONCE_HEX }}
          MATERIOS_B3_GENESIS_UTXO_HEX: ${{ vars.MATERIOS_B3_GENESIS_UTXO_HEX }}
          MATERIOS_B3_SELECTION_PATH_KIND: ${{ vars.MATERIOS_B3_SELECTION_PATH_KIND }}
          MATERIOS_B3_SELECTION_PATH_EVIDENCE_HASH: ${{ vars.MATERIOS_B3_SELECTION_PATH_EVIDENCE_HASH }}
          MATERIOS_B3_SELECTION_PATH_UNTIL_EPOCH: ${{ vars.MATERIOS_B3_SELECTION_PATH_UNTIL_EPOCH }}
          MATERIOS_B3_AUTHORITY_COMMITMENT: ${{ vars.MATERIOS_B3_AUTHORITY_COMMITMENT }}

      - name: Upload B3-C execution-proof packet and Rust attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: materios-b3c-execution-proof
          path: poc/materios-checkpoint/out/b3c/
          if-no-files-found: warn

  finalized-state-capture:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: poc/materios-checkpoint/package-lock.json

      - name: Install Materios checkpoint dependencies
        run: npm ci --prefix poc/materios-checkpoint

      - name: Capture finalized Materios checkpoint
        working-directory: poc/materios-checkpoint
        run: npm run capture:finalized
        env:
          MATERIOS_RPC: https://materios.fluxpointstudios.com/preprod-rpc
          MATERIOS_CHAIN_ID: materios_preprod_v6

      - name: Upload finalized-state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: materios-b3a-finalized-state-capture
          path: poc/materios-checkpoint/out/MateriosFinalizedStateCapture.json
          if-no-files-found: error

  real-grandpa-witness:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install GRANDPA verifier dependencies
        run: npm install --prefix poc/materios-grandpa

      - name: Typecheck GRANDPA verifier
        working-directory: poc/materios-grandpa
        run: npm run typecheck

      - name: Compare public Materios RPC justification retention
        env:
          MATERIOS_RPC_PRIMARY: https://materios.fluxpointstudios.com/rpc
          MATERIOS_RPC_LEGACY: https://materios.fluxpointstudios.com/preprod-rpc
        run: |
          node <<'NODE'
          const urls = [process.env.MATERIOS_RPC_PRIMARY, process.env.MATERIOS_RPC_LEGACY];
          async function rpc(url, method, params=[]) {
            const r = await fetch(url, {
              method: 'POST',
              headers: {'content-type':'application/json'},
              body: JSON.stringify({jsonrpc:'2.0',id:1,method,params}),
            });
            const b = await r.json();
            if (b.error) throw new Error(String(b.error.code) + ' ' + String(b.error.message));
            return b.result;
          }
          for (const url of urls) {
            try {
              const tip = await rpc(url, 'chain_getFinalizedHead');
              const block = await rpc(url, 'chain_getBlock', [tip]);
              const js = block && block.justifications;
              console.log(JSON.stringify({
                url,
                finalizedHead: tip,
                justificationsKind: js === null ? 'null' : Array.isArray(js) ? 'array' : typeof js,
                justificationCount: Array.isArray(js) ? js.length : null,
                engines: Array.isArray(js) ? js.map(x => x && x[0]) : null
              }));
            } catch (e) {
              console.log(JSON.stringify({url,error:String(e)}));
            }
          }
          NODE

      - name: Capture and verify real Materios GRANDPA witness
        working-directory: poc/materios-grandpa
        run: npx tsx src/capture-real-witness.ts
        env:
          MATERIOS_RPC: https://materios.fluxpointstudios.com/rpc
          MATERIOS_CHAIN_ID: materios_preprod_v6
          MATERIOS_WITNESS_LOOKBACK: 768
          MATERIOS_BLOCK_BATCH_SIZE: 64

      - name: Upload real GRANDPA witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: materios-real-grandpa-witness
          path: poc/materios-grandpa/out/MateriosRealGrandpaWitness.json
          if-no-files-found: error

  live-storage-proof:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: poc/materios-checkpoint/package-lock.json

      - name: Install Materios checkpoint dependencies
        run: npm ci --prefix poc/materios-checkpoint

      - name: Setup Python for metadata-aware historical event decoding
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Substrate metadata decoder
        run: python -m pip install "substrate-interface>=1.7.0,<2.0"

      - name: Test historical attestation event proof validation
        run: python poc/materios-checkpoint/test-attestation-event-proofs.py

      - name: Diagnose Materios Preprod historical-state retention
        run: |
          python3 - <<'PY'
          import json
          from substrateinterface import SubstrateInterface

          block_number = 2507143
          receipt_key = "0xf2f45ef88f71bc25f444a160450145be5087a88ab53079a394ab62a465d4618308417218f0ac29efed5cc8f0ba063d27279c26e797ac8aab732344a7702ba5e985e420c0677232a833bff60c2d1791b7"
          endpoints = [
              "wss://materios.fluxpointstudios.com/preprod-rpc",
              "wss://materios.fluxpointstudios.com/rpc",
          ]
          observations = []
          for endpoint in endpoints:
              try:
                  substrate = SubstrateInterface(url=endpoint, ss58_format=42)
                  genesis = substrate.get_block_hash(0)
                  block_hash = substrate.get_block_hash(block_number)
                  item = {"endpoint": endpoint, "genesis_hash": genesis, "block_hash": block_hash}
                  if block_hash:
                      header = substrate.rpc_request("chain_getHeader", [block_hash])
                      storage = substrate.rpc_request("state_getStorage", [receipt_key, block_hash])
                      proof = substrate.rpc_request("state_getReadProof", [[receipt_key], block_hash])
                      item["header_available"] = bool(header.get("result"))
                      item["state_available"] = bool(storage.get("result"))
                      item["read_proof_available"] = bool(proof.get("result", {}).get("proof"))
                      item["read_proof_nodes"] = len(proof.get("result", {}).get("proof", []))
                  observations.append(item)
              except Exception as exc:
                  observations.append({"endpoint": endpoint, "error": str(exc)})
          print(json.dumps(observations, indent=2))
          same_genesis = (
              len(observations) == 2
              and observations[0].get("genesis_hash")
              and observations[0].get("genesis_hash") == observations[1].get("genesis_hash")
          )
          print("MATERIOS_RPC_ENDPOINTS_SAME_GENESIS=", bool(same_genesis))
          PY

      - name: Typecheck live proof capture
        working-directory: poc/materios-checkpoint
        run: npm run typecheck

      - name: Capture live Preprod storage proof
        working-directory: poc/materios-checkpoint
        run: npx tsx src/capture-storage-proof.ts
        env:
          MATERIOS_RPC: https://materios.fluxpointstudios.com/preprod-rpc
          MATERIOS_EVENTS: https://materios.fluxpointstudios.com/preprod-events

      - name: Capture historical System.Events proofs for receipt attestations
        run: python poc/materios-checkpoint/scripts/capture-attestation-event-proofs.py
        env:
          MATERIOS_RPC_WS: wss://materios.fluxpointstudios.com/preprod-rpc
          MATERIOS_ATTESTATION_EVENT_LOOKBACK: "1024"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "poc/materios-execution-verifier"

      - name: Native verification of live storage proof
        run: >
          cargo run --manifest-path poc/materios-execution-verifier/Cargo.toml
          --bin verify-storage-proof --
          poc/materios-checkpoint/out/b3b-state-root.hex
          poc/materios-checkpoint/out/b3b-storage-key.hex
          poc/materios-checkpoint/out/b3b-storage-value.hex
          poc/materios-checkpoint/out/b3b-proof-scale.hex

      - name: Native verification of exact-block committee snapshot
        run: |
          cargo run --manifest-path poc/materios-execution-verifier/Cargo.toml --bin verify-storage-proof -- \
            poc/materios-checkpoint/out/b3b-state-root.hex \
            poc/materios-checkpoint/out/b3b-committee-members-key.hex \
            poc/materios-checkpoint/out/b3b-committee-members-value.hex \
            poc/materios-checkpoint/out/b3b-committee-proof-scale.hex
          cargo run --manifest-path poc/materios-execution-verifier/Cargo.toml --bin verify-storage-proof -- \
            poc/materios-checkpoint/out/b3b-state-root.hex \
            poc/materios-checkpoint/out/b3b-attestation-threshold-key.hex \
            poc/materios-checkpoint/out/b3b-attestation-threshold-value.hex \
            poc/materios-checkpoint/out/b3b-committee-proof-scale.hex

      - name: Native verification of every historical System.Events proof
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          root = pathlib.Path("poc/materios-checkpoint/out/attestation-events")
          manifest = json.loads((root / "proof-blocks.json").read_text())
          proofs = manifest.get("proofs", [])
          if not proofs:
              raise SystemExit("no historical System.Events proofs were captured")

          for item in proofs:
              files = item["files"]
              command = [
                  "cargo", "run", "--quiet",
                  "--manifest-path", "poc/materios-execution-verifier/Cargo.toml",
                  "--bin", "verify-storage-proof", "--",
                  str(root / files["state_root"]),
                  str(root / files["storage_key"]),
                  str(root / files["storage_value"]),
                  str(root / files["proof_scale"]),
              ]
              print("Verifying System.Events at block", item["block_number"], item["block_hash"])
              subprocess.run(command, check=True)

          print("All historical System.Events storage proofs verified:", len(proofs))
          PY

      - name: Upload B3-B live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: materios-b3b-live-storage-proof
          path: |
            poc/materios-checkpoint/out/MateriosB3BLiveStorageProof.json
            poc/materios-checkpoint/out/b3b-state-root.hex
            poc/materios-checkpoint/out/b3b-storage-key.hex
            poc/materios-checkpoint/out/b3b-storage-value.hex
            poc/materios-checkpoint/out/b3b-proof-scale.hex
            poc/materios-checkpoint/out/b3b-committee-members-key.hex
            poc/materios-checkpoint/out/b3b-committee-members-value.hex
            poc/materios-checkpoint/out/b3b-attestation-threshold-key.hex
            poc/materios-checkpoint/out/b3b-attestation-threshold-value.hex
            poc/materios-checkpoint/out/b3b-committee-proof-scale.hex
            poc/materios-checkpoint/out/attestation-events/
          if-no-files-found: error
