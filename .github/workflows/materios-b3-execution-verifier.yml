name: Materios B3 execution-proof verifier

concurrency:
  group: materios-b3-execution-verifier-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - work/immortal-green-closure
    paths:
      - "poc/materios-execution-verifier/**"
      - "poc/materios-checkpoint/**"
      - ".github/workflows/materios-b3-execution-verifier.yml"
  pull_request:
    branches:
      - b1-hardening
    paths:
      - "poc/materios-execution-verifier/**"
      - "poc/materios-checkpoint/**"
      - ".github/workflows/materios-b3-execution-verifier.yml"

jobs:
  verifier:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: poc/materios-execution-verifier

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "poc/materios-execution-verifier"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run verifier tests
        run: cargo test

  live-storage-proof:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Materios checkpoint dependencies
        run: npm ci --prefix poc/materios-checkpoint

      - name: Typecheck live proof capture
        working-directory: poc/materios-checkpoint
        run: npm run typecheck

      - name: Discover latest finalized AvailabilityCertified event
        id: certification
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet 'substrate-interface>=1.7.0,<2.0'
          python - <<'PY'
          import os
          from substrateinterface import SubstrateInterface

          substrate = SubstrateInterface(
              url=os.environ["MATERIOS_RPC_WS"],
          )

          head = substrate.get_chain_finalised_head()
          head_number = substrate.get_block_number(head)

          from concurrent.futures import ThreadPoolExecutor, as_completed

          errors = 0
          first_errors = []
          found = []

          def scan(number):
              block_hash = substrate.get_block_hash(number)
              if not block_hash:
                  return None

              try:
                  events = substrate.get_events(block_hash=block_hash)
              except Exception as exc:
                  return ("error", number, type(exc).__name__, str(exc))

              for event in events:
                  value = event.value
                  if (
                      value.get("module_id") == "OrinqReceipts"
                      and value.get("event_id") == "AvailabilityCertified"
                  ):
                      attrs = value["attributes"]
                      receipt_id = attrs["receipt_id"]
                      cert_hash = attrs["cert_hash"]

                      if not isinstance(receipt_id, str) or not isinstance(cert_hash, str):
                          return ("bad", number, "", "non-string AvailabilityCertified payload")

                      if not receipt_id.startswith("0x"):
                          receipt_id = "0x" + receipt_id
                      if not cert_hash.startswith("0x"):
                          cert_hash = "0x" + cert_hash

                      if len(receipt_id) != 66 or len(cert_hash) != 66:
                          return ("bad", number, "", "invalid AvailabilityCertified hash length")

                      return ("found", number, receipt_id, cert_hash, block_hash)

              return None

          start_block = max(0, head_number - 1023)

          with ThreadPoolExecutor(max_workers=16) as pool:
              futures = [
                  pool.submit(scan, number)
                  for number in range(head_number, start_block - 1, -1)
              ]

              for future in as_completed(futures):
                  result = future.result()
                  if result is None:
                      continue

                  if result[0] == "error":
                      errors += 1
                      if len(first_errors) < 5:
                          first_errors.append(
                              f"{result[1]}: {result[2]}: {result[3]}"
                          )
                      continue

                  if result[0] == "found":
                      found.append(result)
                      print(
                          "found AvailabilityCertified:",
                          result[1],
                          result[2],
                          result[3],
                      )
                      break

          if found:
              _, number, receipt_id, cert_hash, block_hash = found[0]

              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("receipt_id=" + receipt_id + "\n")
                  out.write("certified_block=" + str(number) + "\n")
                  out.write("cert_hash=" + cert_hash + "\n")
                  out.write("block_hash=" + block_hash + "\n")

              print("receipt_id:", receipt_id)
              print("certified_block:", number)
              print("cert_hash:", cert_hash)
              print("block_hash:", block_hash)
              raise SystemExit(0)

          print("event_decode_errors:", errors)
          for message in first_errors:
              print("event_decode_error:", message)

          raise SystemExit(
              "no AvailabilityCertified event found in last 1024 finalized blocks"
          )
          PY
        env:
          MATERIOS_RPC_WS: https://materios.fluxpointstudios.com/preprod-rpc

      - name: Capture live Preprod storage proof
        working-directory: poc/materios-checkpoint
        run: npx tsx src/capture-storage-proof.ts
        env:
          MATERIOS_RPC: https://materios.fluxpointstudios.com/preprod-rpc
          MATERIOS_FIREHOSE: https://materios.fluxpointstudios.com/api/firehose/stream
          MATERIOS_EVENTS: https://materios.fluxpointstudios.com/preprod-events
          MATERIOS_RECEIPT_ID: ${{ steps.certification.outputs.receipt_id }}
          MATERIOS_CERTIFIED_BLOCK: ${{ steps.certification.outputs.certified_block }}
          MATERIOS_CERT_HASH: ${{ steps.certification.outputs.cert_hash }}
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "poc/materios-execution-verifier"

      - name: Native verification of live storage proof
        run: >
          cargo run --manifest-path poc/materios-execution-verifier/Cargo.toml
          --bin verify-storage-proof --
          poc/materios-checkpoint/out/b3b-state-root.hex
          poc/materios-checkpoint/out/b3b-storage-key.hex
          poc/materios-checkpoint/out/b3b-storage-value.hex
          poc/materios-checkpoint/out/b3b-proof-scale.hex

      - name: Upload B3-B live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: materios-b3b-live-storage-proof
          path: poc/materios-checkpoint/out/
          if-no-files-found: error
