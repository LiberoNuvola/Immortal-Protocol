name: Materios B3 execution-proof verifier

concurrency:
  group: materios-b3-execution-verifier-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  # Automatic evidence run on relevant pushes to the dedicated Agent C branch.
  push:
    branches:
      - work/b3-materios-provenance-evidence
    paths:
      - "poc/materios-execution-verifier/**"
      - "poc/materios-checkpoint/**"
      - "poc/materios-grandpa/**"
      - ".github/workflows/materios-b3-execution-verifier.yml"
      - ".github/scripts/probe-materios-snapshot-state.sh"
  pull_request:
    branches:
      - b1-hardening
    paths:
      - "poc/materios-execution-verifier/**"
      - "poc/materios-checkpoint/**"
      - ".github/workflows/materios-b3-execution-verifier.yml"

jobs:
  verifier:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: poc/materios-execution-verifier

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "poc/materios-execution-verifier"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run verifier tests
        run: cargo test

  finalized-state-capture:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Materios checkpoint dependencies
        run: npm ci --prefix poc/materios-checkpoint

      - name: Capture finalized Materios checkpoint
        working-directory: poc/materios-checkpoint
        run: npm run capture:finalized
        env:
          MATERIOS_RPC: https://materios.fluxpointstudios.com/preprod-rpc
          MATERIOS_CHAIN_ID: materios_preprod_v6

      - name: Upload finalized-state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: materios-b3a-finalized-state-capture
          path: poc/materios-checkpoint/out/MateriosFinalizedStateCapture.json
          if-no-files-found: error


  real-grandpa-witness:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install GRANDPA verifier dependencies
        run: npm install --prefix poc/materios-grandpa

      - name: Typecheck GRANDPA verifier
        working-directory: poc/materios-grandpa
        run: npm run typecheck

      - name: Compare public Materios RPC justification retention
        env:
          MATERIOS_RPC_PRIMARY: https://materios.fluxpointstudios.com/rpc
          MATERIOS_RPC_LEGACY: https://materios.fluxpointstudios.com/preprod-rpc
          MATERIOS_ARCHIVE_RPC: ${{ secrets.MATERIOS_ARCHIVE_RPC }}
        run: |
          node <<'NODE'
          function rpcFailure(e) {
            const message = e instanceof Error ? e.message : '';
            if (message.includes('-32601 Method not found')) return {code: -32601, classification: 'method-not-found'};
            if (message.includes('-32602 Invalid params')) return {code: -32602, classification: 'invalid-params'};
            return {classification: 'transport-or-rpc-error', errorType: e instanceof Error ? e.name : typeof e};
          }
          const archiveUrl = process.env.MATERIOS_ARCHIVE_RPC?.trim();
          const sources = [
            {source: 'public-primary', url: process.env.MATERIOS_RPC_PRIMARY},
            {source: 'public-legacy', url: process.env.MATERIOS_RPC_LEGACY},
            ...(archiveUrl ? [{source: 'configured-archive-rpc', url: archiveUrl}] : []),
          ];
          console.log(JSON.stringify({archiveRpcConfigured: Boolean(archiveUrl)}));
          async function rpc(url, method, params=[]) {
            const r = await fetch(url, {
              method: 'POST',
              headers: {'content-type':'application/json'},
              body: JSON.stringify({jsonrpc:'2.0',id:1,method,params}),
            });
            const b = await r.json();
            if (b.error) throw new Error(String(b.error.code) + ' ' + String(b.error.message));
            return b.result;
          }
          for (const {source, url} of sources) {
            try {
              const tip = await rpc(url, 'chain_getFinalizedHead');
              const block = await rpc(url, 'chain_getBlock', [tip]);
              const js = block && block.justifications;
              const numberHex = block && block.block && block.block.header && block.block.header.number;
              let finalityProofProbe;
              if (typeof numberHex !== 'string' || !/^0x[0-9a-f]+$/i.test(numberHex)) {
                finalityProofProbe = {status: 'unavailable', classification: 'invalid-block-number'};
              } else {
                const blockNumber = Number(BigInt(numberHex));
                if (!Number.isSafeInteger(blockNumber)) {
                  finalityProofProbe = {status: 'unavailable', classification: 'unsafe-block-number'};
                } else {
                  try {
                    const proof = await rpc(url, 'grandpa_proveFinality', [blockNumber]);
                    finalityProofProbe = {
                      status: proof === null ? 'null' : 'captured',
                      resultType: proof === null ? 'null' : typeof proof,
                      bytes: typeof proof === 'string' && /^0x[0-9a-f]*$/i.test(proof) ? (proof.length - 2) / 2 : null,
                    };
                  } catch (e) {
                    finalityProofProbe = {status: 'unavailable', ...rpcFailure(e)};
                  }
                }
              }
              console.log(JSON.stringify({
                source,
                finalizedHead: tip,
                finalizedBlockNumber: typeof numberHex === 'string' && /^0x[0-9a-f]+$/i.test(numberHex) ? Number(BigInt(numberHex)) : null,
                grandpaProveFinality: finalityProofProbe,
                justificationsKind: js === null ? 'null' : Array.isArray(js) ? 'array' : typeof js,
                justificationCount: Array.isArray(js) ? js.length : null,
                engines: Array.isArray(js) ? js.map(x => x && x[0]) : null
              }));
            } catch (e) {
              console.log(JSON.stringify({source, error: rpcFailure(e)}));
            }
          }
          NODE
      - name: Install pinned WebSocket probe dependencies
        run: npm ci --prefix poc/materios-checkpoint

      - name: Capture raw historical FRNK candidate over WebSocket
        working-directory: poc/materios-checkpoint
        run: node src/probe-websocket-rpc-capabilities.mjs
        env:
          MATERIOS_FINALITY_CANDIDATE_BLOCK_NUMBER: 2509824
          MATERIOS_FINALITY_CANDIDATE_FORCE: "true"
          MATERIOS_WS_EVIDENCE_OUT: out/MateriosWebSocketRpcProbe.json

      - name: Capture raw historical FRNK candidate over primary WebSocket route
        working-directory: poc/materios-checkpoint
        run: node src/probe-websocket-rpc-capabilities.mjs
        env:
          MATERIOS_WS: wss://materios.fluxpointstudios.com/rpc
          MATERIOS_FINALITY_CANDIDATE_BLOCK_NUMBER: 2509824
          MATERIOS_FINALITY_CANDIDATE_FORCE: "true"
          MATERIOS_WS_EVIDENCE_OUT: out/MateriosWebSocketRpcProbePrimary.json

      - name: Probe retained state in official Materios snapshot
        id: snapshot_state_probe
        continue-on-error: true
        run: bash .github/scripts/probe-materios-snapshot-state.sh

      - name: Capture and verify real Materios GRANDPA witness
        working-directory: poc/materios-grandpa
        run: npx tsx src/capture-real-witness.ts
        env:
          MATERIOS_RPC: https://materios.fluxpointstudios.com/preprod-rpc
          # Prefer the checksum-verified local snapshot state window; it is not an archive node.
          # The local fallback is diagnostic and never closes authority-set provenance.
          MATERIOS_AUTHORITY_RPC: ${{ steps.snapshot_state_probe.outputs.rpc_url || secrets.MATERIOS_ARCHIVE_RPC }}
          MATERIOS_SNAPSHOT_STATE_EVIDENCE_PATH: ${{ github.workspace }}/poc/materios-grandpa/out/MateriosSnapshotStateProbe.json
          MATERIOS_CHAIN_ID: materios_preprod_v6
          MATERIOS_WITNESS_LOOKBACK: 1024
          MATERIOS_WS_EVIDENCE_PATH: ${{ github.workspace }}/poc/materios-checkpoint/out/MateriosWebSocketRpcProbe.json
          MATERIOS_BLOCK_BATCH_SIZE: 64

      - name: Upload Materios snapshot state probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: materios-snapshot-state-probe
          path: poc/materios-grandpa/out/MateriosSnapshotStateProbe.json
          if-no-files-found: warn

      - name: Upload Materios WebSocket route comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: materios-websocket-rpc-probes
          path: |
            poc/materios-checkpoint/out/MateriosWebSocketRpcProbe.json
            poc/materios-checkpoint/out/MateriosWebSocketRpcProbePrimary.json
          if-no-files-found: warn

      - name: Upload real GRANDPA witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: materios-real-grandpa-witness
          path: poc/materios-grandpa/out/MateriosRealGrandpaWitness.json
          if-no-files-found: error

  live-storage-proof:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Materios checkpoint dependencies
        run: npm ci --prefix poc/materios-checkpoint

      - name: Typecheck live proof capture
        working-directory: poc/materios-checkpoint
        run: npm run typecheck

      - name: Capture live Preprod storage proof
        working-directory: poc/materios-checkpoint
        run: npx tsx src/capture-storage-proof.ts
        env:
          MATERIOS_RPC: https://materios.fluxpointstudios.com/preprod-rpc
          MATERIOS_FIREHOSE: https://materios.fluxpointstudios.com/api/firehose/stream
          MATERIOS_EVENTS: https://materios.fluxpointstudios.com/preprod-events
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "poc/materios-execution-verifier"

      - name: Native verification of live storage proof
        run: >
          cargo run --manifest-path poc/materios-execution-verifier/Cargo.toml
          --bin verify-storage-proof --
          poc/materios-checkpoint/out/b3b-state-root.hex
          poc/materios-checkpoint/out/b3b-storage-key.hex
          poc/materios-checkpoint/out/b3b-storage-value.hex
          poc/materios-checkpoint/out/b3b-proof-scale.hex

      - name: Upload B3-B live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: materios-b3b-live-storage-proof
          path: |
            poc/materios-checkpoint/out/MateriosB3BLiveStorageProof.json
            poc/materios-checkpoint/out/b3b-state-root.hex
            poc/materios-checkpoint/out/b3b-storage-key.hex
            poc/materios-checkpoint/out/b3b-storage-value.hex
            poc/materios-checkpoint/out/b3b-proof-scale.hex
          if-no-files-found: error
