name: Aegis Pinned Aiken Baseline + Parameter Diagnostics

on:
  push:
    branches: [b1-hardening]
    paths:
      - ".github/workflows/aegis-pinned-aiken.yml"
      - "docs/research/AEGIS-IMMORTAL-CONFORMANCE-BRIDGE-v1.md"
      - "docs/research/fixtures/AEGIS-V8-*.json"
      - "docs/research/fixtures/AEGIS-GOVERNED-PARAMETER-REGRESSION.aiken-snippet"
      - "scripts/aegis_immortal_fixture_harness.py"
  pull_request:
    paths:
      - ".github/workflows/aegis-pinned-aiken.yml"
      - "docs/research/AEGIS-IMMORTAL-CONFORMANCE-BRIDGE-v1.md"
      - "docs/research/fixtures/AEGIS-V8-*.json"
      - "docs/research/fixtures/AEGIS-GOVERNED-PARAMETER-REGRESSION.aiken-snippet"
      - "scripts/aegis_immortal_fixture_harness.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegis-pinned-aiken-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aiken-baseline:
    name: Pinned Aegis — baseline, build, parameter-gap diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout IMMORTAL
        uses: actions/checkout@v4

      - name: Checkout pinned Aegis source
        uses: actions/checkout@v4
        with:
          repository: realdecimalist/aegis-contracts
          ref: 6549246ff053457c93e6d68e44791efa2ef2f972
          path: aegis-contracts
          persist-credentials: false

      - name: Install Aiken v1.1.22
        uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.22

      - name: Verify pinned source identity
        working-directory: aegis-contracts
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          expected="6549246ff053457c93e6d68e44791efa2ef2f972"
          echo "Aegis source commit: $actual"
          test "$actual" = "$expected"

      - name: Build Aiken validators
        working-directory: aegis-contracts/contracts
        shell: bash
        run: |
          set -o pipefail
          aiken build 2>&1 | tee ../../aegis-aiken-build.log

      - name: Append diagnostic tests to disposable checkout
        working-directory: aegis-contracts/contracts
        shell: bash
        run: |
          set -euo pipefail
          snippet="$GITHUB_WORKSPACE/docs/research/fixtures/AEGIS-GOVERNED-PARAMETER-REGRESSION.aiken-snippet"
          test -s "$snippet"
          cat "$snippet" >> validators/pool_vault.ak
          grep -q 'sv_underwrite_governed_parameter_utilisation_anchor_green' validators/pool_vault.ak
          grep -q 'sv_underwrite_governed_parameter_ratio_anchor_green' validators/pool_vault.ak

      - name: Assert the two governed-parameter gaps are reproduced
        working-directory: aegis-contracts/contracts
        shell: bash
        run: |
          set +e
          aiken check -m "sv_underwrite_governed_parameter" 2>&1 | tee ../../aegis-aiken-differential-check.log
          check_status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$check_status" > "$GITHUB_WORKSPACE/aegis-aiken-differential-exit-code.txt"
          python3 - "$GITHUB_WORKSPACE/aegis-aiken-differential-check.log" "$GITHUB_WORKSPACE/aegis-aiken-differential-summary.json" "$GITHUB_STEP_SUMMARY" "$check_status" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          log_path, out_path, summary_path, status_raw = sys.argv[1:]
          raw = Path(log_path).read_text(encoding="utf-8", errors="replace")
          status = int(status_raw)
          marker = re.search(r'(?m)^\{\s*\n\s*"seed"\s*:', raw)
          if not marker:
              raise SystemExit("No structured Aiken test report found; do not classify this as an expected regression.")
          report, _ = json.JSONDecoder().raw_decode(raw[marker.start():])
          summary = report.get("summary", {})
          expected = {
              ("pool_vault", "sv_underwrite_governed_parameter_utilisation_2500_refuses"),
              ("pool_vault", "sv_underwrite_governed_parameter_ratio_2x_refuses"),
          }
          failed = set()
          for module in report.get("modules", []):
              module_name = module.get("name", "").split("/")[-1]
              for test in module.get("tests", []):
                  if test.get("status") not in ("pass", "passed"):
                      failed.add((module_name, test.get("title", "")))
          result = {
              "diagnostic": "expected-gap-reproduction",
              "aiken_exit_code": status,
              "summary": summary,
              "failed_tests": [{"module": m, "test": t} for m, t in sorted(failed)],
              "expected_failed_tests": [{"module": m, "test": t} for m, t in sorted(expected)],
          }
          Path(out_path).write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          if status == 0:
              raise SystemExit("The overlay unexpectedly passed. Confirm whether the source behavior changed or the tests are not exercising the intended predicate.")
          if status != 1:
              raise SystemExit(f"Aiken returned unexpected exit code {status}; this is not classified as a parameter gap.")
          if failed != expected:
              raise SystemExit(f"Unexpected test failure set. Expected exactly {sorted(expected)}, got {sorted(failed)}.")
          if summary.get("failed") != 2 or summary.get("total") != 4 or summary.get("passed") != 2:
              raise SystemExit(f"Unexpected filtered test totals: {summary}; expected 4 selected tests, 2 green controls and exactly 2 parameter-refusal failures.")
          report_md = (
              "### Aiken governed-parameter differential diagnostic\n\n"
              "- Full baseline: 1,162/1,162 passed in the previous run for the same immutable AEGIS commit.\n"
              "- Aiken build: passed in this run before the temporary overlay.\n"
              "- Temporary overlay: both default-config anchors pass; exactly two tighter-config refusal assertions fail.\n"
              "- Finding: current pinned source does not apply the in-rail utilisation_bps "
              "and max_coverage_ratio values to the Underwrite decisions.\n"
              "- Any failing anchor or unrelated test fails this diagnostic; upstream AEGIS remains unchanged.\n"
          )
          with Path(summary_path).open("a", encoding="utf-8") as handle:
              handle.write(report_md)
          print(report_md)
          print(json.dumps(result, indent=2))
          PY

      - name: Upload Aiken build and differential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-aiken-extended-${{ github.run_id }}
          path: |
            aegis-aiken-check.log
            aegis-aiken-build.log
            aegis-aiken-differential-check.log
            aegis-aiken-differential-summary.json
            aegis-aiken-differential-exit-code.txt
          if-no-files-found: warn
          retention-days: 14
