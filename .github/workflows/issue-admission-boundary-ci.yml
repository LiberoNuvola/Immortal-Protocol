name: Issue Admission Boundary CI

on:
  push:
    branches:
      - work/immortal-green-closure
    paths:
      - "Adapter/CARDANO/runtime/**"
      - "Adapter/CARDANO/observation/**"
      - "relayer/preprodIssueAdmissionProvider.js"
      - "relayer/preprodIssueAdmissionProvider.test.mjs"
      - "relayer/preprodIssueObservationProvider.js"
      - "relayer/preprodIssueObservationReader.js"
      - "relayer/signedIssueAuthority.js"
      - "relayer/signedIssueAuthority.test.js"
      - "relayer/preprodIssueAuthorityEnvelope.js"
      - "relayer/preprodIssueAuthorityEnvelope.test.js"
      - "audit/cardano-integration/preprod-direct-usdm-approve.mjs"
      - "audit/cardano-integration/preprod-first-issue-readiness.mjs"
      - "audit/cardano-integration/preprod-first-issue-readiness.test.mjs"
      - ".github/workflows/pre-rich-b1-eev-approval.yml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/issue-admission-boundary-ci.yml"
  pull_request:
    paths:
      - "Adapter/CARDANO/runtime/**"
      - "Adapter/CARDANO/observation/**"
      - "relayer/preprodIssueAdmissionProvider.js"
      - "relayer/preprodIssueAdmissionProvider.test.mjs"
      - "relayer/preprodIssueObservationProvider.js"
      - "relayer/preprodIssueObservationReader.js"
      - "relayer/signedIssueAuthority.js"
      - "relayer/signedIssueAuthority.test.js"
      - "relayer/preprodIssueAuthorityEnvelope.js"
      - "relayer/preprodIssueAuthorityEnvelope.test.js"
      - "audit/cardano-integration/preprod-direct-usdm-approve.mjs"
      - "audit/cardano-integration/preprod-first-issue-readiness.mjs"
      - "audit/cardano-integration/preprod-first-issue-readiness.test.mjs"
      - ".github/workflows/pre-rich-b1-eev-approval.yml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/issue-admission-boundary-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-admission-boundary-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  adapter-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run Issue Admission boundary tests
        run: npx vitest run Adapter/CARDANO/runtime/__tests__/EconomicAdmission.test.ts --reporter=verbose
      - name: Reject caller-supplied Issue authority inputs
        run: node relayer/preprodIssueAdmissionProvider.test.mjs
      - name: Verify signed Issue authority and EEV approval digest binding
        run: node relayer/signedIssueAuthority.test.js
      - name: Verify signed Issue authority envelope end-to-end
        run: node relayer/preprodIssueAuthorityEnvelope.test.js
      - name: Verify first Issue readiness evidence-chain gate
        run: node audit/cardano-integration/preprod-first-issue-readiness.test.mjs
      - name: Syntax-check read-only first Issue readiness gate
        run: node --check audit/cardano-integration/preprod-first-issue-readiness.mjs
      - name: Typecheck adapter and boundary tests against locked Lucid
        run: >-
          npx tsc --noEmit --strict --target ES2020 --module ESNext
          --moduleResolution bundler --skipLibCheck --types node,vitest/globals
          Adapter/CARDANO/runtime/CardanoExecutionAdapter.ts
          Adapter/CARDANO/runtime/__tests__/EconomicAdmission.test.ts
