name: Cardano Ledger Audit Runner

on:
  workflow_dispatch:
  push:
    paths:
      - "audit/cardano-ledger-runner/**"
      - "src/plutusScripts/**"

jobs:
  build-and-safe-stall:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GHC and Cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6.7"
          cabal-version: "3.12.1.0"

      - name: Update Cabal index
        run: cabal update

      - name: Build ledger runner
        working-directory: audit/cardano-ledger-runner
        run: cabal build cardano-ledger-runner

      - name: Verify fail-closed behavior without synthetic evidence
        run: |
          set +e
          (cd audit/cardano-ledger-runner && cabal run cardano-ledger-runner -- --evidence-dir /tmp/nonexistent-immortal-evidence)
          rc=$?
          set -e
          test "$rc" -eq 0

      - name: Assert SAFE_STALL is explicit
        run: |
          output="$(cd audit/cardano-ledger-runner && cabal run cardano-ledger-runner -- --evidence-dir /tmp/nonexistent-immortal-evidence)"
          printf '%s\n' "$output"
          grep -q "RESULT: SAFE_STALL" <<< "$output"
          grep -q "SAFE_STALL_REASON: INCOMPLETE_LEDGER_EVIDENCE" <<< "$output"
          grep -q "NO NORMATIVE A/B VERDICT" <<< "$output"
