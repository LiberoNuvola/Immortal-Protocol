name: Cardano Ledger Audit Runner

on:
  workflow_dispatch:
  push:
    paths:
      - "audit/cardano-ledger-runner/**"
      - "src/plutusScripts/**"
      - ".github/workflows/cardano-ledger-audit.yml"

jobs:
  build-and-safe-stall:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GHC and Cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6.7"
          cabal-version: "3.12.1.0"

      - name: Install native Cardano crypto dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libsodium-dev libsecp256k1-dev pkg-config build-essential git
          if pkg-config --exists libsodium-any; then
            echo "pkg-config libsodium-any already available"
          elif pkg-config --exists libsodium; then
            pcdir="$(pkg-config --variable=pcfiledir libsodium)"
            sudo ln -sf "$pcdir/libsodium.pc" "$pcdir/libsodium-any.pc"
          else
            echo "Neither libsodium-any nor libsodium is available through pkg-config"
            exit 1
          fi
          pkg-config --exists libsodium-any
          pkg-config --exists libsecp256k1
          rm -rf /tmp/blst
          git clone --depth 1 --branch v0.3.14 https://github.com/supranational/blst.git /tmp/blst
          chmod +x /tmp/blst/build.sh
          set +e
          (cd /tmp/blst && ./build.sh)
          BLST_BUILD_RC=$?
          set -e
          test -s /tmp/blst/libblst.a
          if [ "$BLST_BUILD_RC" -ne 0 ]; then
            echo "blst build.sh returned $BLST_BUILD_RC after producing libblst.a; continuing with verified archive."
          fi
          sudo install -m 0644 /tmp/blst/libblst.a /usr/local/lib/libblst.a
          sudo install -m 0644 /tmp/blst/bindings/blst_aux.h /usr/local/include/blst_aux.h
          sudo install -m 0644 /tmp/blst/bindings/blst.h /usr/local/include/blst.h
          sudo install -m 0644 /tmp/blst/bindings/blst.hpp /usr/local/include/blst.hpp
          sudo mkdir -p /usr/local/lib/pkgconfig
          printf '%s\n' \
            'prefix=/usr/local' \
            'exec_prefix=\${prefix}' \
            'libdir=\${exec_prefix}/lib' \
            'includedir=\${prefix}/include' \
            'Name: libblst' \
            'Description: Multilingual BLS12-381 signature library' \
            'Version: 0.3.14' \
            'Cflags: -I\${includedir}' \
            'Libs: -L\${libdir} -lblst' \
            | sudo tee /usr/local/lib/pkgconfig/libblst.pc >/dev/null
          sudo ldconfig
          pkg-config --exists 'libblst >= 0.3.14'
          pkg-config --modversion libblst

      - name: Update Cabal index
        run: cabal update

      - name: Build ledger runner
        working-directory: audit/cardano-ledger-runner
        run: cabal build cardano-ledger-runner

      - name: Verify fail-closed behavior without synthetic evidence
        run: |
          set +e
          (cd audit/cardano-ledger-runner && cabal run cardano-ledger-runner -- --evidence-dir /tmp/nonexistent-immortal-evidence)
          rc=$?
          set -e
          test "$rc" -eq 0

      - name: Assert SAFE_STALL is explicit
        run: |
          output="$(cd audit/cardano-ledger-runner && cabal run cardano-ledger-runner -- --evidence-dir /tmp/nonexistent-immortal-evidence)"
          printf '%s\n' "$output"
          grep -q "RESULT: SAFE_STALL" <<< "$output"
          grep -q "SAFE_STALL_REASON: INCOMPLETE_LEDGER_EVIDENCE" <<< "$output"
          grep -q "NO SYNTHETIC CONTEXT: evaluation only runs after exact typed-context decoding." <<< "$output"
