name: PRE-RICH B2 Control Carrier Conformance

on:
  push:
    branches:
      - work/immortal-green-closure
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund

      - name: Compute deterministic B2 artifact cache key
        id: b2-artifact-key
        shell: bash
        run: |
          echo "key=b2-plutus-artifacts-${{ runner.os }}-${{ hashFiles('plutus/**/*.hs', 'plutus/**/*.cabal', 'plutus/cabal.project*', '.github/actions/setup-plutus/**', 'package-lock.json') }}" >> "$GITHUB_OUTPUT"

      - name: Restore compiled B2 Plutus artifacts
        id: b2-artifact-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            plutus/out/preRichControlCarrier.plutus.json
            plutus/out/preRichControlCarrierMintPolicy.plutus.json
          key: ${{ steps.b2-artifact-key.outputs.key }}

      - name: Setup canonical Plutus toolchain
        if: steps.b2-artifact-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-plutus
        with:
          update-hackage: "true"

      - name: Build and export Plutus artifacts
        if: steps.b2-artifact-cache.outputs.cache-hit != 'true'
        working-directory: plutus
        run: cabal run exe:export-scripts

      - name: Verify B2 artifacts exist
        run: |
          test -s plutus/out/preRichControlCarrier.plutus.json
          test -s plutus/out/preRichControlCarrierMintPolicy.plutus.json

      - name: Save compiled B2 Plutus artifacts
        if: steps.b2-artifact-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            plutus/out/preRichControlCarrier.plutus.json
            plutus/out/preRichControlCarrierMintPolicy.plutus.json
          key: ${{ steps.b2-artifact-key.outputs.key }}

      - name: Run B2 authenticated observation regressions
        run: |
          npx vitest run \
            src/__tests__/preprodB2ControlObservation.test.ts \
            Adapter/CARDANO/observation/PreprodAuthoritativeIssueProvider.test.ts \
            relayer/preprodIssueObservationProvider.test.js
          # node:test / plain-node suites: vitest cannot discover these
          node --test relayer/preprodIssueObservationReader.test.js
          node relayer/preprodIssueAdmissionProvider.test.mjs
          node relayer/preprodIssueAuthorityEnvelope.test.js
          node relayer/signedIssueAuthority.test.js

      - name: Browser build
        run: npm run build
