name: Materios Existing-Route Proof Availability

on:
  workflow_dispatch:
    inputs:
      rpc_endpoint:
        description: "Existing Materios Preprod RPC endpoint; do not include credentials"
        required: true
        type: string
        default: "https://materios.fluxpointstudios.com/preprod-rpc"
      archive_rpc:
        description: "Optional existing historical-state-capable RPC; blank reuses rpc_endpoint; do not include credentials"
        required: false
        type: string
        default: ""
  push:
    branches:
      - work/b3-materios-provenance-evidence
    paths:
      - ".github/workflows/materios-existing-route-proof-availability.yml"
      - "poc/materios-checkpoint/**"

permissions:
  contents: read

jobs:
  probe-existing-route:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: poc/materios-checkpoint/package-lock.json

      - name: Install pinned PoC-0 dependencies
        working-directory: poc/materios-checkpoint
        run: npm ci --ignore-scripts

      - name: Test read-only RPC capability classifier
        working-directory: poc/materios-checkpoint
        run: npm run test:rpc-capabilities

      - name: Probe advertised Materios RPC methods
        id: capabilities
        continue-on-error: true
        working-directory: poc/materios-checkpoint
        env:
          MATERIOS_RPC: ${{ github.event.inputs.rpc_endpoint || 'https://materios.fluxpointstudios.com/preprod-rpc' }}
          MATERIOS_CHAIN_ID: materios_preprod_v6
        run: npm run probe:rpc

      - name: Capture finalized checkpoint and available GRANDPA evidence
        id: finalized
        continue-on-error: true
        working-directory: poc/materios-checkpoint
        env:
          MATERIOS_RPC: ${{ github.event.inputs.rpc_endpoint || 'https://materios.fluxpointstudios.com/preprod-rpc' }}
          MATERIOS_CHAIN_ID: materios_preprod_v6
        run: npm run capture:finalized

      - name: Capture historical anchor value and storage proof
        id: anchor
        if: always()
        continue-on-error: true
        working-directory: poc/materios-checkpoint
        env:
          MATERIOS_ARCHIVE_RPC: ${{ github.event.inputs.archive_rpc || github.event.inputs.rpc_endpoint || 'https://materios.fluxpointstudios.com/preprod-rpc' }}
        run: npm run capture:anchor

      - name: Summarize acquisition status (not verification)
        if: always()
        env:
          FINALIZED_OUTCOME: ${{ steps.finalized.outcome }}
          ANCHOR_OUTCOME: ${{ steps.anchor.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const lines = [
            '# Materios existing-route proof availability',
            '',
            'This run is read-only. It does not modify or activate a Materios node.',
            'Successful capture means evidence was returned; it does NOT mean cryptographic verification or B3 closure.',
            '',
            `- Finalized-state capture step: **${process.env.FINALIZED_OUTCOME ?? 'unknown'}**`,
            `- Historical anchor/storage capture step: **${process.env.ANCHOR_OUTCOME ?? 'unknown'}**`,
          ];

          const capabilityPath = 'poc/materios-checkpoint/out/MateriosRpcCapabilityProbe.json';
          if (fs.existsSync(capabilityPath)) {
            try {
              const probe = JSON.parse(fs.readFileSync(capabilityPath, 'utf8'));
              lines.push(
                '',
                '## Advertised RPC surface',
                `- Catalogue status: **${probe.catalogue?.status ?? 'unknown'}**`,
                `- Advertised methods: ${probe.catalogue?.methodCount ?? 'unknown'}`,
                '- This is endpoint capability evidence only; it is not a proof-verification result.',
              );
              if (probe.catalogue?.targets) {
                for (const [method, status] of Object.entries(probe.catalogue.targets)) {
                  lines.push(`- ${method}: ${status}`);
                }
              } else {
                lines.push(`- Detail: ${probe.catalogue?.message ?? probe.catalogue?.reason ?? 'unavailable'}`);
              }
            } catch (error) {
              lines.push('', 'RPC capability probe JSON could not be parsed: ' + String(error));
            }
          } else {
            lines.push('', 'RPC method catalogue was not captured; inspect the preceding step logs.');
          }

          const finalizedPath = 'poc/materios-checkpoint/out/MateriosFinalizedStateCapture.json';
          if (fs.existsSync(finalizedPath)) {
            try {
              const capture = JSON.parse(fs.readFileSync(finalizedPath, 'utf8'));
              const proof = capture.grandpa?.finality_proof;
              lines.push(
                '',
                '## GRANDPA evidence returned',
                `- Status: **${proof?.status ?? 'unknown'}**`,
                `- Source: ${proof?.source ?? 'none recorded'}`,
                `- Format: ${proof?.format ?? 'none recorded'}`,
                '- Verification: **not performed by this capture step**',
              );
              if (Array.isArray(capture.scope?.open)) {
                lines.push('', 'Open items recorded by capture:', ...capture.scope.open.map(x => `- ${x}`));
              }
            } catch (error) {
              lines.push('', 'Finalized capture JSON could not be parsed: ' + String(error));
            }
          } else {
            lines.push('', 'No finalized-state capture packet was produced. Inspect the preceding step logs.');
          }

          const anchorPath = 'poc/materios-checkpoint/out/MateriosB3AnchorStateWitness.json';
          if (fs.existsSync(anchorPath)) {
            try {
              const witness = JSON.parse(fs.readFileSync(anchorPath, 'utf8'));
              const nodes = witness.storage_proof?.nodes;
              lines.push(
                '',
                '## Historical storage proof returned',
                `- Target block: ${witness.target?.block_hash ?? 'unknown'}`,
                `- State root (observed): ${witness.target?.state_root ?? 'unknown'}`,
                `- Storage key: ${witness.target?.storage_key ?? 'unknown'}`,
                `- Proof nodes: ${Array.isArray(nodes) ? nodes.length : 'unknown'}`,
                '- Proof verification: **not performed by this capture step**',
                '- Finality and anchor-to-round semantic binding: **still open**',
              );
            } catch (error) {
              lines.push('', 'Anchor witness JSON could not be parsed: ' + String(error));
            }
          } else {
            lines.push(
              '',
              '## Historical storage proof',
              'No anchor witness packet was produced. The selected RPC may lack historical-state/read-proof capability or the target key may not exist at the requested block. Inspect the capture-step error before classifying the cause.',
            );
          }

          lines.push(
            '',
            '## Decision rule',
            'Do not label B3 verified from this workflow. A captured proof must next pass an independent verifier against an authenticated finalized checkpoint and exact runtime identity.',
          );
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE

      - name: Upload raw capture packets for independent verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: materios-existing-route-proof-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            poc/materios-checkpoint/out/MateriosRpcCapabilityProbe.json
            poc/materios-checkpoint/out/MateriosFinalizedStateCapture.json
            poc/materios-checkpoint/out/MateriosB3AnchorStateWitness.json
          if-no-files-found: warn
          retention-days: 30
      
      - name: Fail closed when proof inputs are unavailable
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const blockers = [];
          const readJson = (path, label) => {
            if (!fs.existsSync(path)) {
              blockers.push(`${label}: artifact missing`);
              return null;
            }
            try {
              return JSON.parse(fs.readFileSync(path, 'utf8'));
            } catch (error) {
              blockers.push(`${label}: invalid JSON (${String(error)})`);
              return null;
            }
          };

          const probe = readJson(
            'poc/materios-checkpoint/out/MateriosRpcCapabilityProbe.json',
            'RPC catalogue',
          );
          const finalized = readJson(
            'poc/materios-checkpoint/out/MateriosFinalizedStateCapture.json',
            'Finalized capture',
          );
          const anchor = readJson(
            'poc/materios-checkpoint/out/MateriosB3AnchorStateWitness.json',
            'Historical anchor witness',
          );

          if (probe?.catalogue?.status !== 'available') {
            blockers.push('RPC catalogue: method inventory unavailable');
          } else {
            if (probe.catalogue.targets?.state_getReadProof !== 'listed') {
              blockers.push('RPC capability: state_getReadProof is not advertised');
            }
          }

          if (finalized?.grandpa?.finality_proof?.status !== 'captured') {
            blockers.push(
              `GRANDPA evidence: no finality proof bytes captured (${finalized?.grandpa?.finality_proof?.error ?? 'unknown reason'})`,
            );
          }
          if (finalized?.runtime_code?.status !== 'captured') {
            blockers.push(
              `Runtime identity: WASM bytes not captured (${finalized?.runtime_code?.error ?? 'unknown reason'})`,
            );
          }

          if (anchor) {
            const targetHash = anchor.target?.block_hash?.toLowerCase();
            const proofAt = anchor.storage_proof?.at?.toLowerCase();
            const nodes = anchor.storage_proof?.nodes;
            if (!targetHash || targetHash !== proofAt) {
              blockers.push('Storage proof capture: proof block does not match requested target block');
            }
            if (!Array.isArray(nodes) || nodes.length === 0) {
              blockers.push('Storage proof capture: proof node array is missing or empty');
            }
            if (!/^0x[0-9a-f]{64}$/i.test(anchor.target?.state_root ?? '')) {
              blockers.push('Storage proof capture: observed state root is missing/invalid');
            }
          }

          if (blockers.length > 0) {
            console.error('::error::B3 proof-input availability gate is BLOCKED.');
            for (const blocker of blockers) console.error('::error::' + blocker);
            console.error(
              'This is an acquisition-availability gate only. Passing it would not prove finality, storage membership, canonicality, or B3 conformance.',
            );
            process.exitCode = 1;
          } else {
            console.log(
              'Required proof inputs were captured. This does not mean the proofs were cryptographically verified or that B3 is closed.',
            );
          }
          NODE
