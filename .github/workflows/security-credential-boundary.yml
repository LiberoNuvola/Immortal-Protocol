name: Security Credential Boundary

on:
  push:
    branches:
      - work/immortal-green-closure
    paths:
      - "src/config.ts"
      - "src/wallet.ts"
      - "src/live.ts"
      - "src/first-user.ts"
      - "src/__tests__/cardano-provider-secret-boundary.test.ts"
      - ".env.example"
      - "blockfrost-proxy/**"
      - "scripts/security/**"
      - ".github/workflows/security-credential-boundary.yml"
      - ".github/workflows/immortal-preprod-pages.yml"
  pull_request:
    branches:
      - b1-hardening

permissions:
  contents: read

jobs:
  credentials:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm ci --no-audit --no-fund
      - name: Check source credential boundary
        run: node scripts/security/credential-boundary-check.mjs
      - name: Run browser provider boundary regression
        run: npx vitest run src/__tests__/cardano-provider-secret-boundary.test.ts
      - name: Test Blockfrost proxy boundary
        working-directory: blockfrost-proxy
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Build with a provider-key canary
        env:
          VITE_BLOCKFROST_PROJECT_ID: IMMORTAL_B42_BUILD_CANARY_DO_NOT_SHIP
        run: |
          npm run build
          node scripts/security/assert-no-browser-provider-secret.mjs
