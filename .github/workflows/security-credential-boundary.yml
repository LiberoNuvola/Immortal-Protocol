name: Security Credential Boundary

on:
  push:
    branches:
      - work/immortal-green-closure
    paths:
      - "scripts/security/credential-boundary-check.mjs"
      - "blockfrost-proxy/**"
      - "relayer/**"
      - "audit/**"
      - "scripts/**"
      - ".github/workflows/security-credential-boundary.yml"
  pull_request:
    branches:
      - b1-hardening

jobs:
  credentials:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check provider credential boundary
        run: node scripts/security/credential-boundary-check.mjs
