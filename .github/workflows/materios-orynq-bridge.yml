name: Materios Orynq Evidence Bridge

on:
  push:
    branches:
      - work/b3-materios-provenance-evidence
    paths:
      - "poc/materios-orynq-bridge/**"
      - ".github/workflows/materios-orynq-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: materios-orynq-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact B3 head
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Orynq bridge dependencies
        working-directory: poc/materios-orynq-bridge
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck bridge
        working-directory: poc/materios-orynq-bridge
        run: npm run typecheck

      - name: Test receipt planning and fail-closed boundaries
        working-directory: poc/materios-orynq-bridge
        run: npm test
