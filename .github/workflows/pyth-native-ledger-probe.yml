name: Pyth Signed Update — Preprod Ledger Probe

on:
  push:
    branches:
      - work/immortal-green-closure
    paths:
      - ".github/workflows/pyth-native-ledger-probe.yml"
      - "scripts/testPythSignedUpdatePreprod.mts"
      - "scripts/pythPreprodConfig.mts"
      - "poc/aiken-pyth-ada-usd/**"
      - "plutus/PythQuoteCarrierBinding.hs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      pyth_policy_id:
        description: "Verified 56-hex Pyth deployment policy ID for Cardano Preprod"
        required: true
        default: "c7d51d897fdfceb7682f4a1a9ef428a027ec0582cadee158429f7e45"
        type: string
      submit_preprod:
        description: "Submit two test-only Preprod transactions using the dedicated PYTH_PREPROD_TEST_MNEMONIC wallet"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  pyth-native-ledger-probe:
    name: Signed Pyth update through the Preprod ledger
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact selected revision
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup pinned Aiken
        uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.21

      - name: Install repository dependencies
        run: npm ci

      - name: Install pinned isolated Pyth runner dependencies
        run: |
          npm install --no-save --package-lock=false \
            @evolution-sdk/evolution@0.5.9 \
            @pythnetwork/pyth-lazer-cardano-js@0.1.0 \
            @pythnetwork/pyth-lazer-sdk@5.2.0

      - name: Build isolated Aiken consumers
        working-directory: poc/aiken-pyth-ada-usd
        run: |
          aiken check
          aiken build
          test -s plutus.json

      - name: Fetch genuine signed update; submit only when explicitly requested
        env:
          PYTH_CARDANO_POLICY_ID: ${{ github.event.inputs.pyth_policy_id || 'c7d51d897fdfceb7682f4a1a9ef428a027ec0582cadee158429f7e45' }}
          PYTH_SUBMIT_PREPROD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.submit_preprod == 'true' && 'true' || 'false' }}
          PYTH_LAZER_TOKEN: ${{ secrets.PYTH_LAZER_TOKEN }}
          PYTH_PREPROD_TEST_MNEMONIC: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.submit_preprod == 'true' && secrets.PYTH_PREPROD_TEST_MNEMONIC || '' }}
          BLOCKFROST_PROJECT_ID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.submit_preprod == 'true' && (secrets.PREPROD_BLOCKFROST_PROJECT_ID || secrets.VITE_BLOCKFROST_PROJECT_ID) || '' }}
        run: node --import=tsx ./scripts/testPythSignedUpdatePreprod.mts

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyth-native-ledger-probe-${{ github.sha }}
          path: audit/preprod-issue/pyth-native-ledger-probe.json
          if-no-files-found: ignore
          retention-days: 30
