name: Genesis Regime Carrier Conformance

on:
  push:
    branches:
      - work/immortal-green-closure
    paths:
      - "PRE-RICH/profile/GenesisRegimeCarrier.hs"
      - "PRE-RICH/profile/GenesisCarrierMintPolicy.hs"
      - "PRE-RICH/profile/PreRichGenesisAdmission.hs"
      - "PRE-RICH/profile/PreRichRegimeState.hs"
      - "plutus/Types.hs"
      - "plutus/Economic.hs"
      - "plutus/pre-rich-plutus.cabal"
      - "plutus/export/Export.hs"
      - "src/__tests__/genesis-carrier-mint-policy-emulator.mjs"
      - "PRE-RICH/profile/GenesisTreasuryAdmission.ts"
      - "PRE-RICH/profile/GenesisTreasuryAdmission.test.ts"
      - "audit/pre-genesis-genesis/genesis-carrier-ledger-trace.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/genesis-regime-carrier.yml"
  pull_request:
    branches:
      - work/immortal-green-closure
    paths:
      - "PRE-RICH/profile/GenesisRegimeCarrier.hs"
      - "PRE-RICH/profile/GenesisCarrierMintPolicy.hs"
      - "PRE-RICH/profile/PreRichGenesisAdmission.hs"
      - "PRE-RICH/profile/PreRichRegimeState.hs"
      - "plutus/Types.hs"
      - "plutus/Economic.hs"
      - "plutus/pre-rich-plutus.cabal"
      - "plutus/export/Export.hs"
      - "src/__tests__/genesis-carrier-mint-policy-emulator.mjs"
      - "PRE-RICH/profile/GenesisTreasuryAdmission.ts"
      - "PRE-RICH/profile/GenesisTreasuryAdmission.test.ts"
      - "audit/pre-genesis-genesis/genesis-carrier-ledger-trace.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/genesis-regime-carrier.yml"

jobs:
  compile-carrier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6.7"
          cabal-version: "3.12.1.0"
      - name: Install Plutus native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev libsecp256k1-dev pkg-config build-essential git
          rm -rf /tmp/blst
          git clone --depth 1 --branch v0.3.14 https://github.com/supranational/blst.git /tmp/blst
          chmod +x /tmp/blst/build.sh
          set +e
          (cd /tmp/blst && ./build.sh)
          rc=$?
          set -e
          test -s /tmp/blst/libblst.a
          if [ "$rc" -ne 0 ]; then
            echo "blst build returned $rc after producing the verified archive; continuing."
          fi
          sudo install -m 0644 /tmp/blst/libblst.a /usr/local/lib/libblst.a
          sudo install -m 0644 /tmp/blst/bindings/blst_aux.h /usr/local/include/blst_aux.h
          sudo install -m 0644 /tmp/blst/bindings/blst.h /usr/local/include/blst.h
          sudo install -m 0644 /tmp/blst/bindings/blst.hpp /usr/local/include/blst.hpp
          sudo mkdir -p /usr/local/lib/pkgconfig
          printf '%s\n' \
            'prefix=/usr/local' \
            'exec_prefix=/usr/local' \
            'libdir=/usr/local/lib' \
            'includedir=/usr/local/include' \
            'Name: libblst' \
            'Description: Multilingual BLS12-381 signature library' \
            'Version: 0.3.14' \
            'Cflags: -I/usr/local/include' \
            'Libs: -L/usr/local/lib -lblst' \
            | sudo tee /usr/local/lib/pkgconfig/libblst.pc >/dev/null
          sudo ldconfig
      - run: cabal update
      - name: Build PRE-RICH Plutus package
        working-directory: plutus
        run: cabal build pre-rich-plutus
      - name: Run Genesis regime carrier tests
        working-directory: plutus
        run: cabal test genesis-regime-carrier-tests
      - name: Export scripts
        working-directory: plutus
        run: cabal run exe:export-scripts
      - name: Assert Genesis carrier artifacts exist
        run: |
          test -s plutus/out/genesisRegimeCarrier.plutus.json
          test -s plutus/out/genesisCarrierMintPolicy.plutus.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Run Genesis Treasury admission mirror
        run: node --experimental-strip-types PRE-RICH/profile/GenesisTreasuryAdmission.test.ts
      - name: Run Genesis carrier singleton ledger lab
        run: node src/__tests__/genesis-carrier-mint-policy-emulator.mjs
