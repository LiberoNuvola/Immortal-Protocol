name: Genesis Regime Carrier Conformance

# CI retrigger: verify Reference Adapter and Reference↔Cardano differential on the current head.
#
# Artifact policy:
# - Reuse compiled Plutus outputs when the deterministic source/toolchain fingerprint matches.
# - Reuse Cabal build state on retries of the same source fingerprint.
# - Rebuild/export only on cache miss. Tests and evidence still run on every workflow execution.

on:
  push:
    branches:
      - work/immortal-green-closure
    paths:
      - "PRE-RICH/onchain/GenesisRegimeCarrier.hs"
      - "PRE-RICH/onchain/GenesisCarrierMintPolicy.hs"
      - "PRE-RICH/onchain/V3EconomicStateCarrierMintPolicy.hs"
      - "PRE-RICH/onchain/V3EconomicStateCarrier.hs"
      - "PRE-RICH/onchain/PreRichGenesisAdmission.hs"
      - "PRE-RICH/onchain/PreRichRegimeState.hs"
      - "PRE-RICH/onchain/PreRichLifecycleTransition.hs"
      - "plutus/test/PreRichLifecycleTransitionTest.hs"
      - "plutus/Types.hs"
      - "plutus/Economic.hs"
      - "plutus/pre-rich-plutus.cabal"
      - "Adapter/REFERENCE/**"
      - "src/__tests__/reference-cardano-differential.test.ts"
      - "plutus/export/Export.hs"
      - "src/__tests__/genesis-carrier-mint-policy-emulator.mjs"
      - "PRE-RICH/src/GenesisTreasuryAdmission.ts"
      - "PRE-RICH/tests/conformance/GenesisTreasuryAdmission.test.ts"
      - "audit/pre-genesis-genesis/genesis-carrier-ledger-trace.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/genesis-regime-carrier.yml"
      - ".github/actions/setup-plutus/**"
  pull_request:
    branches:
      - work/immortal-green-closure
    paths:
      - "PRE-RICH/onchain/GenesisRegimeCarrier.hs"
      - "Adapter/REFERENCE/**"
      - "PRE-RICH/onchain/GenesisCarrierMintPolicy.hs"
      - "PRE-RICH/onchain/PreRichGenesisAdmission.hs"
      - "PRE-RICH/onchain/PreRichRegimeState.hs"
      - "plutus/Types.hs"
      - "plutus/Economic.hs"
      - "plutus/pre-rich-plutus.cabal"
      - "plutus/export/Export.hs"
      - "src/__tests__/genesis-carrier-mint-policy-emulator.mjs"
      - "PRE-RICH/src/GenesisTreasuryAdmission.ts"
      - "PRE-RICH/src/GenesisTreasuryAdmission.test.ts"
      - "audit/pre-genesis-genesis/genesis-carrier-ledger-trace.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/genesis-regime-carrier.yml"

jobs:
  compile-carrier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup canonical Plutus CI
        uses: ./.github/actions/setup-plutus

      - name: Restore Cabal dependency store
        id: cabal-store-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cabal/store
          key: genesis-cabal-store-${{ runner.os }}-ghc9.6.7-cabal3.12.1.0-${{ hashFiles('plutus/cabal.project*', 'plutus/pre-rich-plutus.cabal', '.github/actions/setup-plutus/**') }}

      - name: Restore Cabal build state
        id: cabal-build-cache
        uses: actions/cache/restore@v4
        with:
          path: plutus/dist-newstyle
          key: genesis-cabal-build-${{ runner.os }}-${{ hashFiles('plutus/**/*.hs', 'plutus/**/*.cabal', 'plutus/cabal.project*', 'IMMORTAL/**/*.hs', 'Adapter/REFERENCE/**/*.hs', 'PRE-RICH/onchain/**/*.hs', '.github/actions/setup-plutus/**') }}

      - name: Restore exported Plutus artifacts
        id: genesis-artifact-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            plutus/out/genesisRegimeCarrier.plutus.json
            plutus/out/genesisCarrierMintPolicy.plutus.json
            plutus/out/v3EconomicStateCarrier.plutus.json
            plutus/out/v3EconomicStateCarrierMintPolicy.plutus.json
          key: genesis-plutus-artifacts-${{ runner.os }}-${{ hashFiles('plutus/**/*.hs', 'plutus/**/*.cabal', 'plutus/cabal.project*', 'IMMORTAL/**/*.hs', 'Adapter/REFERENCE/**/*.hs', 'PRE-RICH/onchain/**/*.hs', 'plutus/export/Export.hs', '.github/actions/setup-plutus/**', 'package-lock.json') }}

      - name: Build PRE-RICH Plutus package
        if: steps.cabal-build-cache.outputs.cache-hit != 'true'
        working-directory: plutus
        run: cabal build pre-rich-plutus

      - name: Save Cabal build state
        if: steps.cabal-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: plutus/dist-newstyle
          key: genesis-cabal-build-${{ runner.os }}-${{ hashFiles('plutus/**/*.hs', 'plutus/**/*.cabal', 'plutus/cabal.project*', 'IMMORTAL/**/*.hs', 'Adapter/REFERENCE/**/*.hs', 'PRE-RICH/onchain/**/*.hs', '.github/actions/setup-plutus/**') }}

      - name: Save Cabal dependency store
        if: steps.cabal-store-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cabal/store
          key: genesis-cabal-store-${{ runner.os }}-ghc9.6.7-cabal3.12.1.0-${{ hashFiles('plutus/cabal.project*', 'plutus/pre-rich-plutus.cabal', '.github/actions/setup-plutus/**') }}

      - name: Run Genesis regime carrier tests
        working-directory: plutus
        run: cabal test genesis-regime-carrier-tests
      - name: Run PRE-RICH lifecycle/QNE tests
        working-directory: plutus
        run: cabal test pre-rich-lifecycle-transition-tests
      - name: Run V3 economic state carrier binding tests
        working-directory: plutus
        run: cabal test v3-economic-state-carrier-binding-tests
      - name: Run Reference Adapter conformance tests
        working-directory: plutus
        run: cabal test reference-adapter-tests

      - name: Export scripts
        if: steps.genesis-artifact-cache.outputs.cache-hit != 'true'
        working-directory: plutus
        run: cabal run exe:export-scripts

      - name: Save exported Plutus artifacts
        if: steps.genesis-artifact-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            plutus/out/genesisRegimeCarrier.plutus.json
            plutus/out/genesisCarrierMintPolicy.plutus.json
            plutus/out/v3EconomicStateCarrier.plutus.json
            plutus/out/v3EconomicStateCarrierMintPolicy.plutus.json
          key: genesis-plutus-artifacts-${{ runner.os }}-${{ hashFiles('plutus/**/*.hs', 'plutus/**/*.cabal', 'plutus/cabal.project*', 'IMMORTAL/**/*.hs', 'Adapter/REFERENCE/**/*.hs', 'PRE-RICH/onchain/**/*.hs', 'plutus/export/Export.hs', '.github/actions/setup-plutus/**', 'package-lock.json') }}

      - name: Assert Genesis carrier artifacts exist
        run: |
          test -s plutus/out/genesisRegimeCarrier.plutus.json
          test -s plutus/out/genesisCarrierMintPolicy.plutus.json
          test -s plutus/out/v3EconomicStateCarrier.plutus.json
          test -s plutus/out/v3EconomicStateCarrierMintPolicy.plutus.json
          node -e "for (const f of ['genesisRegimeCarrier.plutus.json','genesisCarrierMintPolicy.plutus.json','v3EconomicStateCarrier.plutus.json','v3EconomicStateCarrierMintPolicy.plutus.json']) { const a=require('./plutus/out/'+f); if(a.type!=='PlutusScriptV2'||!a.cborHex) process.exit(1); } console.log('Genesis/V3 artifacts ready')"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund
      - name: Run Reference ↔ Cardano differential test
        run: npx tsx --test src/__tests__/reference-cardano-differential.test.ts
      - name: Run Genesis Treasury admission mirror
        run: node --experimental-strip-types PRE-RICH/tests/conformance/GenesisTreasuryAdmission.test.ts
      - name: Run Genesis carrier singleton ledger lab
        run: node src/__tests__/genesis-carrier-mint-policy-emulator.mjs
