name: Genesis Regime Carrier Conformance

on:
  push:
    branches:
      - work/immortal-green-closure
    paths:
      - "PRE-RICH/profile/GenesisRegimeCarrier.hs"
      - "PRE-RICH/profile/GenesisCarrierMintPolicy.hs"
      - "PRE-RICH/profile/PreRichGenesisAdmission.hs"
      - "PRE-RICH/profile/PreRichRegimeState.hs"
      - "plutus/Types.hs"
      - "plutus/Economic.hs"
      - "plutus/pre-rich-plutus.cabal"
      - "plutus/export/Export.hs"
      - "src/__tests__/genesis-carrier-mint-policy-emulator.mjs"
      - "PRE-RICH/profile/GenesisTreasuryAdmission.ts"
      - "PRE-RICH/profile/GenesisTreasuryAdmission.test.ts"
      - "audit/pre-genesis-genesis/genesis-carrier-ledger-trace.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/genesis-regime-carrier.yml"
  pull_request:
    branches:
      - work/immortal-green-closure
    paths:
      - "PRE-RICH/profile/GenesisRegimeCarrier.hs"
      - "PRE-RICH/profile/GenesisCarrierMintPolicy.hs"
      - "PRE-RICH/profile/PreRichGenesisAdmission.hs"
      - "PRE-RICH/profile/PreRichRegimeState.hs"
      - "plutus/Types.hs"
      - "plutus/Economic.hs"
      - "plutus/pre-rich-plutus.cabal"
      - "plutus/export/Export.hs"
      - "src/__tests__/genesis-carrier-mint-policy-emulator.mjs"
      - "PRE-RICH/profile/GenesisTreasuryAdmission.ts"
      - "PRE-RICH/profile/GenesisTreasuryAdmission.test.ts"
      - "audit/pre-genesis-genesis/genesis-carrier-ledger-trace.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/genesis-regime-carrier.yml"

jobs:
  compile-carrier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6.7"
          cabal-version: "3.12.1.0"
      - name: Install Plutus native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev pkg-config
      - run: cabal update
      - name: Build PRE-RICH Plutus package
        working-directory: plutus
        run: cabal build pre-rich-plutus
      - name: Run Genesis regime carrier tests
        working-directory: plutus
        run: cabal test genesis-regime-carrier-tests
      - name: Export scripts
        working-directory: plutus
        run: cabal run exe:export-scripts
      - name: Assert Genesis carrier artifacts exist
        run: |
          test -s plutus/out/genesisRegimeCarrier.plutus.json
          test -s plutus/out/genesisCarrierMintPolicy.plutus.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Run Genesis carrier singleton ledger lab
        run: node src/__tests__/genesis-carrier-mint-policy-emulator.mjs
