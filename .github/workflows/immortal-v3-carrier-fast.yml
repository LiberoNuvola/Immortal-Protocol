name: IMMORTAL V3 Carrier Fast Ledger Gate
# Fast ledger-only verification path; full P2.8 remains manual/PR gated.
# CI trigger: verify canonical blst/shared Plutus bootstrap on current HEAD.

concurrency:
  group: v3-carrier-fast-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/immortal-green-closure
    paths:
      - "PRE-RICH/onchain/**"
      - "plutus/**"
      - "scripts/deployV3Carrier.mts"
      - "audit/cardano-integration/v3-carrier-ledger-probe.mts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/immortal-v3-carrier-fast.yml"
      - ".github/actions/setup-plutus/**"
  workflow_dispatch:

jobs:
  v3-carrier-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact workflow head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore V3 Plutus artifact cache
        id: v3-artifact-cache
        uses: actions/cache@v4
        with:
          path: |
            plutus/out/v3EconomicStateCarrier.plutus.json
            plutus/out/v3EconomicStateCarrierMintPolicy.plutus.json
          key: v3-carrier-${{ hashFiles('PRE-RICH/onchain/V3EconomicStateCarrier.hs', 'PRE-RICH/onchain/V3EconomicStateCarrierMintPolicy.hs', 'plutus/*.cabal', '.github/actions/setup-plutus/action.yml', 'package-lock.json') }}

      - name: Restore Cabal/Plutus build state
        if: steps.v3-artifact-cache.outputs.cache-hit != 'true'
        id: plutus-build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            dist-newstyle
          key: plutus-build-${{ runner.os }}-${{ hashFiles('**/*.cabal', 'cabal.project*', '**/*.hs', '**/*.lhs') }}
          restore-keys: |
            plutus-build-${{ runner.os }}-

      - name: Setup canonical Plutus CI
        if: steps.v3-artifact-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-plutus
        with:
          update-hackage: ${{ steps.plutus-build-cache.outputs.cache-matched-key == '' }}

      - name: Generate V3 Plutus artifact
        if: steps.v3-artifact-cache.outputs.cache-hit != 'true'
        run: |
          set +e
          cabal --config-file="$CABAL_CONFIG" run exe:export-scripts -j1 > plutus/v3-artifact-build.log 2>&1
          rc=$?
          set -e

          echo "Cabal V3 artifact generation exit code: $rc"
          echo "V3-specific compiler diagnostics:"
          grep -E 'V3EconomicStateCarrier(MintPolicy)?\\.hs' plutus/v3-artifact-build.log | tail -200 || true

          if [ "$rc" -ne 0 ]; then
            echo "Last 120 build-log lines:"
            tail -120 plutus/v3-artifact-build.log || true
            exit "$rc"
          fi

          echo "V3 artifact generation completed."
          exit 0

      - name: Preserve V3 Plutus build log
        if: always() && steps.v3-artifact-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: immortal-v3-plutus-build-log
          path: plutus/v3-artifact-build.log
          if-no-files-found: ignore

      - name: Verify V3 Plutus artifact
        run: |
          test -s plutus/out/v3EconomicStateCarrier.plutus.json
          test -s plutus/out/v3EconomicStateCarrierMintPolicy.plutus.json
          node -e "for (const f of ['v3EconomicStateCarrier.plutus.json','v3EconomicStateCarrierMintPolicy.plutus.json']) { const a=require('./plutus/out/'+f); if(a.type!=='PlutusScriptV2'||!a.cborHex) process.exit(1); } console.log('V3 artifacts ready')"

      - name: Install pinned Yaci DevKit
        run: npm install -g @bloxbean/yaci-devkit@0.12.0-beta5

      - name: Start isolated Cardano devnet
        run: |
          mkdir -p audit/yaci-evidence
          nohup yaci-devkit up --enable-yaci-store > audit/yaci-evidence/yaci.log 2>&1 &
          echo $! > audit/yaci-evidence/yaci.pid

      - name: Wait for Yaci Store
        run: |
          for i in $(seq 1 90); do
            if curl --fail --silent http://localhost:8080/api/v1/epochs/latest > audit/yaci-evidence/epoch-latest.json; then
              exit 0
            fi
            sleep 2
          done
          tail -300 audit/yaci-evidence/yaci.log || true
          exit 1

      - name: Derive funded CI test wallet
        run: node audit/cardano-integration/create-test-wallet.mjs

      - name: Execute V3 carrier against native Cardano ledger
        run: node --import tsx/esm audit/cardano-integration/v3-carrier-ledger-probe.mts

      - name: Preserve V3 ledger evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortal-v3-carrier-fast-evidence
          path: audit/yaci-evidence/
