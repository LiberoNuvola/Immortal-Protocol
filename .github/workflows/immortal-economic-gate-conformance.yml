name: IMMORTAL Economic Gate Conformance

on:
  push:
    branches:
      - work/immortal-green-closure
    paths:
      - "IMMORTAL/kernel/EconomicGate.hs"
      - "IMMORTAL/state/UniversalEconomicState.hs"
      - "plutus/test/EconomicGateTest.hs"
      - "plutus/pre-rich-plutus.cabal"
      - ".github/workflows/immortal-economic-gate-conformance.yml"
  pull_request:
    branches:
      - b1-hardening
    paths:
      - "IMMORTAL/kernel/EconomicGate.hs"
      - "IMMORTAL/state/UniversalEconomicState.hs"
      - "plutus/test/EconomicGateTest.hs"
      - "plutus/pre-rich-plutus.cabal"
      - ".github/workflows/immortal-economic-gate-conformance.yml"

jobs:
  economic-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6.7"
          cabal-version: "3.12.1.0"
      - name: Install Plutus native dependencies
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libsecp256k1-dev pkg-config build-essential
      - name: Run Economic Gate boundary suite
        working-directory: plutus
        run: |
          cabal update
          cabal test economic-gate-tests
