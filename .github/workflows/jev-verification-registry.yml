name: JEV Verification Registry Contract

on:
  push:
    branches:
      - work/immortal-green-closure
    paths:
      - "audit/jev/**"
      - "audit/cardano-integration/materialize-p28-ledger-context.mjs"
      - "audit/cardano-ledger-runner/**"
      - ".github/workflows/immortal-cardano-lab.yml"
      - ".github/workflows/cardano-ledger-audit.yml"
      - "scripts/validate-jev-verification-registry.mjs"
      - "scripts/test-jev-verification-registry.mjs"
      - "scripts/jev-verification-registry-generator.mjs"
      - "scripts/test-jev-verification-registry-generator.mjs"
      - "scripts/build-jev-operational-prompt.mjs"
      - "scripts/test-jev-operational-prompt.mjs"
      - "scripts/jev-materios-evidence-ingress.mjs"
      - "scripts/test-jev-materios-evidence-ingress.mjs"
      - "scripts/build-jev-materios-registry.mjs"
      - "scripts/test-jev-materios-registry-pipeline.mjs"
      - ".github/workflows/jev-verification-registry.yml"
      - ".github/workflows/jev-materios-live-ingress.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout audited branch
        uses: actions/checkout@v4
        with:
          ref: work/immortal-green-closure
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test registry validation and negative cases
        run: node scripts/test-jev-verification-registry.mjs
      - name: Test isolated registry generator and fail-closed mapping
        run: node scripts/test-jev-verification-registry-generator.mjs
      - name: Test JEV operational prompt generation
        run: node scripts/test-jev-operational-prompt.mjs
      - name: Test Materios evidence ingress and fail-closed boundaries
        run: node scripts/test-jev-materios-evidence-ingress.mjs
      - name: Test Materios ingress-to-registry pipeline
        run: node scripts/test-jev-materios-registry-pipeline.mjs
      - name: Validate historical run 1718 registry fixture
        run: node scripts/validate-jev-verification-registry.mjs audit/jev/registry-run-1718-attempt-2.json
