name: C6 R1 finite certificate checker

on:
  push:
    branches:
      - release/public-main-curated-2026-09-24
    paths:
      - scripts/check-r1-finite-certificate.mjs
      - test/check-r1-finite-certificate.test.mjs
      - scripts/check-r1-canonical-source.mjs
      - test/check-r1-canonical-source.test.mjs
      - scripts/check-v3-universal-projection.mjs
      - test/check-v3-universal-projection.test.mjs
      - scripts/check-r1-economic-inventory.mjs
      - test/check-r1-economic-inventory.test.mjs
      - docs/workflow-c/R1-ECONOMIC-INVENTORY-REGISTER-2026-10-18.json
      - docs/workflow-c/R1-ECONOMIC-INVENTORY-CHECKPOINT-2026-10-18.md
      - docs/workflow-c/C6-ACTION-SPACE-MATRIX-2026-10-18.md
      - docs/02-certification/ACCOUNTING_PARTITION_AND_CONSERVATION_CERTIFICATION.md
      - docs/02-certification/CONCRETE_KERNEL_CERTIFICATION_SPECIFICATION.md
      - docs/02-certification/EEV_ORACLE_AND_VALUATION_CONTRACT.md
      - docs/02-certification/OMEGA_COMPLETENESS_AND_PERIMETER_SPECIFICATION.md
      - PRE-RICH/docs/GAME-ECONOMY.md
      - IMMORTAL/state/EconomicProfile.hs
      - IMMORTAL/kernel/EconomicTransitionV3.hs
      - IMMORTAL/state/EconomicStateV3.hs
      - IMMORTAL/kernel/EconomicKernel.hs
      - IMMORTAL/state/UniversalEconomicState.hs
      - IMMORTAL/kernel/UniversalEconomicKernel.hs
      - IMMORTAL/kernel/EconomicGate.hs
      - .github/workflows/c6-r1-finite-checker.yml
  pull_request:
    branches:
      - release/public-main-curated-2026-09-24
    paths:
      - scripts/check-r1-finite-certificate.mjs
      - test/check-r1-finite-certificate.test.mjs
      - scripts/check-r1-canonical-source.mjs
      - test/check-r1-canonical-source.test.mjs
      - scripts/check-v3-universal-projection.mjs
      - test/check-v3-universal-projection.test.mjs
      - scripts/check-r1-economic-inventory.mjs
      - test/check-r1-economic-inventory.test.mjs
      - docs/workflow-c/R1-ECONOMIC-INVENTORY-REGISTER-2026-10-18.json
      - docs/workflow-c/R1-ECONOMIC-INVENTORY-CHECKPOINT-2026-10-18.md
      - docs/workflow-c/C6-ACTION-SPACE-MATRIX-2026-10-18.md
      - docs/02-certification/ACCOUNTING_PARTITION_AND_CONSERVATION_CERTIFICATION.md
      - docs/02-certification/CONCRETE_KERNEL_CERTIFICATION_SPECIFICATION.md
      - docs/02-certification/EEV_ORACLE_AND_VALUATION_CONTRACT.md
      - docs/02-certification/OMEGA_COMPLETENESS_AND_PERIMETER_SPECIFICATION.md
      - PRE-RICH/docs/GAME-ECONOMY.md
      - IMMORTAL/state/EconomicProfile.hs
      - IMMORTAL/kernel/EconomicTransitionV3.hs
      - IMMORTAL/state/EconomicStateV3.hs
      - IMMORTAL/kernel/EconomicKernel.hs
      - IMMORTAL/state/UniversalEconomicState.hs
      - IMMORTAL/kernel/UniversalEconomicKernel.hs
      - IMMORTAL/kernel/EconomicGate.hs
      - .github/workflows/c6-r1-finite-checker.yml

permissions:
  contents: read

jobs:
  finite-r1-model-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout authorized branch snapshot
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify canonical source snapshot and structure
        run: node scripts/check-r1-canonical-source.mjs
      - name: Verify V3/universal source snapshot
        run: node scripts/check-v3-universal-projection.mjs
      - name: Audit source-pinned R1 economic inventory (closure remains fail-closed)
        run: node scripts/check-r1-economic-inventory.mjs
      - name: Run finite R1, source-binding, projection and inventory regressions
        run: node --test test/check-r1-finite-certificate.test.mjs test/check-r1-canonical-source.test.mjs test/check-v3-universal-projection.test.mjs test/check-r1-economic-inventory.test.mjs
