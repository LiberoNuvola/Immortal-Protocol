name: PRE-GENESIS Genesis Cardano Conformance

on:
  push:
    branches:
      - work/immortal-green-closure
    paths:
      - "PRE-RICH/profile/GenesisRegimeCarrier.hs"
      - "PRE-RICH/profile/GenesisCarrierMintPolicy.hs"
      - "PRE-RICH/profile/PreRichGenesisAdmission.hs"
      - "plutus/Types.hs"
      - "plutus/Economic.hs"
      - "plutus/OracleTypes.hs"
      - "plutus/B1PrizePool.hs"
      - "plutus/B1LegacyAdapter.hs"
      - "PRE-RICH/profile/PreRichEconomicProfile.hs"
      - "plutus/B1PrizePool.hs"
      - "plutus/B1LegacyAdapter.hs"
      - "PRE-RICH/profile/PreRichEconomicProfile.hs"
      - "plutus/pre-rich-plutus.cabal"
      - "plutus/export/Export.hs"
      - "audit/pre-genesis-genesis/genesis-carrier-ledger-trace.ts"
      - "audit/cardano-integration/create-test-wallet.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pre-genesis-genesis-cardano.yml"
  pull_request:
    branches:
      - work/immortal-green-closure
    paths:
      - "PRE-RICH/profile/GenesisRegimeCarrier.hs"
      - "PRE-RICH/profile/GenesisCarrierMintPolicy.hs"
      - "PRE-RICH/profile/PreRichGenesisAdmission.hs"
      - "plutus/Types.hs"
      - "plutus/Economic.hs"
      - "plutus/OracleTypes.hs"
      - "plutus/pre-rich-plutus.cabal"
      - "plutus/export/Export.hs"
      - "audit/pre-genesis-genesis/genesis-carrier-ledger-trace.ts"
      - "audit/cardano-integration/create-test-wallet.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pre-genesis-genesis-cardano.yml"

jobs:
  genesis-ledger-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6.7"
          cabal-version: "3.12.1.0"

      - name: Install Plutus native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev libsecp256k1-dev pkg-config build-essential git
          rm -rf /tmp/blst
          git clone --depth 1 --branch v0.3.14 https://github.com/supranational/blst.git /tmp/blst
          chmod +x /tmp/blst/build.sh
          set +e
          (cd /tmp/blst && ./build.sh)
          rc=$?
          set -e
          test -s /tmp/blst/libblst.a
          if [ "$rc" -ne 0 ]; then
            echo "blst build returned $rc after producing the verified archive; continuing."
          fi
          sudo install -m 0644 /tmp/blst/libblst.a /usr/local/lib/libblst.a
          sudo install -m 0644 /tmp/blst/bindings/blst_aux.h /usr/local/include/blst_aux.h
          sudo install -m 0644 /tmp/blst/bindings/blst.h /usr/local/include/blst.h
          sudo install -m 0644 /tmp/blst/bindings/blst.hpp /usr/local/include/blst.hpp
          sudo mkdir -p /usr/local/lib/pkgconfig
          printf '%s\n' \
            'prefix=/usr/local' \
            'exec_prefix=/usr/local' \
            'libdir=/usr/local/lib' \
            'includedir=/usr/local/include' \
            'Name: libblst' \
            'Description: Multilingual BLS12-381 signature library' \
            'Version: 0.3.14' \
            'Cflags: -I/usr/local/include' \
            'Libs: -L/usr/local/lib -lblst' \
            | sudo tee /usr/local/lib/pkgconfig/libblst.pc >/dev/null
          sudo ldconfig

      - name: Update Cabal package index
        run: cabal update

      - name: Build and export fresh Plutus artifacts
        run: cabal run exe:export-scripts
        working-directory: plutus

      - name: Install pinned Yaci DevKit
        run: npm install -g @bloxbean/yaci-devkit@0.12.0-beta5

      - name: Start isolated Cardano devnet
        run: |
          mkdir -p audit/yaci-evidence
          nohup yaci-devkit up --enable-yaci-store > audit/yaci-evidence/yaci.log 2>&1 &
          echo $! > audit/yaci-evidence/yaci.pid

      - name: Wait for Yaci Store
        run: |
          for i in $(seq 1 90); do
            if curl --fail --silent http://localhost:8080/api/v1/epochs/latest > audit/yaci-evidence/epoch-latest.json; then
              exit 0
            fi
            sleep 2
          done
          tail -300 audit/yaci-evidence/yaci.log || true
          exit 1

      - name: Derive funded CI test wallet
        run: node audit/cardano-integration/create-test-wallet.mjs

      - name: Normalize legacy Lucid ESM entrypoint for Node 22
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          package_path = Path("node_modules/lucid-cardano/package.json")
          package = json.loads(package_path.read_text())
          package["type"] = "module"
          package["exports"] = {
              ".": {
                  "types": "./types/mod.d.ts",
                  "import": "./esm/mod.js",
              }
          }
          package_path.write_text(json.dumps(package, indent=2) + "\n")
          PY

      - name: Execute real PRE-GENESIS -> GENESIS transition
        run: node --import tsx/esm audit/pre-genesis-genesis/genesis-carrier-ledger-trace.ts

      - name: Upload Genesis ledger evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-genesis-genesis-cardano-evidence
          path: audit/yaci-evidence/
