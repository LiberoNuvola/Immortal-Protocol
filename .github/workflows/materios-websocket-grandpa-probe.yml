name: Materios WebSocket GRANDPA Historical Window Probe

concurrency:
  group: materios-websocket-grandpa-probe-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      websocket_endpoint:
        description: "Existing Materios WebSocket RPC endpoint; do not include credentials"
        required: true
        type: string
        default: "wss://materios.fluxpointstudios.com/preprod-rpc"
      subscription_wait_ms:
        description: "Bounded wait for live justification notification in milliseconds"
        required: true
        type: string
        default: "0"
  push:
    branches:
      - work/b3-materios-provenance-evidence
    paths:
      - ".github/workflows/materios-websocket-grandpa-probe.yml"
      - "poc/materios-checkpoint/src/probe-websocket-rpc-capabilities.mjs"

permissions:
  contents: read

jobs:
  ws-grandpa-probe:
    name: Historical GRANDPA target ${{ matrix.target_block }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        target_block:
          - 2455115
          - 2455116
          - 2509528
          - 2509824
          - 2509826
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: poc/materios-checkpoint/package-lock.json

      - name: Install pinned read-only probe dependencies
        working-directory: poc/materios-checkpoint
        run: npm ci --ignore-scripts

      - name: Run WebSocket probe against exact historical block
        id: probe
        continue-on-error: true
        working-directory: poc/materios-checkpoint
        env:
          MATERIOS_WS: ${{ github.event.inputs.websocket_endpoint || 'wss://materios.fluxpointstudios.com/preprod-rpc' }}
          MATERIOS_CHAIN_ID: materios_preprod_v6
          MATERIOS_GENESIS_HASH: "0x0e46e33f639a56cc8780fd871d9a15e16d99af248526f907cb560cb40849f7bf"
          MATERIOS_WS_TIMEOUT_MS: "12000"
          MATERIOS_WS_SUBSCRIPTION_WAIT_MS: ${{ github.event.inputs.subscription_wait_ms || '0' }}
          MATERIOS_FINALITY_CANDIDATE_BLOCK_NUMBER: ${{ matrix.target_block }}
          MATERIOS_FINALITY_CANDIDATE_FORCE: "true"
          MATERIOS_FINALITY_WAIT_SECONDS: "0"
          MATERIOS_WS_EVIDENCE_OUT: ${{ runner.temp }}/MateriosWebSocketRpcProbe-${{ matrix.target_block }}.json
        run: node src/probe-websocket-rpc-capabilities.mjs

      - name: Cross-check exact target over independent public HTTP RPC
        if: always()
        working-directory: poc/materios-checkpoint
        env:
          TARGET_BLOCK: ${{ matrix.target_block }}
          WS_EVIDENCE_PATH: ${{ runner.temp }}/MateriosWebSocketRpcProbe-${{ matrix.target_block }}.json
          OUT_PATH: ${{ runner.temp }}/MateriosGrandpaTargetCrossRoute-${{ matrix.target_block }}.json
          MATERIOS_HTTP_RPC: https://materios.fluxpointstudios.com/rpc
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { hashMateriosHeader } from '../materios-smoldot/target-ancestry-bridge.mjs';

          const target = Number(process.env.TARGET_BLOCK);
          const expectedGenesis = '0x0e46e33f639a56cc8780fd871d9a15e16d99af248526f907cb560cb40849f7bf';
          const evidence = {
            schema_version: 'materios-grandpa-exact-target-cross-route-v1',
            captured_at: new Date().toISOString(),
            chain_id: 'materios_preprod_v6',
            target_block_number: target,
            endpoints: {
              websocket: 'wss://materios.fluxpointstudios.com/preprod-rpc',
              http: 'https://materios.fluxpointstudios.com/rpc'
            },
            websocket: null,
            http: { status: 'NOT_ATTEMPTED' },
            comparison: { status: 'NOT_COMPARABLE' },
            trust_scope: 'Read-only raw acquisition and cross-route header binding only. No GRANDPA signature, quorum, active-set, authority-transition, or finality claim.'
          };
          const norm = x => typeof x === 'string' ? x.toLowerCase() : x;
          const headerShape = h => ({
            parentHash: norm(h?.parentHash),
            number: norm(h?.number),
            stateRoot: norm(h?.stateRoot),
            extrinsicsRoot: norm(h?.extrinsicsRoot),
            digest: (h?.digest?.logs ?? []).map(norm)
          });
          const rpc = async (method, params) => {
            const response = await fetch(process.env.MATERIOS_HTTP_RPC, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }),
              signal: AbortSignal.timeout(20000)
            });
            if (!response.ok) throw new Error('HTTP_' + response.status + '_' + method);
            const body = await response.json();
            if (body.error) throw new Error('RPC_' + method + '_' + JSON.stringify(body.error));
            if (!Object.prototype.hasOwnProperty.call(body, 'result')) throw new Error('RPC_RESULT_MISSING_' + method);
            return body.result;
          };
          const frnk = list => {
            if (!Array.isArray(list)) return [];
            return list.filter(x => Array.isArray(x) && x.length === 2 &&
              (x[0] === '0x46524e4b' || x[0] === 'FRNK') &&
              typeof x[1] === 'string' && /^0x(?:[0-9a-f]{2})+$/i.test(x[1]))
              .map(x => ({ engine_id: '0x46524e4b', raw_hex: x[1].toLowerCase(),
                sha256: createHash('sha256').update(Buffer.from(x[1].slice(2), 'hex')).digest('hex') }));
          };

          if (fs.existsSync(process.env.WS_EVIDENCE_PATH)) {
            const ws = JSON.parse(fs.readFileSync(process.env.WS_EVIDENCE_PATH, 'utf8'));
            const c = ws.historical_candidate_probe ?? {};
            evidence.websocket = {
              connected: ws.websocket?.connected === true,
              genesis_hash_match: ws.identity?.genesis_hash_match === true,
              requested_block_number: c.requested_block_number ?? null,
              returned_block_number: c.returned_block_number ?? null,
              requested_block_hash: c.requested_block_hash ?? null,
              status: c.status ?? 'UNKNOWN',
              header: c.header ?? null,
              frnk_entries: c.justifications?.entries?.filter(x => x.engineId === '0x46524e4b') ?? [],
              error: c.error ?? null
            };
          } else {
            evidence.websocket = { status: 'EVIDENCE_FILE_MISSING' };
          }

          try {
            const genesis = await rpc('chain_getBlockHash', [0]);
            if (norm(genesis) !== expectedGenesis) throw new Error('HTTP_GENESIS_HASH_MISMATCH');
            const blockHash = await rpc('chain_getBlockHash', [target]);
            if (typeof blockHash !== 'string' || !/^0x[0-9a-f]{64}$/i.test(blockHash)) {
              throw new Error('HTTP_TARGET_HASH_UNAVAILABLE');
            }
            const [header, block] = await Promise.all([
              rpc('chain_getHeader', [blockHash]),
              rpc('chain_getBlock', [blockHash])
            ]);
            if (!block?.block?.header) throw new Error('HTTP_SIGNED_BLOCK_MALFORMED');
            const computedHash = hashMateriosHeader(header);
            if (norm(computedHash) !== norm(blockHash)) throw new Error('HTTP_HEADER_HASH_RECOMPUTE_MISMATCH');
            if (JSON.stringify(headerShape(header)) !== JSON.stringify(headerShape(block.block.header))) {
              throw new Error('HTTP_HEADER_BLOCK_RESPONSE_MISMATCH');
            }
            evidence.http = {
              status: 'CAPTURED',
              genesis_hash_match: true,
              block_hash: norm(blockHash),
              computed_header_hash: norm(computedHash),
              header,
              frnk_entries: frnk(block.justifications),
              justification_entry_count: Array.isArray(block.justifications) ? block.justifications.length : null
            };
            try {
              const storageKey = '0x5f9cc45b7a00c5899361e1c6099678dc8a2d09463effcc78a22d75b9cb87dffc';
              const [runtimeSetHex, runtimeAuthoritiesHex, storageSetHex] = await Promise.all([
                rpc('state_call', ['GrandpaApi_current_set_id', '0x', blockHash]),
                rpc('state_call', ['GrandpaApi_grandpa_authorities', '0x', blockHash]),
                rpc('state_getStorage', [storageKey, blockHash])
              ]);
              const decodeU64 = value => {
                if (typeof value !== 'string' || !/^0x[0-9a-f]{16}$/i.test(value)) return null;
                return Buffer.from(value.slice(2), 'hex').readBigUInt64LE(0).toString();
              };
              evidence.http.state_at_target = {
                status: 'CAPTURED',
                runtime_set_id_hex: runtimeSetHex,
                runtime_set_id: decodeU64(runtimeSetHex),
                runtime_authorities_hex: runtimeAuthoritiesHex,
                runtime_authorities_sha256: createHash('sha256').update(Buffer.from(runtimeAuthoritiesHex.slice(2), 'hex')).digest('hex'),
                current_set_id_storage_key: storageKey,
                storage_set_id_hex: storageSetHex,
                storage_set_id: decodeU64(storageSetHex)
              };
            } catch (stateError) {
              evidence.http.state_at_target = { status: 'UNAVAILABLE', error: String(stateError) };
            }
          } catch (error) {
            evidence.http = { status: 'ERROR', error: String(error) };
          }

          const w = evidence.websocket;
          const h = evidence.http;
          if (w?.genesis_hash_match === true && h.status === 'CAPTURED' &&
              Number(w.returned_block_number) === target &&
              Number(w.requested_block_number) === target &&
              norm(w.requested_block_hash) === h.block_hash) {
            const sameHeader = JSON.stringify(headerShape(w.header)) === JSON.stringify(headerShape(h.header));
            const wsFrnk = w.frnk_entries ?? [];
            const httpFrnk = h.frnk_entries ?? [];
            const wsPayloads = wsFrnk.map(x => String(x.rawPayloadHex).toLowerCase()).sort();
            const httpPayloads = httpFrnk.map(x => x.raw_hex).sort();
            evidence.comparison = {
              status: sameHeader ? 'HEADER_BOUND_BOTH_ROUTES' : 'HEADER_FIELDS_DISAGREE',
              same_header_fields: sameHeader,
              websocket_frnk_count: wsPayloads.length,
              http_frnk_count: httpPayloads.length,
              same_frnk_payload_set: JSON.stringify(wsPayloads) === JSON.stringify(httpPayloads),
              websocket_frnk_sha256: wsFrnk.map(x => x.payloadSha256 ?? null),
              http_frnk_sha256: httpFrnk.map(x => x.sha256)
            };
          } else {
            evidence.comparison = {
              status: 'ROUTES_NOT_CROSS_BOUND',
              websocket_genesis_ok: w?.genesis_hash_match === true,
              http_genesis_ok: h.status === 'CAPTURED',
              websocket_target_ok: Number(w?.returned_block_number) === target,
              websocket_hash: w?.requested_block_hash ?? null,
              http_hash: h?.block_hash ?? null
            };
          }
          fs.writeFileSync(process.env.OUT_PATH, JSON.stringify(evidence, null, 2) + '\n');
          console.log(JSON.stringify({
            target,
            http: evidence.http.status,
            websocket: evidence.websocket?.status ?? 'UNKNOWN',
            comparison: evidence.comparison
          }, null, 2));
          NODE

      - name: Upload raw WebSocket and HTTP cross-route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: materios-grandpa-target-${{ matrix.target_block }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/MateriosWebSocketRpcProbe-${{ matrix.target_block }}.json
            ${{ runner.temp }}/MateriosGrandpaTargetCrossRoute-${{ matrix.target_block }}.json
          if-no-files-found: warn
          retention-days: 30
