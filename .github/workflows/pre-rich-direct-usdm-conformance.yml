name: PRE-RICH Direct-USDM Conformance

on:
  push:
    branches:
      - work/immortal-green-closure
    paths:
      - "Adapter/CARDANO/observation/DirectUsdmEev.ts"
      - "Adapter/CARDANO/observation/DirectUsdmEev.test.ts"
      - "Adapter/CARDANO/observation/PreprodDirectUsdmObservation.ts"
      - "Adapter/CARDANO/observation/PreprodDirectUsdmObservation.test.ts"
      - "audit/cardano-integration/preprod-direct-usdm-source-set.mjs"
      - "audit/cardano-integration/preprod-direct-oracle-state-bootstrap.mjs"
      - "audit/cardano-integration/preprod-direct-usdm-bootstrap.mjs"
      - "relayer/preprodIssueAdmissionProvider.js"
      - "relayer/preprodIssueAdmissionProvider.test.mjs"
      - "relayer/signedIssueAuthority.js"
      - "relayer/signedIssueAuthority.test.js"
      - "Adapter/CARDANO/observation/PreprodAuthoritativeIssueProvider.ts"
      - "Adapter/CARDANO/observation/PreprodAuthoritativeIssueProvider.test.ts"
      - "src/preRichIssueAdmissionBridge.ts"
      - "src/__tests__/preRichIssueAdmissionBridge.test.ts"
      - "src/mint.ts"
      - ".github/workflows/pre-rich-direct-usdm-conformance.yml"
  workflow_dispatch:

concurrency:
  group: pre-rich-direct-usdm-conformance
  cancel-in-progress: true

jobs:
  direct-usdm-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run direct-USDM unit tests
        run: |
          npx vitest run             Adapter/CARDANO/observation/DirectUsdmEev.test.ts             Adapter/CARDANO/observation/PreprodDirectUsdmObservation.test.ts             --reporter=verbose

      - name: Typecheck authoritative Issue provider boundary
        run: |
          npx tsc --noEmit --strict --skipLibCheck             --target ES2020             --module ESNext             --moduleResolution bundler             --allowImportingTsExtensions             Adapter/CARDANO/observation/HaskellIssueAdmissionProvider.ts             Adapter/CARDANO/observation/PreprodAuthoritativeIssueProvider.ts

      - name: Run authority and admission conformance
        run: |
          node relayer/signedIssueAuthority.test.js
          npx vitest run             Adapter/CARDANO/observation/PreprodAuthoritativeIssueProvider.test.ts             src/__tests__/preRichIssueAdmissionBridge.test.ts             --reporter=verbose

      - name: Parse direct-USDM audit scripts
        run: |
          node --check audit/cardano-integration/preprod-direct-usdm-source-set.mjs
          node --check audit/cardano-integration/preprod-direct-usdm-bootstrap.mjs
          node --check audit/cardano-integration/preprod-direct-usdm-qualification.mjs

      - name: Build browser bundle
        run: npm run build
