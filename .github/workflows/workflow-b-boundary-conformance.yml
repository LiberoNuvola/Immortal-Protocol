name: Workflow B Boundary Conformance

on:
  push:
    branches: [work/b3-materios-provenance-evidence]
    paths:
      - 'audit/algorithmic-governability/**'
      - 'docs/research/**'
      - 'src/**'
      - 'Adapter/CARDANO/**'
      - 'Adapter/MIDNIGHT/**'
      - 'relayer/**'
      - 'scripts/check-rf8-production-boundary.mjs'
      - '.github/workflows/workflow-b-boundary-conformance.yml'
  pull_request:
    paths:
      - 'audit/algorithmic-governability/**'
      - 'docs/research/**'
      - 'src/**'
      - 'Adapter/CARDANO/**'
      - 'Adapter/MIDNIGHT/**'
      - 'relayer/**'
      - 'scripts/check-rf8-production-boundary.mjs'
      - '.github/workflows/workflow-b-boundary-conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Workflow B harness coverage guard
        run: node audit/algorithmic-governability/workflow-b-harness-coverage-boundary.mjs
      - name: Adapter maturity registry boundary
        run: node audit/algorithmic-governability/adapter-maturity-registry-boundary.mjs
      - name: IMMORTAL generalized derivation boundary
        run: node audit/algorithmic-governability/generalized-function-family-boundary.mjs
      - name: EXP cross-function conformance boundary
        run: node audit/algorithmic-governability/exp-cross-function-conformance-boundary.mjs
      - name: Bitcoin L1 adversarial boundary
        run: node audit/algorithmic-governability/bitcoin-l1-adversarial-boundary.mjs
      - name: F6 Genesis evidence boundary
        run: node audit/algorithmic-governability/f6-genesis-evidence-boundary.mjs
      - name: R4 liveness evidence boundary
        run: node audit/algorithmic-governability/r4-liveness-evidence-boundary.mjs
      - name: Beacon 4 independence/conflict boundary
        run: node audit/algorithmic-governability/beacon-4-independence-conflict-boundary.mjs
      - name: Beacon registry commitment gap boundary
        run: node audit/algorithmic-governability/beacon-registry-commitment-gap-boundary.mjs
      - name: EXP-06 evidence catalog boundary
        run: node audit/algorithmic-governability/exp-06-evidence-catalog-boundary.mjs
      - name: EXP-01 typed obligation bucket boundary
        run: node audit/algorithmic-governability/exp-01-typed-obligation-buckets-boundary.mjs
      - name: EXP-02 term structure horizon boundary
        run: node audit/algorithmic-governability/exp-02-term-structure-horizon-boundary.mjs
      - name: EXP-01 seniority order boundary
        run: node audit/algorithmic-governability/exp-01-seniority-order-boundary.mjs
      - name: EXP-03 minimal asset eligibility boundary
        run: node audit/algorithmic-governability/exp-03-minimal-asset-eligibility-boundary.mjs
      - name: EXP-03 asset valuation haircut boundary
        run: node audit/algorithmic-governability/exp-03-asset-valuation-haircut-boundary.mjs
      - name: EXP-04 profile composition boundary
        run: node audit/algorithmic-governability/exp-04-profile-composition-boundary.mjs
      - name: EXP-05 contingent claims boundary
        run: node audit/algorithmic-governability/exp-05-contingent-claims-boundary.mjs
      - name: EXP-08 netting and offset boundary
        run: node audit/algorithmic-governability/exp-08-netting-offset-boundary.mjs
      - name: EXP-09 obligation transfer boundary
        run: node audit/algorithmic-governability/exp-09-obligation-transfer-novation-boundary.mjs
      - name: EXP-10 explicit risk budget boundary
        run: node audit/algorithmic-governability/exp-10-explicit-risk-budget-boundary.mjs
      - name: EXP-11 deterministic allocation boundary
        run: node audit/algorithmic-governability/exp-11-deterministic-auction-allocation-boundary.mjs
      - name: EXP-12 observer authority split boundary
        run: node audit/algorithmic-governability/exp-12-observer-authority-split-boundary.mjs
      - name: B3-C RootProof verification boundary
        run: node audit/algorithmic-governability/b3-c-rootproof-boundary.mjs
      - name: B3 workflow routing boundary
        run: node audit/algorithmic-governability/b3-workflow-routing-boundary.mjs
      - name: B3-A witness packet boundary
        run: node audit/algorithmic-governability/b3-a-witness-packet-boundary.mjs
      - name: B3 real witness promotion boundary
        run: node audit/algorithmic-governability/b3-real-witness-promotion-boundary.mjs
      - name: B5/B6 action evidence boundary
        run: node audit/algorithmic-governability/b5-b6-action-evidence-boundary.mjs
      - name: Action evidence integrity boundary
        run: node audit/algorithmic-governability/action-evidence-integrity-boundary.mjs
      - name: Midnight adapter Intent boundary
        run: node audit/algorithmic-governability/midnight-adapter-intent-boundary.mjs
      - name: Bitcoin L1 evidence envelope boundary
        run: node audit/algorithmic-governability/bitcoin-l1-evidence-envelope-boundary.mjs
      - name: Midnight execution and evidence boundary
        run: node audit/algorithmic-governability/midnight-execution-evidence-boundary.mjs
      - name: Moriarty IMMORTAL Intent semantic boundary
        run: node audit/algorithmic-governability/moriarty-intent-semantic-boundary.mjs
      - name: Moriarty Intent identity binding boundary
        run: node audit/algorithmic-governability/moriarty-intent-identity-binding-boundary.mjs
      - name: Moriarty IMMORTAL Intent correspondence boundary
        run: node audit/algorithmic-governability/moriarty-immortal-intent-correspondence-boundary.mjs
      - name: Install Node test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: EXP-07 canonical hysteresis conformance
        run: npx vitest run src/__tests__/preRichHysteresis.test.ts PRE-RICH/tests/conformance/PreRichHysteresisBinding.test.ts
      - name: Midnight TypeScript execution/evidence conformance
        run: npx vitest run Adapter/MIDNIGHT/ExecutionEvidenceBoundary.test.ts
      - name: Contributor credential separation boundary
        run: node audit/algorithmic-governability/contributor-credential-separation-boundary.mjs
      - name: Contributor credential transferability independence boundary
        run: node audit/algorithmic-governability/contributor-credential-transferability-independence-boundary.mjs
      - name: Contributor Reward NFT anti-capture boundary
        run: node audit/algorithmic-governability/contributor-reward-nft-boundary.mjs
      - name: Contributor reward boundary
        run: node audit/algorithmic-governability/reward-contributor-boundary.mjs
      - name: Treasury and reward accounting boundary
        run: node audit/algorithmic-governability/reward-treasury-boundary.mjs
      - name: Fee-bearing transition separation boundary
        run: node audit/algorithmic-governability/fee-bearing-transition-separation-boundary.mjs
      - name: RF8 economic mutator inventory boundary
        run: node audit/algorithmic-governability/rf8-economic-mutator-inventory-boundary.mjs
      - name: RF8 production submission boundary
        run: node scripts/check-rf8-production-boundary.mjs
      - name: Multi-adapter semantic boundary
        run: node audit/algorithmic-governability/multi-adapter-semantic-boundary.mjs
      - name: Permissionless liveness and replay boundary
        run: node audit/algorithmic-governability/permissionless-liveness-boundary.mjs
      - name: Competing-monitor authority boundary
        run: node audit/algorithmic-governability/no-result-dependent-authority.mjs
      - name: Contribution acceptance evidence-gate boundary
        run: node audit/algorithmic-governability/contribution-acceptance-boundary.mjs
      - name: Competing-monitor epistemic boundary
        run: node audit/algorithmic-governability/competing-monitor-epistemic-boundary.mjs
      - name: Treasury legacy isolation
        run: node audit/algorithmic-governability/treasury-legacy-isolation.mjs
      - name: AG-01 executable wiring boundary
        run: node audit/algorithmic-governability/ag01-executable-wiring-boundary.mjs
