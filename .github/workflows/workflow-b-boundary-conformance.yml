name: Workflow B Boundary Conformance

on:
  push:
    branches: [work/b3-materios-provenance-evidence]
    paths:
      - 'audit/algorithmic-governability/**'
      - 'docs/research/**'
      - '.github/workflows/workflow-b-boundary-conformance.yml'
  pull_request:
    paths:
      - 'audit/algorithmic-governability/**'
      - '.github/workflows/workflow-b-boundary-conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: IMMORTAL generalized derivation boundary
        run: node audit/algorithmic-governability/generalized-function-family-boundary.mjs
      - name: EXP-06 evidence catalog boundary
        run: node audit/algorithmic-governability/exp-06-evidence-catalog-boundary.mjs
      - name: EXP-01 typed obligation bucket boundary
        run: node audit/algorithmic-governability/exp-01-typed-obligation-buckets-boundary.mjs
      - name: EXP-03 minimal asset eligibility boundary
        run: node audit/algorithmic-governability/g3-minimal-asset-eligibility-boundary.mjs
      - name: Install Node test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: EXP-07 canonical hysteresis conformance
        run: npx vitest run src/__tests__/preRichHysteresis.test.ts PRE-RICH/tests/conformance/PreRichHysteresisBinding.test.ts
      - name: Contributor credential separation boundary
        run: node audit/algorithmic-governability/contributor-credential-separation-boundary.mjs
      - name: Contributor reward boundary
        run: node audit/algorithmic-governability/reward-contributor-boundary.mjs
      - name: Treasury and reward accounting boundary
        run: node audit/algorithmic-governability/reward-treasury-boundary.mjs
      - name: Multi-adapter semantic boundary
        run: node audit/algorithmic-governability/multi-adapter-semantic-boundary.mjs
      - name: Permissionless liveness and replay boundary
        run: node audit/algorithmic-governability/permissionless-liveness-boundary.mjs
      - name: Competing-monitor authority boundary
        run: node audit/algorithmic-governability/no-result-dependent-authority.mjs
      - name: Treasury legacy isolation
        run: node audit/algorithmic-governability/treasury-legacy-isolation.mjs
