name: Minswap Preprod tUSDM Pool Read-Only Observation

on:
  workflow_dispatch:
  push:
    branches:
      - work/immortal-green-closure
    paths:
      - "audit/cardano-integration/observe-minswap-preprod-tusdm-pool.mjs"
      - ".github/workflows/minswap-preprod-tusdm-observation.yml"

permissions:
  contents: read

jobs:
  observe-preprod-pool:
    name: Scan Minswap V1/V2 and configured Preprod StableSwap for exact ADA/tUSDM pair
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KOIOS_PREPROD_URL: ${{ vars.KOIOS_PREPROD_URL || 'https://preprod.koios.rest/api/v1' }}
    steps:
      - name: Checkout branch revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure JSR registry required by Minswap SDK
        run: printf '%s\n' '@jsr:registry=https://npm.jsr.io' >> "$HOME/.npmrc"

      - name: Install isolated read-only observation dependency
        run: npm install --prefix audit/cardano-integration --no-audit --no-fund @minswap/sdk@0.5.0

      - name: Query Minswap V1/V2 and configured StableSwap through public Koios; recheck exact out-references if a pair is found
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/preprod-evidence
          node --experimental-wasm-modules audit/cardano-integration/observe-minswap-preprod-tusdm-pool.mjs | tee audit/preprod-evidence/minswap-preprod-tusdm-pool-observation.json

      - name: Upload read-only observation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minswap-preprod-tusdm-pool-observation-${{ github.sha }}
          path: audit/preprod-evidence/minswap-preprod-tusdm-pool-observation.json
          if-no-files-found: warn
          retention-days: 30
