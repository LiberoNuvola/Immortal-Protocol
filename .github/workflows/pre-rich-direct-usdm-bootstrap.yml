name: PRE-RICH Direct-USDM Preprod Bootstrap

on:
  workflow_dispatch:
    inputs:
      tusdm_unit:
        description: "Exact approved/candidate Preprod tUSDM asset unit"
        required: true
        default: "e675b46e4d2242c991a8932a99db3044e80515ae14b4c4ccf6b3f4c90014df10745553444d"
        type: string
      oracle_state_policy_id:
        description: "Exact deployed Oracle State policy ID"
        required: true
        type: string
      oracle_state_token_name_hex:
        description: "Exact deployed Oracle State token name (hex)"
        required: true
        type: string
      oracle_publisher_pkh:
        description: "Exact deployed Oracle publisher key hash"
        required: true
        type: string
      wallet_address:
        description: "Exact Preprod wallet address resolved by PREPROD_REVEAL_SEED"
        required: true
        type: string

concurrency:
  group: pre-rich-direct-usdm-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    environment: DEMETER
    timeout-minutes: 30
    env:
      KOIOS_PREPROD_URL: https://preprod.koios.rest/api/v1
      PREPROD_REVEAL_SEED: ${{ secrets.PREPROD_REVEAL_SEED }}
      PREPROD_WALLET_ADDRESS: ${{ inputs.wallet_address }}
      PREPROD_TUSDM_UNIT: ${{ inputs.tusdm_unit }}
      PREPROD_ORACLE_STATE_POLICY_ID: ${{ inputs.oracle_state_policy_id }}
      PREPROD_ORACLE_STATE_TOKEN_NAME_HEX: ${{ inputs.oracle_state_token_name_hex }}
      PREPROD_ORACLE_PUBLISHER_PKH: ${{ inputs.oracle_publisher_pkh }}
      PREPROD_EVIDENCE_DIR: audit/preprod-evidence
      PREPROD_DEPLOYMENT_MANIFEST: audit/preprod-evidence/preprod-direct-usdm-deployment.json

    steps:
      - name: Checkout exact workflow head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install repository dependencies
        run: npm install --no-audit --no-fund

      - name: Verify wallet signing secret
        run: test -n "$PREPROD_REVEAL_SEED"

      - name: Print deployment identities
        run: |
          echo "network=cardano-preprod"
          echo "tusdm_unit=$PREPROD_TUSDM_UNIT"
          echo "oracle_state_policy_id=$PREPROD_ORACLE_STATE_POLICY_ID"
          echo "oracle_state_token_name_hex=$PREPROD_ORACLE_STATE_TOKEN_NAME_HEX"
          echo "oracle_publisher_pkh=$PREPROD_ORACLE_PUBLISHER_PKH"
          echo "wallet_address=$PREPROD_WALLET_ADDRESS"

      - name: Verify direct-USDM unit is the current external Preprod candidate
        run: |
          test "$PREPROD_TUSDM_UNIT" = "e675b46e4d2242c991a8932a99db3044e80515ae14b4c4ccf6b3f4c90014df10745553444d"
          echo "tUSDM candidate identity matches the currently evidenced x402 Preprod asset."

      - name: Bootstrap direct-USDM B1 PrizePool
        run: node --import tsx/esm audit/cardano-integration/preprod-direct-usdm-bootstrap.mjs

      - name: Verify direct-USDM source-set evidence
        run: |
          test -s audit/preprod-evidence/preprod-direct-usdm-deployment.json

      - name: Upload direct-USDM deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortal-preprod-direct-usdm-deployment
          path: audit/preprod-evidence/
          if-no-files-found: error
