name: IMMORTAL Cardano Integration Lab

concurrency:
  group: -github-workflows-immortal-cardano-lab-yml-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/immortal-green-closure
    paths:
      - "audit/cardano-integration/**"
      - "audit/cardano-ledger-runner/**"
      - "poc/aiken-reveal-parity/**"
      - "src/**"
      - "plutus/**"
      - "Adapter/**"
      - "PRE-RICH/onchain/**"
      - ".github/actions/setup-plutus/**"
      - ".github/workflows/immortal-cardano-lab.yml"
      - "scripts/build-evidence-packet.mjs"
      - "scripts/test-evidence-packet.mjs"
      - "scripts/register-evidence-in-notion.mjs"
      - "scripts/test-notion-evidence-ledger.mjs"
      - "scripts/build-jev-operational-prompt.mjs"
      - "scripts/test-jev-operational-prompt.mjs"
  pull_request:
    branches:
      - main
    paths:
      - "audit/**"
      - "src/**"
      - "plutus/**"
      - "Adapter/**"
      - "PRE-RICH/onchain/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      claim_reference_diagnostic:
        description: "Serialize Claim CBOR for size/reference-script diagnosis only; never signs or submits Claim"
        required: false
        type: boolean
        default: false
      run_legacy_haskell_claim_diagnostic:
        description: "Opt in to the legacy Haskell V2 Claim comparison trace; not part of the active Aiken Claim path"
        required: false
        type: boolean
        default: false

jobs:
  devnet-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact workflow head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Install isolated lab dependencies
        run: npm install --prefix audit/cardano-integration

      - name: Restore Cabal/Plutus build state
        id: plutus-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            dist-newstyle
            plutus/dist-newstyle
            audit/cardano-ledger-runner/dist-newstyle
          key: plutus-build-v2-${{ runner.os }}-${{ hashFiles('**/*.cabal', 'cabal.project*', '**/*.hs', '**/*.lhs') }}
          restore-keys: |
            plutus-build-v2-${{ runner.os }}-
            plutus-build-${{ runner.os }}-

      - name: Setup canonical Plutus CI
        uses: ./.github/actions/setup-plutus
        with:
          update-hackage: ${{ steps.plutus-cache.outputs.cache-matched-key == '' }}

      - name: Run universal economic portability vectors against reference kernel
        run: |
          set -euo pipefail
          mkdir -p audit/yaci-evidence
          # Run from repository root: cabal.project package paths (including ./plutus)
          # are resolved relative to the current working directory by this CI setup.
          cabal --project-file=cabal.project exec -- runghc -iIMMORTAL/kernel -iIMMORTAL/state Adapter/REFERENCE/export/ReferenceEconomicConformance.hs | tee audit/yaci-evidence/reference-conformance.txt

      # Generate validators from the exact source snapshot tested below.
      - name: Generate fresh Plutus validator artifacts
        run: cabal run exe:export-scripts

      - name: Compile Claim validator source conformance
        working-directory: plutus
        run: |
          set -euo pipefail
          cabal test v3-golden-vector-tests --enable-tests --test-show-details=direct
          cabal test economic-admission-tests --enable-tests --test-show-details=direct

      - name: Save Cabal/Plutus build state
        if: always() && steps.plutus-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            dist-newstyle
            plutus/dist-newstyle
            audit/cardano-ledger-runner/dist-newstyle
          key: plutus-build-v2-${{ runner.os }}-${{ hashFiles('**/*.cabal', 'cabal.project*', '**/*.hs', '**/*.lhs') }}

      - name: Record generated artifact hashes
        run: |
          mkdir -p audit/yaci-evidence
          {
            echo "artifact_commit=$GITHUB_SHA"
            for f in plutus/out/*.plutus.json; do
              sha256sum "$f"
            done
          } | tee audit/yaci-evidence/artifact-hashes.txt

      - name: Bind generated artifacts to trace consumers
        run: |
          cp plutus/out/treasury.plutus.json src/plutusScripts/treasury.plutus.json
          cp plutus/out/counterValidator.plutus.json src/plutusScripts/counterValidator.plutus.json
          cp plutus/out/b1PrizePoolFactory.plutus.json src/plutusScripts/b1PrizePoolFactory.plutus.json
          cp plutus/out/mintPolicyFactory.plutus.json src/plutusScripts/mintPolicyFactory.plutus.json
          cp plutus/out/prizeValidatorFactory.plutus.json src/plutusScripts/prizeValidatorFactory.plutus.json
          cp plutus/out/beaconRegistry.plutus.json src/plutusScripts/beaconRegistry.plutus.json

      - name: Setup legacy Lucid runtime
        uses: ./.github/actions/setup-legacy-lucid

      - name: Install pinned Yaci DevKit
        run: npm install -g @bloxbean/yaci-devkit@0.12.0-beta5

      - name: Start isolated Cardano devnet with Yaci Store
        run: |
          mkdir -p audit/yaci-evidence
          # DevKit beta5 starts Store with Scalus; the next step restarts it
          # after starting Ogmios so the selected evaluator is unambiguous.
          nohup yaci-devkit up --enable-yaci-store > audit/yaci-evidence/yaci.log 2>&1 &
          echo $! > audit/yaci-evidence/yaci.pid

      - name: Wait for initial Yaci Store
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if curl --fail --silent http://localhost:8080/api/v1/epochs/latest > audit/yaci-evidence/epoch-latest.json; then
              echo "YACI_STORE_INITIAL_READY=1" | tee audit/yaci-evidence/bootstrap.txt
              exit 0
            fi
            sleep 2
          done
          echo "YACI_STORE_INITIAL_READY=0" | tee audit/yaci-evidence/bootstrap.txt
          tail -300 audit/yaci-evidence/yaci.log > audit/yaci-evidence/yaci-diagnostic-tail.log || true
          exit 1

      - name: Start and qualify Ogmios evaluator before Yaci Store
        run: |
          set -euo pipefail
          mkdir -p audit/yaci-evidence
          store_config="$HOME/.yaci-cli/components/store/config/application.properties"
          if [ ! -f "$store_config" ]; then
            echo "Generated Yaci Store configuration not found: $store_config"
            find "$HOME/.yaci-cli" -path '*/store/config/application.properties' -print || true
            exit 1
          fi

          # Rebind the evaluator in a controlled order: stop Store, start Ogmios,
          # then restart Store so it selects Ogmios during process startup.
          curl --fail --silent --show-error --request POST \
            http://localhost:10000/local-cluster/api/admin/yaci-store/stop \
            -o audit/yaci-evidence/yaci-store-stop.json
          port_free() { ! timeout 1 bash -c '</dev/tcp/127.0.0.1/8080' 2>/dev/null; }
          store_stopped=0
          for i in $(seq 1 60); do
            if port_free; then
              store_stopped=1
              break
            fi
            sleep 1
          done
          if [ "$store_stopped" -ne 1 ]; then
            echo "Yaci Store still owns port 8080 after admin stop; collecting owner evidence."
            {
              echo "== admin stop response"
              cat audit/yaci-evidence/yaci-store-stop.json || true
              echo
              echo "== listener on 8080"
              (command -v fuser >/dev/null && fuser -v -n tcp 8080) 2>&1 || true
              echo "== socket table"
              (command -v ss >/dev/null && ss -ltnp '( sport = :8080 )') 2>&1 || true
            } | tee audit/yaci-evidence/yaci-store-stop-diagnostics.txt

            # Only terminate a listener when its command line identifies it as
            # Yaci/Store. Never kill an unrelated process merely because it
            # happens to own port 8080.
            if command -v fuser >/dev/null; then
              for pid in $(fuser -n tcp 8080 2>/dev/null || true); do
                cmdline="$(tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true)"
                if printf '%s' "$cmdline" | grep -Eiq 'yaci|yaci-store|store.*jar'; then
                  echo "Sending TERM to confirmed Yaci Store listener pid=$pid"
                  kill -TERM "$pid" 2>/dev/null || true
                else
                  echo "Refusing to terminate unconfirmed listener pid=$pid cmd=$cmdline"
                fi
              done
            fi
            for i in $(seq 1 15); do
              if port_free; then
                store_stopped=1
                break
              fi
              sleep 1
            done
          fi
          if [ "$store_stopped" -ne 1 ]; then
            echo "Yaci Store did not release port 8080 after guarded shutdown."
            tail -300 audit/yaci-evidence/yaci.log > audit/yaci-evidence/yaci-diagnostic-tail.log || true
            exit 1
          fi

          ogmios_started=0
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error --request POST \
              http://localhost:10000/local-cluster/api/admin/ogmios/start-ogmios \
              -o audit/yaci-evidence/ogmios-start.json; then
              ogmios_started=1
              break
            fi
            sleep 2
          done
          if [ "$ogmios_started" -ne 1 ]; then
            echo "Failed to start Ogmios through the Yaci admin API."
            tail -300 audit/yaci-evidence/yaci.log > audit/yaci-evidence/yaci-diagnostic-tail.log || true
            exit 1
          fi

          ogmios_ready=0
          for i in $(seq 1 60); do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/1337' 2>/dev/null; then
              ogmios_ready=1
              break
            fi
            sleep 1
          done
          if [ "$ogmios_ready" -ne 1 ]; then
            echo "Ogmios did not become reachable on port 1337."
            tail -300 audit/yaci-evidence/yaci.log > audit/yaci-evidence/yaci-diagnostic-tail.log || true
            exit 1
          fi

          store_started=0
          for i in $(seq 1 90); do
            if curl --fail --silent --show-error --request POST \
              http://localhost:10000/local-cluster/api/admin/yaci-store/start \
              -o audit/yaci-evidence/yaci-store-restart.json; then
              store_started=1
              break
            fi
            sleep 2
          done
          if [ "$store_started" -ne 1 ]; then
            echo "Failed to start Yaci Store after Ogmios became reachable."
            tail -300 audit/yaci-evidence/yaci.log > audit/yaci-evidence/yaci-diagnostic-tail.log || true
            exit 1
          fi

          store_ready=0
          for i in $(seq 1 90); do
            if curl --fail --silent http://localhost:8080/api/v1/epochs/latest > audit/yaci-evidence/epoch-latest-rebound.json; then
              store_ready=1
              break
            fi
            sleep 2
          done
          if [ "$store_ready" -ne 1 ]; then
            echo "Yaci Store did not become ready after restart."
            tail -300 audit/yaci-evidence/yaci.log > audit/yaci-evidence/yaci-diagnostic-tail.log || true
            exit 1
          fi

          if ! grep -Eq '^store\.submit\.tx-evaluator-mode=ogmios$' "$store_config"; then
            echo "Yaci Store config does not confirm the Ogmios evaluator."
            grep -E '^(store\.submit\.tx-evaluator-mode|store\.cardano\.ogmios-url)=' "$store_config" || true
            tail -300 audit/yaci-evidence/yaci.log > audit/yaci-evidence/yaci-diagnostic-tail.log || true
            exit 1
          fi
          {
            echo "YACI_STORE_EVALUATOR=ogmios"
            grep -E '^(store\.submit\.tx-evaluator-mode|store\.cardano\.ogmios-url)=' "$store_config"
          } | tee audit/yaci-evidence/evaluator-mode.txt

      - name: Derive funded CI test wallet
        id: wallet
        run: |
          address="$(node audit/cardano-integration/create-test-wallet.mjs)"
          echo "address=$address" >> "$GITHUB_OUTPUT"

      - name: Record devnet information
        run: |
          {
            echo "branch=work/immortal-green-closure"
            echo "workflow_sha=$GITHUB_SHA"
            echo "head_sha=${{ github.event.pull_request.head.sha || github.sha }}"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "yaci=0.12.0-beta5"
            echo "run_id=$GITHUB_RUN_ID"
            echo "test_address=${{ steps.wallet.outputs.address }}"
          } | tee audit/yaci-evidence/manifest.txt

      - name: Record non-destructive Yaci cluster context
        run: |
          {
            echo "store_url=http://localhost:8080/api/v1/"
            echo "node_port=3001"
            echo "submit_url=http://localhost:8090"
            echo "epoch_latest=$(curl --fail --silent http://localhost:8080/api/v1/epochs/latest)"
          } | tee audit/yaci-evidence/yaci-devkit-info.txt

      # Aiken Plutus V3 is the active Reveal implementation candidate. The
      # existing V3 carrier is a separate component and remains unchanged. The
      # Haskell Reveal trace is no longer the blocking integration path.
      - name: Install pinned Aiken for isolated Reveal candidate
        id: aiken-setup
        uses: aiken-lang/setup-aiken@v1
        continue-on-error: true
        with:
          version: v1.1.22

      - name: Build isolated Aiken Reveal V3 candidate
        id: aiken-reveal-build
        if: always() && steps.aiken-setup.outcome == 'success'
        continue-on-error: true
        working-directory: poc/aiken-reveal-parity
        shell: bash
        run: |
          set -euo pipefail
          aiken --version
          # Run unit/property tests (including the new Claim context guards)
          # before exporting the compiled validator blueprint.
          aiken check
          aiken build
          test -s plutus.json

      - name: Publish Aiken V3 Reveal reference script on local Yaci
        id: aiken_ref_publish
        if: always() && steps.aiken-reveal-build.outcome == 'success'
        continue-on-error: true
        run: node --import tsx/esm audit/cardano-integration/aiken-reference-script-publication-probe.ts

      - name: Execute isolated Aiken Reveal positive and negative ledger twins
        id: aiken_reveal_ledger
        if: always() && steps.aiken_ref_publish.outcome == 'success' && steps.aiken-reveal-build.outcome == 'success'
        continue-on-error: true
        run: node --import tsx/esm audit/cardano-integration/aiken-reveal-ledger-probe.ts

      - name: Execute real Cardano ledger smoke transaction
        run: node audit/cardano-integration/ledger-smoke.mjs

      - name: Probe current Yaci cost models with Lucid Evolution
        run: node --import tsx/esm audit/cardano-integration/evolution-cost-model-probe.ts

      - name: Execute V3 carrier against native Cardano ledger
        id: jev_v3_carrier
        run: node --import tsx/esm audit/cardano-integration/v3-carrier-ledger-probe.mts

      # Preflight the Aiken V3 implementation on native Yaci. This remains
      # non-blocking because the active economic trace below repeats the path
      # with its own fixture and is the authoritative Reveal integration result.
      - name: Preflight Aiken V3 Reveal on native Cardano ledger
        id: aiken_reveal_spend
        if: always() && steps.aiken_ref_publish.outcome == 'success'
        continue-on-error: true
        env:
          IMMORTAL_REVEAL_AIKEN_V3: "1"
        run: node --import tsx/esm audit/cardano-integration/reveal-ledger-trace.ts

      - name: Execute active Aiken V3 economic Reveal transition trace
        id: jev_reveal
        env:
          IMMORTAL_REVEAL_AIKEN_V3: "1"
        run: node --import tsx/esm audit/cardano-integration/reveal-ledger-trace.ts

      - name: Execute real FundTreasury canonical Oracle valuation trace
        run: node --import tsx/esm audit/cardano-integration/fund-treasury-oracle-valuation-trace.ts

      - name: Execute real TicketIssued 500x solvency boundary trace
        run: node --import tsx/esm audit/cardano-integration/ticket-issued-solvency-boundary-trace.ts

      - name: Execute Aiken V3 economic Expire transition trace
        env:
          IMMORTAL_EXPIRE_AIKEN_V3: "1"
        run: node --import tsx/esm audit/cardano-integration/expire-ledger-trace.ts

      # Hybrid Claim conformance fixture: Aiken V3 Prize validator + Haskell V2
      # B1PrizePool validator. This is not yet an all-Aiken Claim path or a
      # production Issue-admission witness. Do not allow a failed/non-run Aiken
      # build to fall through to a stale plutus.json.
      - name: Execute Aiken Prize + Haskell B1PrizePool Claim trace
        id: claim_trace
        if: steps.aiken-reveal-build.outcome == 'success'
        env:
          CLAIM_REFERENCE_DIAGNOSTIC: ${{ github.event.inputs.claim_reference_diagnostic == 'true' && '1' || '0' }}
          IMMORTAL_CLAIM_AIKEN_V3: "1"
        run: node --import tsx/esm audit/cardano-integration/claim-ledger-trace.ts

      # The build is continue-on-error for unrelated lab diagnostics, but Claim
      # specifically depends on the freshly built candidate. Fail this run if
      # that prerequisite was not successful; never treat a skipped Claim as PASS.
      - name: Enforce successful Aiken build for Claim candidate
        if: always() && steps.aiken-reveal-build.outcome != 'success'
        run: |
          echo "Claim candidate was not run: pinned Aiken check/build did not succeed."
          exit 1

      # Legacy Haskell V2 Claim comparison is opt-in and non-blocking.
      # The active Claim trace above selects the freshly built Aiken V3 Prize
      # validator; Haskell V2 must not be a prerequisite for the Aiken path.
      - name: Execute optional legacy Haskell V2 Claim comparison
        id: haskell_claim_v2_candidate
        if: always() && steps.aiken-reveal-build.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.run_legacy_haskell_claim_diagnostic == true
        continue-on-error: true
        env:
          CLAIM_REFERENCE_DIAGNOSTIC: ${{ github.event.inputs.claim_reference_diagnostic == 'true' && '1' || '0' }}
          IMMORTAL_CLAIM_AIKEN_V3: "0"
        run: node --import tsx/esm audit/cardano-integration/claim-ledger-trace.ts


      # If the normal Claim build fails, rerun the same fixture construction-only
      # to emit CBOR diagnostics. Never signs/submits; unrelated failures must
      # not trigger this fallback.
      - name: Diagnose Claim CBOR after normal build failure
        if: failure() && steps.claim_trace.outcome == 'failure' && (github.event_name != 'workflow_dispatch' || inputs.claim_reference_diagnostic != true)
        env:
          CLAIM_REFERENCE_DIAGNOSTIC: "1"
          IMMORTAL_CLAIM_AIKEN_V3: "1"
        run: node --import tsx/esm audit/cardano-integration/claim-ledger-trace.ts

      - name: Materialize raw Yaci ledger context for P2.8
        id: p28_context
        run: node audit/cardano-integration/materialize-p28-ledger-context.mjs audit/yaci-evidence

      - name: Run native Yaci UTxO decoder conformance
        id: yaci_utxo_decoder
        working-directory: audit/cardano-ledger-runner
        run: |
          cabal update
          cabal run yaci-utxo-test

      - name: Run P2.8 ledger evidence gate against this lab packet
        id: p28_evidence_gate
        working-directory: audit/cardano-ledger-runner
        run: |
          cabal run cardano-ledger-runner -- --evidence-dir ../yaci-evidence --evaluate

      - name: Measure script and transaction resource footprint
        id: resource_footprint
        run: node audit/cardano-integration/resource-audit.mjs | tee audit/yaci-evidence/resource-audit.json

      - name: Run existing pure invariant suite
        id: pure_invariants
        run: npx tsx src/__tests__/b1-invariants.test.ts

      - name: Run economic admission provenance negative twins
        id: admission_provenance
        run: npx tsx src/__tests__/economic-admission-input-binding.test.ts

      - name: Run PrizeValidator row-tier immutability guard
        id: row_tier_immutability
        run: npx tsx src/__tests__/prize-validator-row-tier-immutability.test.ts

      - name: Run Claim settlement-address binding guard
        id: claim_settlement_binding
        run: npx vitest run src/__tests__/claim-settlement-address.test.ts

      - name: Run predeploy structural gate
        id: predeploy_structure
        run: npm run test:predeploy

      - name: Print resource audit summary
        if: always()
        run: cat audit/yaci-evidence/resource-audit.json 2>/dev/null || true

      - name: Preserve devnet evidence and logs
        if: always()
        run: |
          curl --fail --silent http://localhost:8080/api/v1/epochs/latest > audit/yaci-evidence/epoch-latest-final.json || true
          tail -500 audit/yaci-evidence/yaci.log > audit/yaci-evidence/yaci-final-tail.log || true

      - name: Test evidence packet redaction and provenance
        id: evidence_packet_tests
        if: always()
        run: node scripts/test-evidence-packet.mjs

      - name: Test Notion evidence ledger publisher
        id: notion_evidence_tests
        if: always()
        run: node scripts/test-notion-evidence-ledger.mjs

      - name: Generate JEV Verification Registry from actual step outcomes
        if: always()
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          V3_CARRIER_OUTCOME: ${{ steps.jev_v3_carrier.outcome || 'unknown' }}
          REVEAL_OUTCOME: ${{ steps.jev_reveal.outcome || 'unknown' }}
          AIKEN_SETUP_OUTCOME: ${{ steps.aiken-setup.outcome || 'unknown' }}
          AIKEN_BUILD_OUTCOME: ${{ steps.aiken-reveal-build.outcome || 'unknown' }}
          AIKEN_PUBLICATION_OUTCOME: ${{ steps.aiken_ref_publish.outcome || 'unknown' }}
          AIKEN_REVEAL_SPEND_OUTCOME: ${{ steps.aiken_reveal_spend.outcome || 'unknown' }}
          AIKEN_LEDGER_POSITIVE_OUTCOME: ${{ steps.aiken_reveal_ledger.outputs.positive_outcome || 'unknown' }}
          AIKEN_LEDGER_NEGATIVE_OUTCOME: ${{ steps.aiken_reveal_ledger.outputs.negative_outcome || 'unknown' }}
          CLAIM_TRACE_OUTCOME: ${{ steps.claim_trace.outcome || 'unknown' }}
          P28_CONTEXT_OUTCOME: ${{ steps.p28_context.outcome || 'unknown' }}
          YACI_UTXO_DECODER_OUTCOME: ${{ steps.yaci_utxo_decoder.outcome || 'unknown' }}
          P28_EVIDENCE_GATE_OUTCOME: ${{ steps.p28_evidence_gate.outcome || 'unknown' }}
          RESOURCE_FOOTPRINT_OUTCOME: ${{ steps.resource_footprint.outcome || 'unknown' }}
          PURE_INVARIANTS_OUTCOME: ${{ steps.pure_invariants.outcome || 'unknown' }}
          ADMISSION_PROVENANCE_OUTCOME: ${{ steps.admission_provenance.outcome || 'unknown' }}
          ROW_TIER_IMMUTABILITY_OUTCOME: ${{ steps.row_tier_immutability.outcome || 'unknown' }}
          CLAIM_SETTLEMENT_BINDING_OUTCOME: ${{ steps.claim_settlement_binding.outcome || 'unknown' }}
          PREDEPLOY_STRUCTURE_OUTCOME: ${{ steps.predeploy_structure.outcome || 'unknown' }}
          EVIDENCE_PACKET_TESTS_OUTCOME: ${{ steps.evidence_packet_tests.outcome || 'unknown' }}
          NOTION_EVIDENCE_TESTS_OUTCOME: ${{ steps.notion_evidence_tests.outcome || 'unknown' }}
          AIKEN_LEDGER_WINNING_OUTCOME: ${{ steps.aiken_reveal_ledger.outputs.winning_outcome || 'unknown' }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { classifyLedgerEvaluation } from './scripts/jev-verification-registry-generator.mjs';
          const outcome = (v) => ['success','failure','cancelled','skipped'].includes(v) ? v : 'unknown';
          const metadata = {
            repository: process.env.GITHUB_REPOSITORY,
            commitSha: process.env.GITHUB_SHA,
            ref: process.env.GITHUB_REF,
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunUrl: process.env.RUN_URL,
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            executionContext: 'devnet',
          };
          const evidenceRefs = [{ kind: 'workflow-run', uri: process.env.RUN_URL }];
          let p28SemanticOutcome = 'unknown';
          try {
            const report = JSON.parse(await fs.readFile('audit/yaci-evidence/ledger-evaluation-report.json', 'utf8'));
            p28SemanticOutcome = classifyLedgerEvaluation(report);
          } catch {
            // Missing/unreadable report is not evidence of successful evaluation.
          }
          if (p28SemanticOutcome === 'unknown' && ['skipped', 'cancelled'].includes(outcome(process.env.P28_EVIDENCE_GATE_OUTCOME))) {
            p28SemanticOutcome = outcome(process.env.P28_EVIDENCE_GATE_OUTCOME);
          }
          const checks = [
