name: IMMORTAL Cardano Integration Lab

concurrency:
  group: -github-workflows-immortal-cardano-lab-yml-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/immortal-green-closure
    paths:
      - "audit/cardano-integration/**"
      - "src/**"
      - "plutus/**"
      - "Adapter/**"
      - "PRE-RICH/onchain/**"
      - ".github/actions/setup-plutus/**"
      - ".github/workflows/immortal-cardano-lab.yml"
  pull_request:
    branches:
      - main
    paths:
      - "audit/**"
      - "src/**"
      - "plutus/**"
      - "Adapter/**"
      - "PRE-RICH/onchain/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  devnet-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact workflow head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Install isolated lab dependencies
        run: npm install --prefix audit/cardano-integration

      - name: Restore Cabal/Plutus build state
        id: plutus-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            dist-newstyle
          key: plutus-build-${{ runner.os }}-${{ hashFiles('**/*.cabal', 'cabal.project*', '**/*.hs', '**/*.lhs') }}
          restore-keys: |
            plutus-build-${{ runner.os }}-

      - name: Setup canonical Plutus CI
        uses: ./.github/actions/setup-plutus
        with:
          update-hackage: ${{ steps.plutus-cache.outputs.cache-matched-key == '' }}

      # Generate validators from the exact source snapshot tested below.
      - name: Generate fresh Plutus validator artifacts
        run: cabal run exe:export-scripts

      - name: Compile Claim validator source conformance
        working-directory: plutus
        run: |
          set -euo pipefail
          cabal test v3-golden-vector-tests --enable-tests --test-show-details=direct
          cabal test economic-admission-tests --enable-tests --test-show-details=direct

      - name: Save Cabal/Plutus build state
        if: always() && steps.plutus-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            dist-newstyle
          key: plutus-build-${{ runner.os }}-${{ hashFiles('**/*.cabal', 'cabal.project*', '**/*.hs', '**/*.lhs') }}

      - name: Record generated artifact hashes
        run: |
          mkdir -p audit/yaci-evidence
          {
            echo "artifact_commit=$GITHUB_SHA"
            for f in plutus/out/*.plutus.json; do
              sha256sum "$f"
            done
          } | tee audit/yaci-evidence/artifact-hashes.txt

      - name: Bind generated artifacts to trace consumers
        run: |
          cp plutus/out/treasury.plutus.json src/plutusScripts/treasury.plutus.json
          cp plutus/out/counterValidator.plutus.json src/plutusScripts/counterValidator.plutus.json
          cp plutus/out/b1PrizePoolFactory.plutus.json src/plutusScripts/b1PrizePoolFactory.plutus.json
          cp plutus/out/mintPolicyFactory.plutus.json src/plutusScripts/mintPolicyFactory.plutus.json
          cp plutus/out/prizeValidatorFactory.plutus.json src/plutusScripts/prizeValidatorFactory.plutus.json
          cp plutus/out/beaconRegistry.plutus.json src/plutusScripts/beaconRegistry.plutus.json

      - name: Setup legacy Lucid runtime
        uses: ./.github/actions/setup-legacy-lucid

      - name: Install pinned Yaci DevKit
        run: npm install -g @bloxbean/yaci-devkit@0.12.0-beta5

      - name: Start isolated Cardano devnet with Yaci Store
        run: |
          mkdir -p audit/yaci-evidence
          # DevKit beta5 starts Store with Scalus; the next step restarts it
          # after starting Ogmios so the selected evaluator is unambiguous.
          nohup yaci-devkit up --enable-yaci-store > audit/yaci-evidence/yaci.log 2>&1 &
          echo $! > audit/yaci-evidence/yaci.pid

      - name: Wait for initial Yaci Store
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if curl --fail --silent http://localhost:8080/api/v1/epochs/latest > audit/yaci-evidence/epoch-latest.json; then
              echo "YACI_STORE_INITIAL_READY=1" | tee audit/yaci-evidence/bootstrap.txt
              exit 0
            fi
            sleep 2
          done
          echo "YACI_STORE_INITIAL_READY=0" | tee audit/yaci-evidence/bootstrap.txt
          tail -300 audit/yaci-evidence/yaci.log > audit/yaci-evidence/yaci-diagnostic-tail.log || true
          exit 1

      - name: Start and qualify Ogmios evaluator before Yaci Store
        run: |
          set -euo pipefail
          mkdir -p audit/yaci-evidence
          store_config="$HOME/.yaci-cli/components/store/config/application.properties"
          if [ ! -f "$store_config" ]; then
            echo "Generated Yaci Store configuration not found: $store_config"
            find "$HOME/.yaci-cli" -path '*/store/config/application.properties' -print || true
            exit 1
          fi

          # Rebind the evaluator in a controlled order: stop Store, start Ogmios,
          # then restart Store so it selects Ogmios during process startup.
          curl --fail --silent --show-error --request POST \
            http://localhost:10000/local-cluster/api/admin/yaci-store/stop \
            -o audit/yaci-evidence/yaci-store-stop.json
          port_free() { ! timeout 1 bash -c '</dev/tcp/127.0.0.1/8080' 2>/dev/null; }
          store_stopped=0
          for i in $(seq 1 60); do
            if port_free; then
              store_stopped=1
              break
            fi
            sleep 1
          done
          if [ "$store_stopped" -ne 1 ]; then
            echo "Yaci Store still owns port 8080 after admin stop; collecting owner evidence."
            {
              echo "== admin stop response"
              cat audit/yaci-evidence/yaci-store-stop.json || true
              echo
              echo "== listener on 8080"
              (command -v fuser >/dev/null && fuser -v -n tcp 8080) 2>&1 || true
              echo "== socket table"
              (command -v ss >/dev/null && ss -ltnp '( sport = :8080 )') 2>&1 || true
            } | tee audit/yaci-evidence/yaci-store-stop-diagnostics.txt

            # Only terminate a listener when its command line identifies it as
            # Yaci/Store. Never kill an unrelated process merely because it
            # happens to own port 8080.
            if command -v fuser >/dev/null; then
              for pid in $(fuser -n tcp 8080 2>/dev/null || true); do
                cmdline="$(tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true)"
                if printf '%s' "$cmdline" | grep -Eiq 'yaci|yaci-store|store.*jar'; then
                  echo "Sending TERM to confirmed Yaci Store listener pid=$pid"
                  kill -TERM "$pid" 2>/dev/null || true
                else
                  echo "Refusing to terminate unconfirmed listener pid=$pid cmd=$cmdline"
                fi
              done
            fi
            for i in $(seq 1 15); do
              if port_free; then
                store_stopped=1
                break
              fi
              sleep 1
            done
          fi
          if [ "$store_stopped" -ne 1 ]; then
            echo "Yaci Store did not release port 8080 after guarded shutdown."
            tail -300 audit/yaci-evidence/yaci.log > audit/yaci-evidence/yaci-diagnostic-tail.log || true
            exit 1
          fi

          ogmios_started=0
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error --request POST \
              http://localhost:10000/local-cluster/api/admin/ogmios/start-ogmios \
              -o audit/yaci-evidence/ogmios-start.json; then
              ogmios_started=1
              break
            fi
            sleep 2
          done
          if [ "$ogmios_started" -ne 1 ]; then
            echo "Failed to start Ogmios through the Yaci admin API."
            tail -300 audit/yaci-evidence/yaci.log > audit/yaci-evidence/yaci-diagnostic-tail.log || true
            exit 1
          fi

          ogmios_ready=0
          for i in $(seq 1 60); do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/1337' 2>/dev/null; then
              ogmios_ready=1
              break
            fi
            sleep 1
          done
          if [ "$ogmios_ready" -ne 1 ]; then
            echo "Ogmios did not become reachable on port 1337."
            tail -300 audit/yaci-evidence/yaci.log > audit/yaci-evidence/yaci-diagnostic-tail.log || true
            exit 1
          fi

          store_started=0
          for i in $(seq 1 90); do
            if curl --fail --silent --show-error --request POST \
              http://localhost:10000/local-cluster/api/admin/yaci-store/start \
              -o audit/yaci-evidence/yaci-store-restart.json; then
              store_started=1
              break
            fi
            sleep 2
          done
          if [ "$store_started" -ne 1 ]; then
            echo "Failed to start Yaci Store after Ogmios became reachable."
            tail -300 audit/yaci-evidence/yaci.log > audit/yaci-evidence/yaci-diagnostic-tail.log || true
            exit 1
          fi

          store_ready=0
          for i in $(seq 1 90); do
            if curl --fail --silent http://localhost:8080/api/v1/epochs/latest > audit/yaci-evidence/epoch-latest-rebound.json; then
              store_ready=1
              break
            fi
            sleep 2
          done
          if [ "$store_ready" -ne 1 ]; then
            echo "Yaci Store did not become ready after restart."
            tail -300 audit/yaci-evidence/yaci.log > audit/yaci-evidence/yaci-diagnostic-tail.log || true
            exit 1
          fi

          if ! grep -Eq '^store\.submit\.tx-evaluator-mode=ogmios$' "$store_config"; then
            echo "Yaci Store config does not confirm the Ogmios evaluator."
            grep -E '^(store\.submit\.tx-evaluator-mode|store\.cardano\.ogmios-url)=' "$store_config" || true
            tail -300 audit/yaci-evidence/yaci.log > audit/yaci-evidence/yaci-diagnostic-tail.log || true
            exit 1
          fi
          {
            echo "YACI_STORE_EVALUATOR=ogmios"
            grep -E '^(store\.submit\.tx-evaluator-mode|store\.cardano\.ogmios-url)=' "$store_config"
          } | tee audit/yaci-evidence/evaluator-mode.txt

      - name: Derive funded CI test wallet
        id: wallet
        run: |
          address="$(node audit/cardano-integration/create-test-wallet.mjs)"
          echo "address=$address" >> "$GITHUB_OUTPUT"

      - name: Record devnet information
        run: |
          {
            echo "branch=work/immortal-green-closure"
            echo "workflow_sha=$GITHUB_SHA"
            echo "head_sha=${{ github.event.pull_request.head.sha || github.sha }}"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "yaci=0.12.0-beta5"
            echo "run_id=$GITHUB_RUN_ID"
            echo "test_address=${{ steps.wallet.outputs.address }}"
          } | tee audit/yaci-evidence/manifest.txt

      - name: Record non-destructive Yaci cluster context
        run: |
          {
            echo "store_url=http://localhost:8080/api/v1/"
            echo "node_port=3001"
            echo "submit_url=http://localhost:8090"
            echo "epoch_latest=$(curl --fail --silent http://localhost:8080/api/v1/epochs/latest)"
          } | tee audit/yaci-evidence/yaci-devkit-info.txt

      - name: Execute real Cardano ledger smoke transaction
        run: node audit/cardano-integration/ledger-smoke.mjs

      - name: Probe current Yaci cost models with Lucid Evolution
        run: node --import tsx/esm audit/cardano-integration/evolution-cost-model-probe.ts

      - name: Execute V3 carrier against native Cardano ledger
        run: node --import tsx/esm audit/cardano-integration/v3-carrier-ledger-probe.mts

      - name: Execute real economic Reveal transition trace
        run: node --import tsx/esm audit/cardano-integration/reveal-ledger-trace.ts

      - name: Execute real FundTreasury canonical Oracle valuation trace
        run: node --import tsx/esm audit/cardano-integration/fund-treasury-oracle-valuation-trace.ts

      - name: Execute real TicketIssued 500x solvency boundary trace
        run: node --import tsx/esm audit/cardano-integration/ticket-issued-solvency-boundary-trace.ts

      - name: Execute real economic Expire transition trace
        run: node --import tsx/esm audit/cardano-integration/expire-ledger-trace.ts

      # Isolated Claim conformance fixture; not a production Issue-admission witness.
      - name: Execute real economic Claim transition trace
        run: node --import tsx/esm audit/cardano-integration/claim-ledger-trace.ts

      - name: Materialize raw Yaci ledger context for P2.8
        run: node audit/cardano-integration/materialize-p28-ledger-context.mjs audit/yaci-evidence

      - name: Run native Yaci UTxO decoder conformance
        working-directory: audit/cardano-ledger-runner
        run: |
          cabal update
          cabal run yaci-utxo-test

      - name: Run P2.8 ledger evidence gate against this lab packet
        working-directory: audit/cardano-ledger-runner
        run: |
          cabal run cardano-ledger-runner -- --evidence-dir ../yaci-evidence --evaluate

      - name: Measure script and transaction resource footprint
        run: node audit/cardano-integration/resource-audit.mjs | tee audit/yaci-evidence/resource-audit.json

      - name: Run existing pure invariant suite
        run: npx tsx src/__tests__/b1-invariants.test.ts

      - name: Run economic admission provenance negative twins
        run: npx tsx src/__tests__/economic-admission-input-binding.test.ts

      - name: Run PrizeValidator row-tier immutability guard
        run: npx tsx src/__tests__/prize-validator-row-tier-immutability.test.ts

      - name: Run Claim settlement-address binding guard
        run: npx vitest run src/__tests__/claim-settlement-address.test.ts

      - name: Run predeploy structural gate
        run: npm run test:predeploy

      - name: Print resource audit summary
        if: always()
        run: cat audit/yaci-evidence/resource-audit.json 2>/dev/null || true

      - name: Preserve devnet evidence and logs
        if: always()
        run: |
          curl --fail --silent http://localhost:8080/api/v1/epochs/latest > audit/yaci-evidence/epoch-latest-final.json || true
          tail -500 audit/yaci-evidence/yaci.log > audit/yaci-evidence/yaci-final-tail.log || true

      - name: Build sanitized provenance-bound evidence packet
        if: always()
        run: |
          set -euo pipefail
          rm -rf audit/evidence-packet
          node scripts/build-evidence-packet.mjs audit/yaci-evidence audit/evidence-packet

      - name: Upload laboratory evidence packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortal-cardano-lab-evidence
          path: audit/evidence-packet/
          if-no-files-found: warn
