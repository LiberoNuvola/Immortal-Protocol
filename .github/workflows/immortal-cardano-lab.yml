          node scripts/jev-verification-registry-generator.mjs audit/yaci-evidence/jev-registry-input.json audit/yaci-evidence/verification-registry.json

      - name: Generate JEV operational prompt from validated registry
        id: jev-prompt
        if: always() && hashFiles('audit/yaci-evidence/verification-registry.json') != ''
        run: node scripts/build-jev-operational-prompt.mjs audit/yaci-evidence/verification-registry.json audit/yaci-evidence/operational-prompt.md

      - name: Test JEV operational prompt generator
        if: always()
        run: node scripts/test-jev-operational-prompt.mjs

      - name: Build sanitized provenance-bound evidence packet
        if: always()
        run: |
          set -euo pipefail
          rm -rf audit/evidence-packet
          node scripts/build-evidence-packet.mjs audit/yaci-evidence audit/evidence-packet

