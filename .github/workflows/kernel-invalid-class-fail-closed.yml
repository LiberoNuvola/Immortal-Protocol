name: Kernel Invalid-Class Fail-Closed Audit

concurrency:
  group: -github-workflows-kernel-invalid-class-fail-closed-yml-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - audit/kernel-invalid-class-fail-closed
      - work/immortal-green-closure
  pull_request:
    branches:
      - b1-hardening

jobs:
  kernel-fail-closed:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.12.1.0'

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev pkg-config build-essential git
          rm -rf /tmp/blst
          git clone --depth 1 --branch v0.3.14 https://github.com/supranational/blst.git /tmp/blst
          chmod +x /tmp/blst/build.sh
          /tmp/blst/build.sh
          BLST_LIB="$(find /tmp/blst -name libblst.a -type f -print -quit)"
          test -n "$BLST_LIB"
          sudo install -m 0644 "$BLST_LIB" /usr/local/lib/libblst.a
          sudo install -m 0644 /tmp/blst/bindings/blst_aux.h /usr/local/include/blst_aux.h
          sudo install -m 0644 /tmp/blst/bindings/blst.h /usr/local/include/blst.h
          sudo install -m 0644 /tmp/blst/bindings/blst.hpp /usr/local/include/blst.hpp
          sudo mkdir -p /usr/local/lib/pkgconfig
          printf '%s\n' \
            'prefix=/usr/local' \
            'exec_prefix=\${prefix}' \
            'libdir=\${exec_prefix}/lib' \
            'includedir=\${prefix}/include' \
            'Name: libblst' \
            'Description: Multilingual BLS12-381 signature library' \
            'Version: 0.3.14' \
            'Cflags: -I\${includedir}' \
            'Libs: -L\${libdir} -lblst' \
            | sudo tee /usr/local/lib/pkgconfig/libblst.pc >/dev/null
          sudo ldconfig
          pkg-config --modversion libblst

      - name: Run kernel regression suite
        working-directory: plutus
        run: |
          cabal test v3-golden-vector-tests economic-admission-tests protected-capital-conformance-tests governance-tests governance-canonical-replay-tests legacy-adapter-tests --enable-tests --test-show-details=direct --with-compiler=ghc
