name: IMMORTAL Haskell Semantic Conformance

on:
  push:
    branches:
      - work/immortal-green-closure
    paths:
      - "plutus/**"
      - "IMMORTAL/**"
      - "PRE-RICH/profile/**"
      - "Adapter/CARDANO/observation/**"
      - "cabal.project"
      - ".github/workflows/immortal-haskell-conformance.yml"
  pull_request:
    branches:
      - b1-hardening
    paths:
      - "plutus/**"
      - "IMMORTAL/**"
      - "PRE-RICH/profile/**"
      - "Adapter/CARDANO/observation/**"
      - "cabal.project"
      - ".github/workflows/immortal-haskell-conformance.yml"

jobs:
  haskell-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.12.1.0'

      - name: Install native Plutus dependencies
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libsecp256k1-dev pkg-config build-essential

      - name: Install and register pinned blst
        run: |
          set -euo pipefail
          rm -rf /tmp/blst
          git clone --depth 1 --branch v0.3.14 https://github.com/supranational/blst.git /tmp/blst
          chmod +x /tmp/blst/build.sh
          set +e
          (cd /tmp/blst && ./build.sh)
          rc=$?
          set -e
          test -s /tmp/blst/libblst.a
          if [ "$rc" -ne 0 ]; then echo "blst build.sh returned $rc after producing libblst.a; continuing with verified archive."; fi
          sudo install -m 0644 /tmp/blst/libblst.a /usr/local/lib/libblst.a
          sudo install -m 0644 /tmp/blst/bindings/blst_aux.h /usr/local/include/blst_aux.h
          sudo install -m 0644 /tmp/blst/bindings/blst.h /usr/local/include/blst.h
          sudo install -m 0644 /tmp/blst/bindings/blst.hpp /usr/local/include/blst.hpp
          sudo mkdir -p /usr/local/lib/pkgconfig
          cat <<'EOF' | sudo tee /usr/local/lib/pkgconfig/libblst.pc >/dev/null
          prefix=/usr/local
          exec_prefix=${prefix}
          libdir=${exec_prefix}/lib
          includedir=${prefix}/include
          Name: libblst
          Description: Multilingual BLS12-381 signature library
          Version: 0.3.14
          Cflags: -I${includedir}
          Libs: -L${libdir} -lblst
          EOF
          sudo ldconfig
          pkg-config --exists 'libblst >= 0.3.14'
          pkg-config --modversion libblst

      - name: Update Cabal index
        run: cabal update

      - name: Oracle conformance
        working-directory: plutus
        run: cabal test economic-oracle-tests

      - name: Golden vector conformance
        working-directory: plutus
        run: cabal test v3-golden-vector-tests

      - name: Governance conformance
        working-directory: plutus
        run: cabal test governance-tests

      - name: Governance canonical replay conformance
        working-directory: plutus
        run: cabal test governance-canonical-replay-tests

      - name: Economic Admission conformance
        working-directory: plutus
        run: cabal test economic-admission-tests

      - name: Protected Capital conformance
        working-directory: plutus
        run: cabal test protected-capital-conformance-tests

      - name: Governance ruleset conformance
        working-directory: plutus
        run: cabal test governance-ruleset-tests

      - name: Governance phase-6 conformance
        working-directory: plutus
        run: cabal test governance-phase6-tests

      - name: Legacy adapter conformance
        working-directory: plutus
        run: cabal test legacy-adapter-tests

      - name: Projection boundary conformance
        working-directory: plutus
        run: cabal test projection-boundary-tests

      - name: Genesis admission conformance
        working-directory: plutus
        run: cabal test genesis-admission-tests

      - name: Genesis regime carrier conformance
        working-directory: plutus
        run: cabal test genesis-regime-carrier-tests
