name: V3 Carrier Build Qualification (Non-Deploying)

on:
  workflow_dispatch:
  push:
    branches:
      - work/immortal-green-closure
    paths:
      - "PRE-RICH/onchain/V3EconomicStateCarrier.hs"
      - "PRE-RICH/onchain/V3EconomicStateCarrierMintPolicy.hs"
      - "PRE-RICH/src/PreRichPreprodDeploymentProfile.ts"
      - "src/preprodV3InitialDatum.ts"
      - "scripts/printV3InitialDatum.ts"
      - "scripts/qualifyV3CarrierBuild.mjs"
      - "scripts/deployV3Carrier.mts"
      - "plutus/**"
      - "cabal.project"
      - ".github/actions/setup-plutus/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/v3-carrier-build-qualification.yml"

concurrency:
  group: v3-carrier-build-qualification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  v3-carrier-build-qualification:
    name: Fresh Plutus build and provenance packet
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned repository dependencies
        run: npm ci --no-audit --no-fund

      - name: Setup canonical Plutus toolchain
        uses: ./.github/actions/setup-plutus
        with:
          update-hackage: "true"

      - name: Remove any pre-existing V3 artifacts
        run: rm -rf plutus/out

      - name: Build Plutus scripts from this exact checkout
        id: plutus-build
        run: |
          set +e
          cabal --config-file="$CABAL_CONFIG" run exe:export-scripts -j1 > plutus/v3-artifact-build.log 2>&1
          rc=$?
          set -e
          echo "Cabal V3 artifact generation exit code: $rc"
          echo "V3-specific compiler diagnostics:"
          grep -E 'V3EconomicStateCarrier(MintPolicy)?\.hs' plutus/v3-artifact-build.log | tail -200 || true
          if [ "$rc" -ne 0 ]; then
            echo "Last 160 build-log lines:"
            tail -160 plutus/v3-artifact-build.log || true
            exit "$rc"
          fi
          echo "Fresh V3 Plutus build completed."

      - name: Verify compiled artifacts and generate build provenance
        run: |
          set -euo pipefail
          mkdir -p audit/v3-carrier-build
          ./node_modules/.bin/tsx scripts/printV3InitialDatum.ts > audit/v3-carrier-build/v3-initial-datum.cbor.hex
          node scripts/qualifyV3CarrierBuild.mjs

      - name: Upload source-bound V3 build qualification packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-carrier-build-qualification-${{ github.sha }}
          path: |
            plutus/out/v3EconomicStateCarrier.plutus.json
            plutus/out/v3EconomicStateCarrierMintPolicy.plutus.json
            plutus/v3-artifact-build.log
            audit/v3-carrier-build/
          if-no-files-found: warn
          retention-days: 90
