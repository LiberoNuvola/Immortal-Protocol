name: PRE-RICH Hysteresis Conformance

on:
  push:
    branches:
      - work/immortal-green-closure
    paths:
      - "src/preRichHysteresis.ts"
      - "PRE-RICH/tests/conformance/PreRichHysteresisBinding.test.ts"
      - "PRE-RICH/src/PreRichHysteresisBinding.ts"
      - "PRE-RICH/tests/conformance/PreRichHysteresisBinding.test.ts"
      - ".github/workflows/pre-rich-hysteresis-conformance.yml"
  pull_request:
    branches:
      - work/immortal-green-closure
    paths:
      - "src/preRichHysteresis.ts"
      - "PRE-RICH/tests/conformance/PreRichHysteresisBinding.test.ts"
      - "PRE-RICH/src/PreRichHysteresisBinding.ts"
      - "PRE-RICH/tests/conformance/PreRichHysteresisBinding.test.ts"
      - ".github/workflows/pre-rich-hysteresis-conformance.yml"

jobs:
  hysteresis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Run PRE-RICH hysteresis conformance
        run: npx vitest run PRE-RICH/tests/conformance/PreRichHysteresisBinding.test.ts PRE-RICH/tests/conformance/PreRichHysteresisBinding.test.ts
