name: PRE-RICH Expiry Refinement Conformance

concurrency:
  group: -github-workflows-pre-rich-expiry-conformance-yml-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - work/immortal-green-closure
    paths:
      - "PRE-RICH/profile/PreRichExpiryEvidence.ts"
      - "PRE-RICH/profile/PreRichExpiryPolicy.ts"
      - "src/__tests__/preRichExpiryEvidence.test.ts"
      - "src/__tests__/preRichExpiryPolicy.test.ts"
      - ".github/workflows/pre-rich-expiry-conformance.yml"
  pull_request:
    branches:
      - work/immortal-green-closure
    paths:
      - "PRE-RICH/profile/PreRichExpiryEvidence.ts"
      - "PRE-RICH/profile/PreRichExpiryPolicy.ts"
      - "src/__tests__/preRichExpiryEvidence.test.ts"
      - "src/__tests__/preRichExpiryPolicy.test.ts"
      - ".github/workflows/pre-rich-expiry-conformance.yml"

jobs:
  expiry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run PRE-RICH expiry refinement conformance
        run: npx vitest run src/__tests__/preRichExpiryEvidence.test.ts src/__tests__/preRichExpiryPolicy.test.ts