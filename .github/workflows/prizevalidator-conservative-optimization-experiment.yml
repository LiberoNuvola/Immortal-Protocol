name: PrizeValidator Conservative Optimization Size Experiment

on:
  push:
    branches:
      - work/immortal-green-closure
    paths:
      - ".github/workflows/prizevalidator-conservative-optimization-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prizevalidator-conservative-optimization-experiment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile-size-comparison:
    if: ${{ github.ref == 'refs/heads/work/immortal-green-closure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXPERIMENT_EVIDENCE_DIR: ${{ runner.temp }}/prizevalidator-conservative-optimization-experiment
      REGISTRY_SCRIPT_HASH: 7e77d0b44002ea15d7c4a11f5acc176bfccec5bb0eafac66c528dcd8
      ORACLE_STATE_POLICY_ID: 89234e0f20373cde0c7b0644edeb3cfc1dbca4005fd98b731518d235
      ORACLE_STATE_TOKEN_NAME_HEX: 4f5241434c45
      ORACLE_PUBLISHER_PKH: c8c47610a36034aac6fc58848bdae5c278d994ff502c05455e3b3ee8
    steps:
      - name: Checkout exact experiment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install repository runtime dependencies
        run: npm ci --no-audit --no-fund

      - name: Setup canonical Plutus 1.67.0.0 toolchain
        uses: ./.github/actions/setup-plutus
        with:
          update-hackage: "true"

      - name: Record exact source and toolchain provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EXPERIMENT_EVIDENCE_DIR"
          {
            echo "workflow_sha=$GITHUB_SHA"
            echo "branch=$GITHUB_REF"
            echo "run_id=$GITHUB_RUN_ID"
            echo "runner_os=$RUNNER_OS"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "ghc=$(ghc --numeric-version)"
            echo "cabal=$(cabal --numeric-version)"
            echo "plutus_git_pin=$(grep -A2 'location: https://github.com/IntersectMBO/plutus.git' cabal.project | tail -n1 | sed 's/^[[:space:]]*tag:[[:space:]]*//')"
            echo "prize_validator_source_sha256=$(sha256sum plutus/PrizeValidator.hs | awk '{print $1}')"
            echo "experiment_option=default baseline first; candidate adds only -fplugin-opt Plinth.Plugin:conservative-optimisation"
          } | tee "$EXPERIMENT_EVIDENCE_DIR/provenance.txt"
          grep -q '48e9bf08f439e7223de713b5b71696fcd81cffc3' cabal.project

      - name: Compile default baseline and isolated candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$EXPERIMENT_EVIDENCE_DIR"
          probe_file="$GITHUB_WORKSPACE/.prizevalidator-size-measure-probe.mts"
          original_validator="$RUNNER_TEMP/PrizeValidator.hs.original"
          original_factory="$RUNNER_TEMP/prizeValidatorFactory.plutus.json.original"
          cp plutus/PrizeValidator.hs "$original_validator"
          cp src/plutusScripts/prizeValidatorFactory.plutus.json "$original_factory"

          cleanup() {
            rc=$?
            trap - EXIT
            set +e
            cp "$original_validator" plutus/PrizeValidator.hs
            cp "$original_factory" src/plutusScripts/prizeValidatorFactory.plutus.json
            git restore --source=HEAD --worktree -- plutus/PrizeValidator.hs src/plutusScripts/prizeValidatorFactory.plutus.json
            git clean -fd -- plutus/out
            git clean -fdX -- plutus/out
            rm -f "$probe_file"
            if [ -z "$(git ls-files -- plutus/out)" ]; then
              rm -rf plutus/out
            fi
            unexpected="$(git diff --name-only HEAD)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected tracked worktree changes remain after restoration:" >&2
              printf '%s\n' "$unexpected" >&2
              rc=1
            fi
            if ! cmp -s "$original_validator" plutus/PrizeValidator.hs; then
              echo "PrizeValidator.hs was not restored byte-for-byte." >&2
              rc=1
            fi
            if ! cmp -s "$original_factory" src/plutusScripts/prizeValidatorFactory.plutus.json; then
              echo "Tracked PrizeValidator factory was not restored byte-for-byte." >&2
              rc=1
            fi
            {
              echo "tracked_worktree_diff_after_restore=$(git diff --name-only HEAD | tr '\n' ' ')"
              echo "tracked_source_restore=$(cmp -s "$original_validator" plutus/PrizeValidator.hs && echo exact || echo mismatch)"
              echo "tracked_factory_restore=$(cmp -s "$original_factory" src/plutusScripts/prizeValidatorFactory.plutus.json && echo exact || echo mismatch)"
            } > "$EXPERIMENT_EVIDENCE_DIR/worktree-restoration.txt"
            if [ "$rc" -ne 0 ]; then
              echo "Compile-size experiment failed or cleanup detected an unexpected change (exit $rc)." >&2
            fi
            exit "$rc"
          }
          trap cleanup EXIT

          cat > "$probe_file" <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFileSync, writeFileSync, mkdirSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'

          const phase = process.env.EXPERIMENT_PHASE
          if (!['baseline', 'candidate'].includes(phase)) {
            throw new Error('EXPERIMENT_PHASE must be baseline or candidate')
          }
          const workspace = process.env.GITHUB_WORKSPACE
          const evidenceDir = process.env.EXPERIMENT_EVIDENCE_DIR
          const registryHash = process.env.REGISTRY_SCRIPT_HASH
          const oraclePolicy = process.env.ORACLE_STATE_POLICY_ID
          const oracleName = process.env.ORACLE_STATE_TOKEN_NAME_HEX
          const oraclePublisher = process.env.ORACLE_PUBLISHER_PKH
          if ([workspace, evidenceDir, registryHash, oraclePolicy, oracleName, oraclePublisher].some((x) => !x)) {
            throw new Error('Missing experiment path or parameter identity')
          }

          const { buildPrizeValidator } = await import(workspace + '/src/loadValidator.ts')
          const { validatorToScriptHash } = await import('@lucid-evolution/lucid')
          const factoryPath = workspace + '/plutus/out/prizeValidatorFactory.plutus.json'
          const factoryRaw = readFileSync(factoryPath)
          const factoryEnvelope = JSON.parse(factoryRaw.toString('utf8'))
          if (factoryEnvelope.type !== 'PlutusScriptV2' || typeof factoryEnvelope.cborHex !== 'string') {
            throw new Error('Generated factory envelope is not a PlutusScriptV2 cborHex envelope')
          }
          const factoryHex = factoryEnvelope.cborHex
          if (!/^(?:[0-9a-fA-F]{2})+$/.test(factoryHex)) {
            throw new Error('Generated factory cborHex is malformed')
          }

          const table = { tier1: 2, tier2: 5, tier3: 10, tier4: 200, tier5: 1000 }
          const script = buildPrizeValidator(registryHash, table, oraclePolicy, oracleName, oraclePublisher)
          if (script.type !== 'PlutusV2' || typeof script.script !== 'string') {
            throw new Error('buildPrizeValidator did not return a PlutusV2 script')
          }
          const scriptHex = script.script.replace(/^0x/, '')
          if (!/^(?:[0-9a-fA-F]{2})+$/.test(scriptHex)) {
            throw new Error('Parameterized PrizeValidator CBOR is malformed')
          }

          function digest(bytes) {
            return createHash('sha256').update(bytes).digest('hex')
          }
          function byteStringEnvelope(hex) {
            const bytes = Buffer.from(hex, 'hex')
            if (bytes.length < 1) throw new Error('Empty CBOR byte string')
            const first = bytes[0]
            const majorType = first >> 5
            const additionalInfo = first & 31
            let headerBytes
            let declaredPayloadBytes
            if (additionalInfo < 24) {
              headerBytes = 1
              declaredPayloadBytes = additionalInfo
            } else if (additionalInfo === 24) {
              headerBytes = 2
              declaredPayloadBytes = bytes.readUInt8(1)
            } else if (additionalInfo === 25) {
              headerBytes = 3
              declaredPayloadBytes = bytes.readUInt16BE(1)
            } else if (additionalInfo === 26) {
              headerBytes = 5
              declaredPayloadBytes = bytes.readUInt32BE(1)
            } else if (additionalInfo === 27) {
              headerBytes = 9
              const declared = bytes.readBigUInt64BE(1)
              if (declared > BigInt(Number.MAX_SAFE_INTEGER)) {
                throw new Error('CBOR payload length exceeds safe integer range')
              }
              declaredPayloadBytes = Number(declared)
            } else {
              throw new Error('Unsupported CBOR byte-string additional-info value')
            }
            if (majorType !== 2) throw new Error('Expected an outer CBOR byte string (major type 2)')
            if (bytes.length < headerBytes) throw new Error('Truncated CBOR byte-string header')
            const availablePayloadBytes = bytes.length - headerBytes
            const payload = bytes.subarray(headerBytes, headerBytes + declaredPayloadBytes)
            return {
              majorType,
              additionalInfo,
              headerBytes,
              declaredPayloadBytes,
              availablePayloadBytes,
              trailingBytes: availablePayloadBytes - declaredPayloadBytes,
              payloadSha256: digest(payload),
            }
          }

          const factoryBytes = Buffer.from(factoryHex, 'hex')
          const parameterizedBytes = Buffer.from(scriptHex, 'hex')
          const scriptHash = validatorToScriptHash(script)
          if (!/^[0-9a-f]{56}$/.test(scriptHash)) {
            throw new Error('Unexpected PlutusV2 script hash: ' + scriptHash)
          }

          const result = {
            schema: 'IMMORTAL-PRIZEVALIDATOR-CONSERVATIVE-OPTIMIZATION-SIZE-EXPERIMENT-v0.1',
            phase,
            classification: phase === 'baseline' ? 'CANONICAL_DEFAULT_BASELINE' : 'ISOLATED_CONSERVATIVE_OPTIMISATION_CANDIDATE',
            sourceCommit: execFileSync('git', ['rev-parse', 'HEAD'], { cwd: workspace, encoding: 'utf8' }).trim(),
            sourceFileSha256: digest(readFileSync(workspace + '/plutus/PrizeValidator.hs')),
            compilerOptionProfile: phase === 'baseline'
              ? 'canonical-default (target-version=1.0.0)'
              : 'canonical-default plus -fplugin-opt Plinth.Plugin:conservative-optimisation (only additional compiler option)',
            toolchain: {
              node: process.version,
              ghc: execFileSync('ghc', ['--numeric-version'], { encoding: 'utf8' }).trim(),
              cabal: execFileSync('cabal', ['--numeric-version'], { encoding: 'utf8' }).trim(),
            },
            pinnedPlutusCommit: '48e9bf08f439e7223de713b5b71696fcd81cffc3',
            parameters: {
              registryScriptHash: registryHash,
              prizeTable: table,
              oracleSingletonPolicyId: oraclePolicy,
              oracleSingletonTokenNameHex: oracleName,
              oraclePublisherPkh: oraclePublisher,
            },
            factory: {
              type: factoryEnvelope.type,
              description: factoryEnvelope.description ?? null,
              jsonSha256: digest(factoryRaw),
              cborBytes: factoryBytes.length,
              cborSha256: digest(factoryBytes),
              outerCborByteString: byteStringEnvelope(factoryHex),
              rawCborHex: factoryHex,
            },
            parameterizedPrizeValidator: {
              type: script.type,
              cborBytes: parameterizedBytes.length,
              cborSha256: digest(parameterizedBytes),
              scriptHash,
              outerCborByteString: byteStringEnvelope(scriptHex),
              rawCborHex: scriptHex,
            },
          }
          mkdirSync(evidenceDir, { recursive: true })
          writeFileSync(evidenceDir + '/' + phase + '.json', JSON.stringify(result, null, 2) + '\n')
          console.log(JSON.stringify({
            phase,
            factoryBytes: result.factory.cborBytes,
            factorySha256: result.factory.cborSha256,
            parameterizedScriptBytes: result.parameterizedPrizeValidator.cborBytes,
            parameterizedScriptSha256: result.parameterizedPrizeValidator.cborSha256,
            scriptHash: result.parameterizedPrizeValidator.scriptHash,
            evidenceFile: evidenceDir + '/' + phase + '.json',
          }, null, 2))
          NODE

          echo "=== Canonical default baseline compile ==="
          cabal run exe:export-scripts
          cp plutus/out/prizeValidatorFactory.plutus.json src/plutusScripts/prizeValidatorFactory.plutus.json
          EXPERIMENT_PHASE=baseline node --import=tsx/esm "$probe_file" 2>&1 | tee "$EXPERIMENT_EVIDENCE_DIR/baseline-measurement.log"

          node --input-type=module - "$EXPERIMENT_EVIDENCE_DIR/baseline.json" <<'NODE'
          import { readFileSync } from 'node:fs'
          const result = JSON.parse(readFileSync(process.argv[2], 'utf8'))
          const expected = {
            factoryBytes: 16309,
            factorySha256: '3c879feab921f4e39964baded675395c12bc20030c7843f2004017738aa37bf2',
            parameterizedBytes: 16443,
            parameterizedSha256: '9fec0f8342f0d1e55196dc57677222f45925087b46d0b15ca7c9aee8a5cf7036',
            scriptHash: '508588a6ac5925b316b87f85adcc746808b4b29d2e13952184e7175b',
          }
          const actual = {
            factoryBytes: result.factory.cborBytes,
            factorySha256: result.factory.cborSha256,
            parameterizedBytes: result.parameterizedPrizeValidator.cborBytes,
            parameterizedSha256: result.parameterizedPrizeValidator.cborSha256,
            scriptHash: result.parameterizedPrizeValidator.scriptHash,
          }
          console.log(JSON.stringify({ expected, actual }, null, 2))
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error('Canonical default baseline does not reproduce Issue #46 exactly; stopping before candidate compile')
          }
          NODE

          echo "=== Apply one temporary compiler-option difference ==="
          python3 - <<'PY'
          from pathlib import Path
          path = Path("plutus/PrizeValidator.hs")
          source = path.read_text()
          needle = "{-# OPTIONS_GHC -fplugin-opt Plinth.Plugin:target-version=1.0.0 #-}"
          replacement = "{-# OPTIONS_GHC -fplugin-opt Plinth.Plugin:target-version=1.0.0 -fplugin-opt Plinth.Plugin:conservative-optimisation #-}"
          if source.count(needle) != 1:
              raise SystemExit("Expected exactly one existing PrizeValidator OPTIONS_GHC target-version pragma")
          path.write_text(source.replace(needle, replacement))
          PY
          printf 'candidate_source_sha256=%s\n' "$(sha256sum plutus/PrizeValidator.hs | awk '{print $1}')" | tee "$EXPERIMENT_EVIDENCE_DIR/candidate-source.txt"

          echo "=== Candidate compile with conservative-optimisation only ==="
          cabal run exe:export-scripts
          cp plutus/out/prizeValidatorFactory.plutus.json src/plutusScripts/prizeValidatorFactory.plutus.json
          EXPERIMENT_PHASE=candidate node --import=tsx/esm "$probe_file" 2>&1 | tee "$EXPERIMENT_EVIDENCE_DIR/candidate-measurement.log"

          node --input-type=module - "$EXPERIMENT_EVIDENCE_DIR" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const dir = process.argv[2]
          const baseline = JSON.parse(readFileSync(dir + '/baseline.json', 'utf8'))
          const candidate = JSON.parse(readFileSync(dir + '/candidate.json', 'utf8'))
          const baselineBytes = baseline.parameterizedPrizeValidator.cborBytes
          const candidateBytes = candidate.parameterizedPrizeValidator.cborBytes
          const saving = baselineBytes - candidateBytes
          const projectedPublicationBytes = 16540 + (candidateBytes - 16443)
          const result = {
            schema: 'IMMORTAL-PRIZEVALIDATOR-CONSERVATIVE-OPTIMIZATION-COMPARISON-v0.1',
            classification: 'COMPILE_SIZE_COMPARISON_ONLY_NOT_LEDGER_OR_SEMANTIC_QUALIFICATION',
            baseline: {
              factoryBytes: baseline.factory.cborBytes,
              factorySha256: baseline.factory.cborSha256,
              parameterizedScriptBytes: baselineBytes,
              parameterizedScriptSha256: baseline.parameterizedPrizeValidator.cborSha256,
              scriptHash: baseline.parameterizedPrizeValidator.scriptHash,
            },
            candidate: {
              factoryBytes: candidate.factory.cborBytes,
              factorySha256: candidate.factory.cborSha256,
              parameterizedScriptBytes: candidateBytes,
              parameterizedScriptSha256: candidate.parameterizedPrizeValidator.cborSha256,
              scriptHash: candidate.parameterizedPrizeValidator.scriptHash,
            },
            parameterizedScriptBytesSaved: saving,
            projectedPublicationTransactionBytes: projectedPublicationBytes,
            projectionAssumption: 'projection only: the measured baseline non-script remainder remains 97 bytes; actual candidate publication transaction was not built',
            candidateAtOrBelow16287ByteConditionalScriptThreshold: candidateBytes <= 16287,
            decision: candidateBytes <= 16287
              ? 'SIZE_CANDIDATE_MEETS_THE_CONDITIONAL_156_BYTE_SCRIPT_REDUCTION_THRESHOLD'
              : 'SIZE_CANDIDATE_DOES_NOT_MEET_THE_CONDITIONAL_156_BYTE_SCRIPT_REDUCTION_THRESHOLD',
            nonClaims: [
              'no CEK-cost equivalence or semantic equivalence established',
              'no publication transaction constructed or submitted',
              'no Yaci, wallet, Preprod or Mainnet interaction',
              'candidate script hash is not production-qualified',
              'no production artifact substitution or dependent script re-binding',
            ],
          }
          writeFileSync(dir + '/comparison.json', JSON.stringify(result, null, 2) + '\n')
          writeFileSync(dir + '/comparison.md', [
            '# PrizeValidator conservative-optimisation compile/size comparison',
            '',
            '- Baseline parameterized PrizeValidator: ' + baselineBytes + ' bytes',
            '- Candidate parameterized PrizeValidator: ' + candidateBytes + ' bytes',
            '- Absolute byte saving: ' + saving + ' bytes',
            '- Candidate script SHA-256: ' + candidate.parameterizedPrizeValidator.cborSha256,
            '- Candidate PlutusV2 script hash: ' + candidate.parameterizedPrizeValidator.scriptHash,
            '- Projected publication transaction size: ' + projectedPublicationBytes + ' bytes (projection only; assumes unchanged 97-byte non-script remainder)',
            '- Conditional threshold (16,287 bytes): ' + (candidateBytes <= 16287 ? 'MET' : 'NOT MET'),
            '',
            'This is compile/size evidence only. It does not establish semantic or CEK-cost equivalence, publication success, or deployment readiness.',
          ].join('\n') + '\n')
          console.log(JSON.stringify(result, null, 2))
          NODE

          cat "$EXPERIMENT_EVIDENCE_DIR/comparison.md"

      - name: Upload compile-size evidence (including failed baseline/candidate attempts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prizevalidator-conservative-optimization-experiment
          path: ${{ runner.temp }}/prizevalidator-conservative-optimization-experiment/
          if-no-files-found: warn
          retention-days: 14
