name: PrizeValidator Conservative Optimization Size Experiment

on:
  push:
    branches:
      - work/immortal-green-closure
    paths:
      - ".github/workflows/prizevalidator-conservative-optimization-experiment.yml"

permissions:
  contents: read

jobs:
  workflow-load-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm isolated experiment workflow loaded
        run: |
          set -euo pipefail
          echo "workflow syntax and job graph loaded"
          echo "sha=$GITHUB_SHA"
          echo "ref=$GITHUB_REF"
