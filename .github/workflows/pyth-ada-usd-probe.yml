name: Isolated Pyth ADA USD Probe

on:
  push:
    branches:
      - work/immortal-green-closure
    paths:
      - "poc/aiken-pyth-ada-usd/**"
      - "scripts/testPythSignedUpdatePreprod.mts"
      - "scripts/pythPreprodConfig.mts"
      - "scripts/pythPreprodConfig.test.mts"
      - ".github/workflows/pyth-ada-usd-probe.yml"
      - ".github/workflows/pyth-native-ledger-probe.yml"
  pull_request:
    paths:
      - "poc/aiken-pyth-ada-usd/**"
      - "scripts/testPythSignedUpdatePreprod.mts"
      - "scripts/pythPreprodConfig.mts"
      - "scripts/pythPreprodConfig.test.mts"
      - ".github/workflows/pyth-ada-usd-probe.yml"
      - ".github/workflows/pyth-native-ledger-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pyth-native-runner-typecheck:
    name: Type-check guarded native-ledger runner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Install pinned isolated Pyth runner dependencies
        run: |
          npm install --no-save --package-lock=false \
            @evolution-sdk/evolution@0.5.9 \
            @pythnetwork/pyth-lazer-cardano-js@0.1.0 \
            @pythnetwork/pyth-lazer-sdk@5.2.0

      - name: Verify pinned official Pyth Pro Preprod policy ID
        run: node --import=tsx ./scripts/pythPreprodConfig.test.mts

      - name: Type-check runner without requiring secrets or submitting transactions
        run: |
          npx tsc --noEmit --strict --target ES2022 --module ESNext \
            --moduleResolution bundler --skipLibCheck --types node \
            --allowImportingTsExtensions --verbatimModuleSyntax \\
            scripts/testPythSignedUpdatePreprod.mts

  pyth-ada-usd-probe:
    name: Compile isolated Pyth ADA/USD consumer
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: poc/aiken-pyth-ada-usd
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Install pinned Aiken matching the Pyth library manifest
        uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.21

      - name: Record toolchain
        run: |
          aiken --version
          cat aiken.toml

      - name: Run synthetic source-boundary tests
        shell: bash
        run: |
          set +e
          script -qec 'RUST_BACKTRACE=full aiken check' /dev/null > aiken-check.tty.log 2>&1
          status=$?
          printf 'AIKEN_CHECK_EXIT=%s\\n' "$status"
          cat aiken-check.tty.log
          exit "$status"

      - name: Compile isolated Plutus V3 consumer
        shell: bash
        run: |
          set +e
          script -qec 'RUST_BACKTRACE=full aiken build' /dev/null > aiken-build.tty.log 2>&1
          status=$?
          printf 'AIKEN_BUILD_EXIT=%s\\n' "$status"
          cat aiken-build.tty.log
          exit "$status"

      - name: Capture pinned dependencies and compiled artifact metadata
        shell: bash
        run: |
          set -euo pipefail
          test -s aiken.lock
          test -s plutus.json
          mkdir -p probe-evidence
          cp aiken.lock probe-evidence/aiken.lock
          cp plutus.json probe-evidence/plutus.json
          sha256sum aiken.toml aiken.lock plutus.json > probe-evidence/SHA256SUMS
          node <<'NODE'
          const fs = require('node:fs')
          const { createHash } = require('node:crypto')
          const lock = fs.readFileSync('aiken.lock')
          const blueprintBytes = fs.readFileSync('plutus.json')
          const blueprint = JSON.parse(blueprintBytes.toString('utf8'))
          if (blueprint.preamble?.plutusVersion !== 'v3') process.exit(1)
          const validators = (blueprint.validators ?? []).map((validator) => {
            if (typeof validator.compiledCode !== 'string' || !/^[0-9a-f]+$/i.test(validator.compiledCode)) {
              throw new Error('Invalid compiledCode for validator ' + String(validator.title))
            }
            return {
              title: validator.title ?? null,
              hash: validator.hash ?? null,
              compiledCodeBytes: Buffer.from(validator.compiledCode, 'hex').length,
            }
          })
          fs.writeFileSync('probe-evidence/build-manifest.json', JSON.stringify({
            schema: 'immortal-pyth-ada-usd-probe-build-v1',
            status: 'COMPILED_PROBE_ONLY',
            plutusVersion: blueprint.preamble.plutusVersion,
            aikenManifestSha256: createHash('sha256').update(fs.readFileSync('aiken.toml')).digest('hex'),
            lockfileSha256: createHash('sha256').update(lock).digest('hex'),
            blueprintSha256: createHash('sha256').update(blueprintBytes).digest('hex'),
            validators,
            disclaimer: 'Compilation and synthetic tests do not prove Pyth signature verification or native-ledger acceptance.',
          }, null, 2) + '\n')
          console.log(fs.readFileSync('probe-evidence/build-manifest.json', 'utf8'))
          NODE

      - name: Upload pinned source and compile evidence
        uses: actions/upload-artifact@v4
        with:
          name: pyth-ada-usd-probe-${{ github.sha }}
          path: |
            poc/aiken-pyth-ada-usd/probe-evidence/**
          if-no-files-found: error
          retention-days: 30

      - name: Report generated artifact is probe-only
        run: |
          test -s plutus.json
          node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("plutus.json","utf8")); if(p.preamble?.plutusVersion!=="v3") process.exit(1); console.log("Probe-only Plutus V3 blueprint generated; this does not establish Pyth signature verification or ledger acceptance.")'
