name: Isolated Pyth ADA USD Probe

on:
  push:
    branches:
      - work/immortal-green-closure
    paths:
      - "poc/aiken-pyth-ada-usd/**"
      - ".github/workflows/pyth-ada-usd-probe.yml"
  pull_request:
    paths:
      - "poc/aiken-pyth-ada-usd/**"
      - ".github/workflows/pyth-ada-usd-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pyth-ada-usd-probe:
    name: Compile isolated Pyth ADA/USD consumer
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: poc/aiken-pyth-ada-usd
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Install pinned Aiken matching the Pyth library manifest
        uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.21

      - name: Record toolchain
        run: |
          aiken --version
          cat aiken.toml

      - name: Run synthetic source-boundary tests
        run: aiken check

      - name: Compile isolated Plutus V3 consumer
        run: aiken build

      - name: Report generated artifact is probe-only
        run: |
          test -s plutus.json
          node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("plutus.json","utf8")); if(p.preamble?.plutusVersion!=="v3") process.exit(1); console.log("Probe-only Plutus V3 blueprint generated; this does not establish Pyth signature verification or ledger acceptance.")'
