name: IMMORTAL Economic Gate Cross-Transition Contract Test

on:
  push:
    branches:
      - b1-hardening
    paths:
      - "scripts/immortal-economic-gate-cross-transition.py"
      - "docs/research/IMMORTAL-ECONOMIC-GATE-CROSS-TRANSITION-TEST-v1.md"
      - ".github/workflows/immortal-economic-gate-cross-transition.yml"
  pull_request:
    paths:
      - "scripts/immortal-economic-gate-cross-transition.py"
      - "docs/research/IMMORTAL-ECONOMIC-GATE-CROSS-TRANSITION-TEST-v1.md"
      - ".github/workflows/immortal-economic-gate-cross-transition.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-test:
    name: Cross-transition economic gate contract (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run synthetic cross-transition contract cases
        run: python scripts/immortal-economic-gate-cross-transition.py
