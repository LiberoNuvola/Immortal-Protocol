name: IMMORTAL Universal Kernel Cross-Transition Contract Test

on:
  push:
    branches:
      - b1-hardening
    paths:
      - "scripts/immortal-economic-gate-cross-transition.py"
      - "docs/research/IMMORTAL-ECONOMIC-GATE-CROSS-TRANSITION-TEST-v1.md"
      - "plutus/test/UniversalEconomicKernelTest.hs"
      - "IMMORTAL/kernel/UniversalEconomicKernel.hs"
      - "IMMORTAL/state/UniversalEconomicState.hs"
      - "plutus/pre-rich-plutus.cabal"
      - "cabal.project"
      - ".github/workflows/immortal-economic-gate-cross-transition.yml"
  pull_request:
    branches:
      - b1-hardening
    paths:
      - "scripts/immortal-economic-gate-cross-transition.py"
      - "docs/research/IMMORTAL-ECONOMIC-GATE-CROSS-TRANSITION-TEST-v1.md"
      - "plutus/test/UniversalEconomicKernelTest.hs"
      - "IMMORTAL/kernel/UniversalEconomicKernel.hs"
      - "IMMORTAL/state/UniversalEconomicState.hs"
      - "plutus/pre-rich-plutus.cabal"
      - "cabal.project"
      - ".github/workflows/immortal-economic-gate-cross-transition.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  universal-kernel-contract:
    name: Universal-kernel arithmetic contract (Python mirror)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run synthetic universal-kernel cases
        run: python scripts/immortal-economic-gate-cross-transition.py

  universal-kernel-haskell:
    name: UniversalEconomicKernel Haskell tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6.7"
          cabal-version: "3.12.1.0"
      - name: Install Cardano libsodium VRF dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential libtool pkg-config
          REV="$(curl -fsSL https://github.com/input-output-hk/iohk-nix/releases/latest/download/INFO | awk '$1 == "debian.libsodium-vrf.deb" { print $2 }' | sed -E 's/.*-([[:xdigit:]]+)\.deb/\1/')"
          test -n "$REV"
          git clone https://github.com/IntersectMBO/libsodium "$RUNNER_TEMP/libsodium"
          cd "$RUNNER_TEMP/libsodium"
          git checkout "$REV"
          ./autogen.sh
          # autogen.sh normally downloads GNU config.guess/config.sub. Only use a
          # fallback mirror if either helper is absent; avoid making a healthy setup
          # depend on the Savannah endpoint being available.
          mkdir -p build-aux
          if [ ! -s build-aux/config.guess ]; then
            curl --retry 3 --retry-all-errors -fsSL https://raw.githubusercontent.com/gcc-mirror/config/master/config.guess -o build-aux/config.guess
          fi
          if [ ! -s build-aux/config.sub ]; then
            curl --retry 3 --retry-all-errors -fsSL https://raw.githubusercontent.com/gcc-mirror/config/master/config.sub -o build-aux/config.sub
          fi
          chmod +x build-aux/config.guess build-aux/config.sub
          test -s build-aux/config.guess
          test -s build-aux/config.sub
          ./build-aux/config.sub x86_64-pc-linux-gnu >/dev/null
          ./configure --prefix=/usr/local
          make -j2
          make check
          sudo make install
          echo "/usr/local/lib" | sudo tee /etc/ld.so.conf.d/cardano-libsodium.conf
          sudo ldconfig
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - name: Install Cardano libblst dependency
        shell: bash
        run: |
          # Pin the Cardano-reviewed blst source revision corresponding to v0.3.15.
          # cardano-crypto-class requires pkg-config package libblst >= 0.3.14.
          BLST_REV="6d960cd05d6fe2b5bc9ba161edf0c1a131b87c4c"
          BLST_VERSION="0.3.15"
          git clone https://github.com/supranational/blst "$RUNNER_TEMP/blst"
          git -C "$RUNNER_TEMP/blst" checkout --detach "$BLST_REV"
          test "$(git -C "$RUNNER_TEMP/blst" rev-parse HEAD)" = "$BLST_REV"
          cd "$RUNNER_TEMP/blst"
          ./build.sh
          sudo install -D -m 0644 libblst.a /usr/local/lib/libblst.a
          sudo install -D -m 0644 bindings/blst.h /usr/local/include/blst.h
          sudo install -D -m 0644 bindings/blst_aux.h /usr/local/include/blst_aux.h
          sudo install -D -m 0644 bindings/blst.hpp /usr/local/include/blst.hpp
          sudo install -d -m 0755 /usr/local/lib/pkgconfig
          cat > "$RUNNER_TEMP/libblst.pc" <<EOF
          prefix=/usr/local
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib
          includedir=\${prefix}/include
          Name: libblst
          Description: Multilingual BLS12-381 signature library
          URL: https://github.com/supranational/blst
          Version: ${BLST_VERSION}
          Cflags: -I\${includedir}
          Libs: -L\${libdir} -lblst
          EOF
          sudo install -m 0644 "$RUNNER_TEMP/libblst.pc" /usr/local/lib/pkgconfig/libblst.pc
          sudo ldconfig
          pkg-config --modversion libblst
          pkg-config --atleast-version=0.3.14 libblst
          pkg-config --cflags --libs libblst
      - name: Update package index
        run: cabal update
      - name: Build universal economic kernel test target
        working-directory: plutus
        run: cabal build universal-economic-kernel-tests
      - name: Run universal economic kernel tests
        working-directory: plutus
        run: cabal test universal-economic-kernel-tests --test-show-details=direct
