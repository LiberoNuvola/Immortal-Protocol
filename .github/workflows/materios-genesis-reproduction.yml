name: Materios Genesis Reproduction

on:
  workflow_dispatch:
  push:
    branches:
      - work/b3-materios-provenance-evidence
    paths:
      - ".github/workflows/materios-genesis-reproduction.yml"

permissions:
  contents: read

jobs:
  reproduce-genesis:
    name: Reproduce and cross-check Materios preprod genesis
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout IMMORTAL
        uses: actions/checkout@v4

      - name: Prepare evidence directory
        run: mkdir -p out

      - name: Pin current upstream Materios source
        run: |
          set -euo pipefail
          git clone https://github.com/Flux-Point-Studios/materios.git "$GITHUB_WORKSPACE/materios-source"
          git -C "$GITHUB_WORKSPACE/materios-source" checkout --detach f1c8b400a229258298236d9337247135b6c1112e
          test "$(git -C "$GITHUB_WORKSPACE/materios-source" rev-parse HEAD)" = "f1c8b400a229258298236d9337247135b6c1112e"

      - name: Install build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler jq
          protoc --version
          jq --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          components: rust-src
          targets: wasm32-unknown-unknown

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            materios-source/partnerchain -> target
          save-if: true

      - name: Build current upstream Materios node
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/materios-source/partnerchain"
          cargo build --locked --release -p materios-node
          cp target/release/materios-node "$RUNNER_TEMP/materios-node-current"

      - name: Capture current-source and live genesis identities
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out"
          NODE="$RUNNER_TEMP/materios-node-current"
          EXPECTED="0x0e46e33f639a56cc8780fd871d9a15e16d99af248526f907cb560cb40849f7bf"
          EXPECTED_RAW_SHA256="77877aa63358af6cf0c78a3b106ac2d295da575973bec1c3ff51d53b3fa65aaa"

          "$NODE" chain-id --chain preprod > "$OUT/builtin-preprod-identity.json"
          "$NODE" build-spec --chain preprod --raw > "$OUT/builtin-preprod-raw.json"
          BUILTIN_HASH="$(jq -er '.genesis_hash | ascii_downcase' "$OUT/builtin-preprod-identity.json")"

          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            https://materios.fluxpointstudios.com/releases/chain-spec-v6-raw.json \
            --output "$OUT/published-chain-spec-v6-raw.json"
          RAW_SHA256="$(sha256sum "$OUT/published-chain-spec-v6-raw.json" | cut -d ' ' -f1)"
          "$NODE" chain-id --chain "$OUT/published-chain-spec-v6-raw.json" \
            > "$OUT/published-chain-spec-identity.json"
          PUBLISHED_SPEC_HASH="$(jq -er '.genesis_hash | ascii_downcase' "$OUT/published-chain-spec-identity.json")"

          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            https://materios.fluxpointstudios.com/chain-info \
            --output "$OUT/chain-info.json"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"chain_getBlockHash","params":["0x0"]}' \
            https://materios.fluxpointstudios.com/preprod-rpc \
            --output "$OUT/preprod-rpc-genesis.json"
          GATEWAY_HASH="$(jq -er '.genesis | ascii_downcase' "$OUT/chain-info.json")"
          RPC_HASH="$(jq -er '.result | ascii_downcase' "$OUT/preprod-rpc-genesis.json")"
          SPEC_VERSION="$(jq -er '.spec_version | tostring' "$OUT/chain-info.json")"

          code_digest() {
            node - "$1" <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const doc = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const code = doc?.genesis?.raw?.top?.['0x3a636f6465'];
          if (typeof code !== 'string' || !code.startsWith('0x')) process.exit(2);
          const bytes = Buffer.from(code.slice(2), 'hex');
          process.stdout.write(crypto.createHash('sha256').update(bytes).digest('hex'));
          NODE
          }
          BUILTIN_CODE_SHA256="$(code_digest "$OUT/builtin-preprod-raw.json")"
          PUBLISHED_CODE_SHA256="$(code_digest "$OUT/published-chain-spec-v6-raw.json")"

          printf '%s\n' "$BUILTIN_HASH" > "$OUT/builtin-genesis-hash.txt"
          printf '%s\n' "$RAW_SHA256" > "$OUT/published-raw-spec-sha256.txt"
          printf '%s\n' "$PUBLISHED_SPEC_HASH" > "$OUT/published-spec-genesis-hash.txt"
          printf '%s\n' "$GATEWAY_HASH" > "$OUT/gateway-genesis-hash.txt"
          printf '%s\n' "$RPC_HASH" > "$OUT/rpc-genesis-hash.txt"
          printf '%s\n' "$SPEC_VERSION" > "$OUT/live-spec-version.txt"
          printf '%s\n' "$BUILTIN_CODE_SHA256" > "$OUT/builtin-runtime-code-sha256.txt"
          printf '%s\n' "$PUBLISHED_CODE_SHA256" > "$OUT/published-runtime-code-sha256.txt"
          printf '%s\n' "$EXPECTED" > "$OUT/expected-genesis-hash.txt"
          printf '%s\n' "$EXPECTED_RAW_SHA256" > "$OUT/expected-raw-spec-sha256.txt"

          {
            echo "built_in_genesis=$BUILTIN_HASH"
            echo "published_spec_genesis=$PUBLISHED_SPEC_HASH"
            echo "published_raw_sha256=$RAW_SHA256"
            echo "expected_raw_sha256=$EXPECTED_RAW_SHA256"
            echo "published_runtime_code_sha256=$PUBLISHED_CODE_SHA256"
            echo "builtin_runtime_code_sha256=$BUILTIN_CODE_SHA256"
            echo "gateway_genesis=$GATEWAY_HASH"
            echo "rpc_genesis=$RPC_HASH"
            echo "live_spec_version=$SPEC_VERSION"
          } | tee "$OUT/current-source-live-comparison.txt"

      - name: Test historical v6 genesis source candidate
        id: historical
        run: |
          set -uo pipefail
          SRC="$GITHUB_WORKSPACE/materios-source"
          OUT="$GITHUB_WORKSPACE/out"
          CANDIDATE_COMMIT="bfffb5942818334e367ef44a222e5371a9a3968b"
          CURRENT_NODE="$RUNNER_TEMP/materios-node-current"
          STATUS="build_or_derivation_failed"
          HASH="unavailable"
          CODE_SHA256="unavailable"
          CODE_BLAKE2="unavailable"

          # Build the historical source's exact runtime blob using Materios'
          # own digest-pinned reproducible builder, which was added after the
          # original genesis and archives the candidate commit at /materios.
          if bash "$SRC/tools/runtime-build/build.sh" "$CANDIDATE_COMMIT" "$OUT/historical-runtime-build" > "$OUT/historical-runtime-build.log" 2>&1; then
            WASM="$OUT/historical-runtime-build/materios_runtime.compact.compressed.wasm"
            if [[ -s "$WASM" ]]; then
              CODE_SHA256="$(sha256sum "$WASM" | cut -d ' ' -f1)"
              CODE_BLAKE2="0x$(b2sum -l 256 "$WASM" | cut -d ' ' -f1)"

              # Keep the pinned current node binary safe before checking out
              # the historical revision in the same clone.
              if git -C "$SRC" checkout --detach "$CANDIDATE_COMMIT" > "$OUT/historical-checkout.log" 2>&1; then
                if (cd "$SRC/partnerchain" && cargo build --locked --release -p materios-node) > "$OUT/historical-build.log" 2>&1; then
                  HIST_NODE="$SRC/partnerchain/target/release/materios-node"
                  if "$HIST_NODE" build-spec --chain preprod > "$OUT/historical-v6-plain.json" 2> "$OUT/historical-build-spec-plain.stderr"; then
                    CODE_HEX="$(xxd -p "$WASM" | tr -d '\n')"
                    if jq --arg code "0x$CODE_HEX" '.genesis.runtimeGenesis.code = $code' "$OUT/historical-v6-plain.json" > "$OUT/historical-v6-plain-built.json" 2> "$OUT/historical-patch-code.stderr"; then
                      if "$HIST_NODE" build-spec --chain "$OUT/historical-v6-plain-built.json" --raw > "$OUT/historical-v6-preprod-raw.json" 2> "$OUT/historical-build-spec-raw.stderr"; then
                        if "$CURRENT_NODE" chain-id --chain "$OUT/historical-v6-preprod-raw.json" > "$OUT/historical-v6-identity.json" 2> "$OUT/historical-identity.stderr"; then
                          HASH="$(jq -er '.genesis_hash | ascii_downcase' "$OUT/historical-v6-identity.json" 2>/dev/null || echo unavailable)"
                          STATUS="derived"
                        fi
                      fi
                    fi
                  fi
                fi
              fi
            fi
          fi

          printf '%s\n' "$CANDIDATE_COMMIT" > "$OUT/historical-source-commit.txt"
          printf '%s\n' "$STATUS" > "$OUT/historical-candidate-status.txt"
          printf '%s\n' "$HASH" > "$OUT/historical-candidate-genesis-hash.txt"
          printf '%s\n' "$CODE_SHA256" > "$OUT/historical-candidate-runtime-code-sha256.txt"
          printf '%s\n' "$CODE_BLAKE2" > "$OUT/historical-candidate-runtime-code-blake2-256.txt"
          {
            echo "status=$STATUS"
            echo "genesis_hash=$HASH"
            echo "runtime_code_sha256=$CODE_SHA256"
            echo "runtime_code_blake2_256=$CODE_BLAKE2"
            echo "source_commit=$CANDIDATE_COMMIT"
          } | tee "$OUT/historical-candidate-result.txt"

          if [[ "$STATUS" != "derived" ]]; then
            echo "::warning::Historical v6 candidate did not produce a reconstructed raw identity; diagnostic logs are retained."
          fi

      - name: Assemble versioned evidence report
        if: always()
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out"
          read_value() {
            if [[ -f "$OUT/$1" ]]; then tr -d '\r\n' < "$OUT/$1"; else printf 'unavailable'; fi
          }
          EXPECTED="$(read_value expected-genesis-hash.txt)"
          EXPECTED_RAW_SHA256="$(read_value expected-raw-spec-sha256.txt)"
          BUILTIN_HASH="$(read_value builtin-genesis-hash.txt)"
          RAW_SHA256="$(read_value published-raw-spec-sha256.txt)"
          PUBLISHED_HASH="$(read_value published-spec-genesis-hash.txt)"
          GATEWAY_HASH="$(read_value gateway-genesis-hash.txt)"
          RPC_HASH="$(read_value rpc-genesis-hash.txt)"
          SPEC_VERSION="$(read_value live-spec-version.txt)"
          BUILTIN_CODE_SHA256="$(read_value builtin-runtime-code-sha256.txt)"
          PUBLISHED_CODE_SHA256="$(read_value published-runtime-code-sha256.txt)"
          HIST_STATUS="$(read_value historical-candidate-status.txt)"
          HIST_HASH="$(read_value historical-candidate-genesis-hash.txt)"
          HIST_CODE_SHA256="$(read_value historical-candidate-runtime-code-sha256.txt)"
          HIST_COMMIT="$(read_value historical-source-commit.txt)"

          VERDICT="FAIL"
          if [[ "$RAW_SHA256" == "$EXPECTED_RAW_SHA256" && "$PUBLISHED_HASH" == "$EXPECTED" && "$RPC_HASH" == "$EXPECTED" && "$HIST_STATUS" == "derived" && "$HIST_HASH" == "$EXPECTED" && "$HIST_CODE_SHA256" == "$PUBLISHED_CODE_SHA256" ]]; then
            VERDICT="PASS"
          fi

          jq -n \
            --arg schema "IMMORTAL-MATERIOS-GENESIS-REPRODUCTION-v2" \
            --arg observed_at_utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg upstream_repository "https://github.com/Flux-Point-Studios/materios" \
            --arg current_upstream_commit "f1c8b400a229258298236d9337247135b6c1112e" \
            --arg historical_candidate_commit "$HIST_COMMIT" \
            --arg expected_live_genesis "$EXPECTED" \
            --arg expected_raw_spec_sha256 "$EXPECTED_RAW_SHA256" \
            --arg published_raw_spec_sha256 "$RAW_SHA256" \
            --arg builtin_source_genesis "$BUILTIN_HASH" \
            --arg published_raw_spec_genesis "$PUBLISHED_HASH" \
            --arg gateway_genesis "$GATEWAY_HASH" \
            --arg rpc_genesis "$RPC_HASH" \
            --arg live_spec_version "$SPEC_VERSION" \
            --arg builtin_runtime_code_sha256 "$BUILTIN_CODE_SHA256" \
            --arg published_runtime_code_sha256 "$PUBLISHED_CODE_SHA256" \
            --arg historical_candidate_status "$HIST_STATUS" \
            --arg historical_candidate_genesis "$HIST_HASH" \
            --arg historical_runtime_code_sha256 "$HIST_CODE_SHA256" \
            --arg verdict "$VERDICT" \
            '{
              schema: $schema,
              observed_at_utc: $observed_at_utc,
              upstream_repository: $upstream_repository,
              current_upstream_commit: $current_upstream_commit,
              historical_candidate: {
                source_commit: $historical_candidate_commit,
                status: $historical_candidate_status,
                reproduced_genesis: $historical_candidate_genesis,
                reproducible_runtime_code_sha256: $historical_runtime_code_sha256,
                published_runtime_code_match: ($historical_runtime_code_sha256 == $published_runtime_code_sha256)
              },
              expected_live_genesis: $expected_live_genesis,
              published_raw_spec: {
                sha256: $published_raw_spec_sha256,
                expected_sha256: $expected_raw_spec_sha256,
                reconstructed_genesis: $published_raw_spec_genesis,
                runtime_code_sha256: $published_runtime_code_sha256
              },
              current_builtin_spec: {
                reconstructed_genesis: $builtin_source_genesis,
                runtime_code_sha256: $builtin_runtime_code_sha256,
                matches_live: ($builtin_source_genesis == $expected_live_genesis)
              },
              live_observations: {
                gateway_genesis: $gateway_genesis,
                rpc_genesis: $rpc_genesis,
                spec_version: (try ($live_spec_version | tonumber) catch null),
                note: "chain-info polls the configured RPC; gateway and RPC are not independent sources."
              },
              checks: {
                published_raw_spec_digest_pinned: ($published_raw_spec_sha256 == $expected_raw_spec_sha256),
                published_raw_spec_reconstructs_live_genesis: ($published_raw_spec_genesis == $expected_live_genesis),
                direct_rpc_matches_expected: ($rpc_genesis == $expected_live_genesis),
                historical_source_reproduces_live_genesis: ($historical_candidate_status == "derived" and $historical_candidate_genesis == $expected_live_genesis)
              },
              verdict: $verdict,
              limitation: "A source-derived runtime blob and raw-spec/RPC match establish genesis identity reproducibility only; they do not prove independent source signature, GRANDPA finality, or authenticated authority-transition provenance."
            }' > "$OUT/MateriosGenesisReproduction.json"

          cat "$OUT/MateriosGenesisReproduction.json"

      - name: Upload genesis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: materios-genesis-reproduction-${{ github.run_id }}
          path: out/
          if-no-files-found: warn

      - name: Enforce genesis reproduction gates
        if: always()
        run: |
          set -euo pipefail
          REPORT="$GITHUB_WORKSPACE/out/MateriosGenesisReproduction.json"
          test -f "$REPORT"
          test "$(jq -r '.verdict' "$REPORT")" = "PASS"
