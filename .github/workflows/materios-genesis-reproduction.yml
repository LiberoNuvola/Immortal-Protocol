name: Materios Genesis Reproduction

on:
  workflow_dispatch:
  push:
    branches:
      - work/b3-materios-provenance-evidence
    paths:
      - "docs/04-verification/MATERIOS-GENESIS-BOOTSTRAP-EVIDENCE-REGISTER-v1.md"
      - ".github/workflows/materios-genesis-reproduction.yml"

permissions:
  contents: read

jobs:
  reproduce-genesis:
    name: Reproduce Materios preprod genesis
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout IMMORTAL
        uses: actions/checkout@v4

      - name: Pin upstream Materios source
        run: |
          set -euo pipefail
          git clone https://github.com/Flux-Point-Studios/materios.git "$RUNNER_TEMP/materios"
          git -C "$RUNNER_TEMP/materios" checkout --detach f1c8b400a229258298236d9337247135b6c1112e
          test "$(git -C "$RUNNER_TEMP/materios" rev-parse HEAD)" = "f1c8b400a229258298236d9337247135b6c1112e"

      - name: Install build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler
          protoc --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0

      - name: Build Materios node
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/materios/partnerchain"
          cargo build --locked --release -p materios-node

      - name: Verify genesis hash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/materios/partnerchain"
          ./target/release/materios-node chain-id --chain preprod
