name: Materios Genesis Reproduction

on:
  workflow_dispatch:
  push:
    branches:
      - work/b3-materios-provenance-evidence
    paths:
      - "docs/04-verification/MATERIOS-GENESIS-BOOTSTRAP-EVIDENCE-REGISTER-v1.md"
      - ".github/workflows/materios-genesis-reproduction.yml"

permissions:
  contents: read

jobs:
  reproduce-genesis:
    name: Reproduce and cross-check Materios preprod genesis
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout IMMORTAL
        uses: actions/checkout@v4

      - name: Prepare evidence directory
        run: mkdir -p out

      - name: Pin upstream Materios source
        run: |
          set -euo pipefail
          git clone https://github.com/Flux-Point-Studios/materios.git "$GITHUB_WORKSPACE/materios-source"
          git -C "$GITHUB_WORKSPACE/materios-source" checkout --detach f1c8b400a229258298236d9337247135b6c1112e
          test "$(git -C "$GITHUB_WORKSPACE/materios-source" rev-parse HEAD)" = "f1c8b400a229258298236d9337247135b6c1112e"

      - name: Install build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler jq
          protoc --version
          jq --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          components: rust-src
          targets: wasm32-unknown-unknown

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            materios-source/partnerchain -> target

      - name: Build Materios node
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/materios-source/partnerchain"
          cargo build --locked --release -p materios-node

      - name: Reproduce source and published-chain identities
        id: identity
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out"
          NODE="$GITHUB_WORKSPACE/materios-source/partnerchain/target/release/materios-node"
          EXPECTED="0x0e46e33f639a56cc8780fd871d9a15e16d99af248526f907cb560cb40849f7bf"
          UPSTREAM_COMMIT="f1c8b400a229258298236d9337247135b6c1112e"

          # Hash generated by the pinned source's built-in preprod spec.
          "$NODE" chain-id --chain preprod > "$OUT/builtin-preprod-identity.json"
          BUILTIN_HASH="$(jq -er '.genesis_hash | ascii_downcase' "$OUT/builtin-preprod-identity.json")"

          # Reconstruct the published raw genesis storage as a separate input.
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            https://materios.fluxpointstudios.com/releases/chain-spec-v6-raw.json \
            --output "$OUT/published-chain-spec-v6-raw.json"
          "$NODE" chain-id --chain "$OUT/published-chain-spec-v6-raw.json" \
            > "$OUT/published-chain-spec-identity.json"
          PUBLISHED_SPEC_HASH="$(jq -er '.genesis_hash | ascii_downcase' "$OUT/published-chain-spec-identity.json")"

          # Record the public gateway observation and cross-check it against JSON-RPC.
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            https://materios.fluxpointstudios.com/chain-info \
            --output "$OUT/chain-info.json"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"chain_getBlockHash","params":["0x0"]}' \
            https://materios.fluxpointstudios.com/preprod-rpc \
            --output "$OUT/preprod-rpc-genesis.json"

          GATEWAY_HASH="$(jq -er '.genesis | ascii_downcase' "$OUT/chain-info.json")"
          RPC_HASH="$(jq -er '.result | ascii_downcase' "$OUT/preprod-rpc-genesis.json")"
          SPEC_VERSION="$(jq -er '.spec_version | tostring' "$OUT/chain-info.json")"

          if [[ "$BUILTIN_HASH" == "$EXPECTED" && "$PUBLISHED_SPEC_HASH" == "$EXPECTED" && "$GATEWAY_HASH" == "$EXPECTED" && "$RPC_HASH" == "$EXPECTED" ]]; then
            VERDICT="PASS"
          else
            VERDICT="FAIL"
          fi

          jq -n \
            --arg schema "IMMORTAL-MATERIOS-GENESIS-REPRODUCTION-v1" \
            --arg upstream_repository "https://github.com/Flux-Point-Studios/materios" \
            --arg upstream_commit "$UPSTREAM_COMMIT" \
            --arg expected_live_genesis "$EXPECTED" \
            --arg builtin_source_genesis "$BUILTIN_HASH" \
            --arg published_raw_spec_genesis "$PUBLISHED_SPEC_HASH" \
            --arg gateway_genesis "$GATEWAY_HASH" \
            --arg rpc_genesis "$RPC_HASH" \
            --arg live_spec_version "$SPEC_VERSION" \
            --arg verdict "$VERDICT" \
            '{
              schema: $schema,
              observed_at_utc: (now | todateiso8601),
              upstream_repository: $upstream_repository,
              upstream_commit: $upstream_commit,
              expected_live_genesis: $expected_live_genesis,
              builtin_source_genesis: $builtin_source_genesis,
              published_raw_spec_genesis: $published_raw_spec_genesis,
              gateway_genesis: $gateway_genesis,
              rpc_genesis: $rpc_genesis,
              live_spec_version: ($live_spec_version | tonumber),
              checks: {
                builtin_source_matches_live: ($builtin_source_genesis == $expected_live_genesis),
                published_raw_spec_matches_live: ($published_raw_spec_genesis == $expected_live_genesis),
                gateway_matches_expected: ($gateway_genesis == $expected_live_genesis),
                rpc_matches_expected: ($rpc_genesis == $expected_live_genesis),
                rpc_matches_gateway: ($rpc_genesis == $gateway_genesis)
              },
              verdict: $verdict,
              limitation: "Genesis identity/reproducibility only; not a GRANDPA finality proof or authority-transition proof."
            }' > "$OUT/MateriosGenesisReproduction.json"

          cat "$OUT/MateriosGenesisReproduction.json"

          # Fail closed only after all diagnostic evidence is written.
          test "$BUILTIN_HASH" = "$EXPECTED"
          test "$PUBLISHED_SPEC_HASH" = "$EXPECTED"
          test "$GATEWAY_HASH" = "$EXPECTED"
          test "$RPC_HASH" = "$EXPECTED"

      - name: Upload genesis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: materios-genesis-reproduction-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
