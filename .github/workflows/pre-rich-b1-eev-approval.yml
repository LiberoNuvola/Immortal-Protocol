name: PRE-RICH B1 EEV Deployment Approval

on:
  workflow_dispatch:
    inputs:
      approve_eev:
        description: "Approve the already-qualified direct-USDM EEV deployment candidate"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  approve:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.approve_eev }}
    runs-on: ubuntu-24.04
    environment: PREPROD-EEV-APPROVAL
    timeout-minutes: 30
    env:
      KOIOS_PREPROD_URL: https://preprod.koios.rest/api/v1
      PREPROD_REVEAL_SEED: ${{ secrets.PREPROD_REVEAL_SEED }}
      PREPROD_WALLET_ADDRESS: addr_test1qp5lufttvlv0zxpz5d9j2z4chgn3hhkm2y76lx0xrzmtez2vdw4kh93zkwpqapr6nnnu5q8aakyr76ks9cl40wvaf96sqdraw4
      PREPROD_TUSDM_UNIT: e675b46e4d2242c991a8932a99db3044e80515ae14b4c4ccf6b3f4c90014df10745553444d
      PREPROD_EVIDENCE_DIR: audit/preprod-evidence
      PREPROD_DEPLOYMENT_MANIFEST: audit/preprod-evidence/preprod-direct-usdm-deployment.json
      PREPROD_ORACLE_STATE_MANIFEST: audit/preprod-evidence/preprod-oracle-state-deployment.json
      PREPROD_EEV_APPROVAL_ACTION: APPROVE_PREPROD_EEV
      PREPROD_EEV_APPROVAL_TOKEN: ${{ secrets.PREPROD_EEV_APPROVAL_TOKEN }}
    steps:
      # Keep the registered workflow on main separate from the protocol work branch.
      # Pin the exact qualified protocol snapshot; update only after requalification.
      - name: Checkout pinned qualified protocol snapshot
        uses: actions/checkout@v4
        with:
          ref: 657dce68ab386680f79928c18d1d39e5aabe0cfa
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund

      - name: Setup legacy Lucid runtime
        uses: ./.github/actions/setup-legacy-lucid

      - name: Verify signing configuration without exposing secret
        run: |
          test -n "$PREPROD_REVEAL_SEED"
          test -n "$PREPROD_EEV_APPROVAL_TOKEN"

      - name: Materialize/reuse authenticated Oracle State
        id: oracle-state
        run: node --import=tsx/esm audit/cardano-integration/preprod-direct-oracle-state-bootstrap.mjs

      - name: Materialize/recover current direct-USDM deployment manifest
        env:
          PREPROD_ORACLE_STATE_POLICY_ID: ${{ steps.oracle-state.outputs.oracle_state_policy_id }}
          PREPROD_ORACLE_STATE_TOKEN_NAME_HEX: ${{ steps.oracle-state.outputs.oracle_state_token_name_hex }}
          PREPROD_ORACLE_PUBLISHER_PKH: ${{ steps.oracle-state.outputs.oracle_publisher_pkh }}
        run: node --import=tsx/esm audit/cardano-integration/preprod-direct-usdm-bootstrap.mjs

      - name: Re-observe exact live direct-USDM source set
        run: node audit/cardano-integration/preprod-direct-usdm-source-set.mjs

      - name: Re-qualify EV1-EV7 against the current live candidate
        run: node audit/cardano-integration/preprod-direct-usdm-qualification.mjs

      - name: Materialize DEPLOYMENT_APPROVED qualification
        run: node audit/cardano-integration/preprod-direct-usdm-approve.mjs

      - name: Normalize approved governance state
        run: |
          node --input-type=commonjs - <<'NODE'
          const fs = require('node:fs')
          const { createHash } = require('node:crypto')
          const p = 'audit/preprod-evidence/preprod-direct-usdm-approved-qualification.json'
          const q = JSON.parse(fs.readFileSync(p, 'utf8'))
          if (q.deploymentApproval?.status !== 'DEPLOYMENT_APPROVED') {
            throw new Error('refusing to normalize an artifact without deployment approval')
          }
          q.governance = {
            ...(q.governance ?? {}),
            qualificationMeaning: 'EV1-EV7 were mechanically qualified against the observed direct-USDM source set. This artifact records a separate DEPLOYMENT_APPROVED decision for that exact candidate; it does not itself authorize Issue admission.',
            requiredNextStep: 'Before Issue admission, revalidate the live UTxO and validate this approval together with authenticated control state, ProtectedCapital provenance, viability/liquidity evidence, and the authoritative Issue decision.',
          }
          delete q.evidenceHash
          q.evidenceHash = createHash('sha256')
            .update(JSON.stringify(q, (_key, item) => typeof item === 'bigint' ? item.toString() : item), 'utf8')
            .digest('hex')
          fs.writeFileSync(p, JSON.stringify(q, null, 2) + '\n')
          NODE

      - name: Verify approval result
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const p = 'audit/preprod-evidence/preprod-direct-usdm-approved-qualification.json'
          const q = JSON.parse(fs.readFileSync(p, 'utf8'))
          if (q.status !== 'qualified') throw new Error('qualification is not qualified')
          if (q.deploymentApproval?.status !== 'DEPLOYMENT_APPROVED') throw new Error('deployment approval missing')
          if (q.deploymentApproval?.profileVersion !== 'PRE-RICH-EEV-USDM-DIRECT-V1') throw new Error('wrong deployment profile')
          if (!/^[0-9a-f]{64}$/.test(q.evidenceHash ?? '')) throw new Error('approved qualification evidence hash missing')
          if (!/^[0-9a-f]{64}$/.test(q.deploymentApproval.evidenceHash ?? '')) throw new Error('approval evidence hash missing')
          if (q.deploymentApproval.qualificationEvidenceHash !== q.governance?.approvalInputQualificationHash) throw new Error('approval does not bind the original qualification digest')
          if (q.deploymentApproval.evidenceHash !== q.governance?.approvalEvidenceHash) throw new Error('approval digest does not match its governance evidence record')
          if (!/^[0-9a-f]{64}$/.test(q.deploymentApproval.qualificationEvidenceHash ?? '')) throw new Error('original qualification digest missing')
          if (!q.governance?.qualificationMeaning?.includes('records a separate DEPLOYMENT_APPROVED decision')) throw new Error('approved governance meaning is stale or inconsistent')
          if (!q.governance?.requiredNextStep?.includes('authoritative Issue decision')) throw new Error('approved governance next step is stale or incomplete')
          const { evidenceHash, ...payload } = q
          const actualEvidenceHash = require('node:crypto').createHash('sha256').update(JSON.stringify(payload, (_key, item) => typeof item === 'bigint' ? item.toString() : item), 'utf8').digest('hex')
          if (evidenceHash !== actualEvidenceHash) throw new Error('approved qualification evidence hash does not match normalized artifact')
          NODE

      - name: Upload approved EEV evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortal-preprod-eev-approved
          path: audit/preprod-evidence/
          if-no-files-found: error
