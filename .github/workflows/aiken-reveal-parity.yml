name: Aiken Reveal Parity

on:
  push:
    branches:
      - work/immortal-green-closure
    paths:
      - "poc/aiken-reveal-parity/**"
      - "plutus/pre-rich-plutus.cabal"
      - "plutus/test/RevealSchemaFixtures.hs"
      - "scripts/jev-verification-registry-generator.mjs"
      - "scripts/test-jev-verification-registry-generator.mjs"
      - "scripts/build-jev-operational-prompt.mjs"
      - "scripts/test-jev-operational-prompt.mjs"
      - "scripts/register-evidence-in-notion.mjs"
      - "scripts/test-notion-evidence-ledger.mjs"
      - "scripts/enforce-aiken-parity-gate.sh"
      - "scripts/test-aiken-parity-gate.mjs"
      - "scripts/measure-aiken-validator-size.mjs"
      - "scripts/test-measure-aiken-validator-size.mjs"
      - "scripts/probe-aiken-v2-compatibility.sh"
      - "scripts/generate-aiken-schema-fixture-tests.mjs"
      - "scripts/generate-aiken-reveal-transition-tests.mjs"
      - "scripts/generate-aiken-reveal-mutation-tests.mjs"
      - "scripts/lib/aiken-datum-exprs.mjs"
      - ".github/workflows/aiken-reveal-parity.yml"
  pull_request:
    paths:
      - "poc/aiken-reveal-parity/**"
      - "plutus/pre-rich-plutus.cabal"
      - "plutus/test/RevealSchemaFixtures.hs"
      - "scripts/jev-verification-registry-generator.mjs"
      - "scripts/test-jev-verification-registry-generator.mjs"
      - "scripts/build-jev-operational-prompt.mjs"
      - "scripts/test-jev-operational-prompt.mjs"
      - "scripts/register-evidence-in-notion.mjs"
      - "scripts/test-notion-evidence-ledger.mjs"
      - "scripts/enforce-aiken-parity-gate.sh"
      - "scripts/test-aiken-parity-gate.mjs"
      - "scripts/measure-aiken-validator-size.mjs"
      - "scripts/test-measure-aiken-validator-size.mjs"
      - "scripts/probe-aiken-v2-compatibility.sh"
      - "scripts/generate-aiken-schema-fixture-tests.mjs"
      - "scripts/generate-aiken-reveal-transition-tests.mjs"
      - "scripts/generate-aiken-reveal-mutation-tests.mjs"
      - "scripts/lib/aiken-datum-exprs.mjs"
      - ".github/workflows/aiken-reveal-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: Check isolated Reveal parity harness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc/aiken-reveal-parity
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Setup Node for JEV evidence registration
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup canonical Plutus toolchain for schema fixtures
        id: haskell-toolchain
        uses: ./.github/actions/setup-plutus
        continue-on-error: true
        with:
          update-hackage: "false"

      - name: Restore Haskell build cache for schema fixtures
        if: always() && steps.haskell-toolchain.outcome == 'success'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            dist-newstyle
          key: aiken-reveal-haskell-${{ runner.os }}-${{ hashFiles('**/*.cabal', 'cabal.project*', '**/*.hs', '**/*.lhs') }}
          restore-keys: |
            aiken-reveal-haskell-${{ runner.os }}-
            plutus-build-${{ runner.os }}-

      - name: Generate canonical Haskell Plutus Data fixtures
        id: haskell-fixtures
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.haskell-toolchain.outcome }}" != "success" ]; then
            echo "Canonical Haskell toolchain setup did not succeed; fixture generation is blocked."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/poc/aiken-reveal-parity/jev-evidence"
          cd "$GITHUB_WORKSPACE"
          cabal run exe:reveal-schema-fixtures -- "$GITHUB_WORKSPACE/poc/aiken-reveal-parity/jev-evidence/reveal-schema-fixtures.json"
          test -s "$GITHUB_WORKSPACE/poc/aiken-reveal-parity/jev-evidence/reveal-schema-fixtures.json"
          node -e 'const f=require(process.argv[1]); const expected=["PrizeDatum.pending","PrizeAction.SyncBeacon","PrizeAction.Reveal","PrizeAction.Claim","PrizeAction.Expire","BeaconTarget","B1PrizePoolDatum","B1PrizePoolAction.FundTreasury","B1PrizePoolAction.TicketIssued","B1PrizePoolAction.TicketRevealed","B1PrizePoolAction.TicketClaimed","B1PrizePoolAction.TicketExpired"]; const ts=[f.transitionFixtures?.successfulReveal,f.transitionFixtures?.zeroPayoutLoss]; const cases=["successful_reveal","zero_payout_loss","wrong_player_secret_rejected","reveal_after_expiry_rejected","wrong_pool_liability_delta_rejected","changed_prize_identity_rejected","prize_value_not_preserved_rejected","duplicate_pool_input_rejected","missing_pool_output_rejected","duplicate_prize_output_rejected","pool_script_hash_binding_rejected"]; const v=f.validatorEvaluations; if(f.schema!=="pre-rich-reveal-plutus-data-v3" || expected.some(k=>typeof f.fixtures?.[k]!=="string" || !/^[0-9a-f]+$/.test(f.fixtures[k])) || ts.some(x=>!x || typeof x.playerSecretHex!=="string" || !/^(?:[0-9a-f]{2})+$/.test(x.playerSecretHex)) || v?.engine!=="Plutus V2 CEK via compiledValidatorFactory" || !Array.isArray(v.cases) || v.cases.length!==cases.length || cases.some((n,i)=>v.cases[i]?.name!==n || typeof v.cases[i]?.expectedAccepted!=="boolean" || v.cases[i]?.actualAccepted!==v.cases[i]?.expectedAccepted)) process.exit(1); console.log("Validated "+expected.length+" Haskell Plutus Data encodings and "+cases.length+" canonical Plutus V2 CEK validator outcomes.")' "$GITHUB_WORKSPACE/poc/aiken-reveal-parity/jev-evidence/reveal-schema-fixtures.json"

      - name: Install pinned Aiken
        uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.22

      - name: Generate Aiken tests from canonical Haskell action fixtures
        id: aiken-fixture-tests
        if: steps.haskell-fixtures.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node ../../scripts/generate-aiken-schema-fixture-tests.mjs \
            jev-evidence/reveal-schema-fixtures.json \
            lib/immortal/generated_schema_fixture_tests.ak
          node ../../scripts/generate-aiken-reveal-transition-tests.mjs \
            jev-evidence/reveal-schema-fixtures.json \
            lib/immortal/generated_schema_fixture_tests.ak
          test -s lib/immortal/generated_schema_fixture_tests.ak
          # Single-fault differential cases: expected decisions are the compiled
          # Plutus V2 CEK results recorded by the Haskell producer.
          node ../../scripts/generate-aiken-reveal-mutation-tests.mjs \
            jev-evidence/reveal-schema-fixtures.json \
            lib/immortal/generated_reveal_mutation_tests.ak
          test -s lib/immortal/generated_reveal_mutation_tests.ak

      - name: Report compiler version
        run: aiken --version

      # Cache key includes every source, lock/config file and this workflow.
      # An exact hit means these exact inputs already passed check + build.
      - name: Restore validated Aiken artifacts
        id: aiken-cache
        uses: actions/cache@v4
        with:
          path: |
            poc/aiken-reveal-parity/.aiken
            poc/aiken-reveal-parity/build
            poc/aiken-reveal-parity/plutus.json
          key: aiken-reveal-parity-v1-${{ runner.os }}-${{ hashFiles('poc/aiken-reveal-parity/aiken.toml', 'poc/aiken-reveal-parity/aiken.lock', 'poc/aiken-reveal-parity/lib/**/*.ak', 'poc/aiken-reveal-parity/validators/**/*.ak', 'scripts/measure-aiken-validator-size.mjs', 'scripts/test-measure-aiken-validator-size.mjs', 'scripts/generate-aiken-schema-fixture-tests.mjs', 'scripts/generate-aiken-reveal-transition-tests.mjs', 'scripts/generate-aiken-reveal-mutation-tests.mjs', 'scripts/lib/aiken-datum-exprs.mjs', 'poc/aiken-reveal-parity/lib/immortal/generated_schema_fixture_tests.ak', 'poc/aiken-reveal-parity/lib/immortal/generated_reveal_mutation_tests.ak', 'poc/aiken-reveal-parity/lib/immortal/generated_reveal_transition_tests.ak', 'plutus/test/RevealSchemaFixtures.hs', 'plutus/PrizeValidator.hs', 'plutus/Types.hs', 'plutus/GameRules.hs', 'plutus/Beacon.hs', '.github/workflows/aiken-reveal-parity.yml') }}

      - name: Reuse validated artifacts
        if: steps.aiken-cache.outputs.cache-hit == 'true'
        run: |
          echo "Exact source/config/workflow hash already passed aiken check and aiken build."
          test -f plutus.json
          echo "Reusing cached compiler artifacts; no rebuild required."

      - name: Execute Haskell-to-Aiken serialization parity tests
        id: aiken-fixture-parity
        if: steps.aiken-fixture-tests.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          aiken check

      - name: Run parity tests
        id: aiken-check
        if: steps.aiken-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set +e
          printf 'AIKEN_COMMAND=aiken check\nAIKEN_VERSION=' > aiken-check.log
          aiken --version >> aiken-check.log 2>&1
          script -qec 'RUST_BACKTRACE=full aiken check' /dev/null > aiken-check.tty.log 2>&1
          status=$?
          {
            printf '\nAIKEN_CHECK_EXIT=%s\n' "$status"
            printf 'AIKEN_CHECK_TTY_LOG_BYTES='
            wc -c < aiken-check.tty.log
            printf '\n--- pseudo-terminal output ---\n'
            cat aiken-check.tty.log
          } >> aiken-check.log
          cat aiken-check.log
          exit "$status"

      - name: Compile package independently of check result
        id: aiken-build
        if: always() && steps.aiken-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set +e
          script -qec 'RUST_BACKTRACE=full aiken build' /dev/null > aiken-build.tty.log 2>&1
          status=$?
          {
            printf 'AIKEN_COMMAND=aiken build\nAIKEN_VERSION='
            aiken --version
            printf 'AIKEN_BUILD_EXIT=%s\n' "$status"
            printf 'AIKEN_BUILD_TTY_LOG_BYTES='
            wc -c < aiken-build.tty.log
            printf '\n--- pseudo-terminal output ---\n'
            cat aiken-build.tty.log
          } > aiken-build.log
          cat aiken-build.log
          exit "$status"

      - name: Measure compiled Aiken Reveal script size lower bound
        id: aiken-resource
        if: always() && (steps.aiken-cache.outputs.cache-hit == 'true' || steps.aiken-build.outcome == 'success')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p jev-evidence
          node ../../scripts/measure-aiken-validator-size.mjs aiken.toml plutus.json jev-evidence/aiken-script-size.json

      - name: Probe isolated Plutus V2 compilation compatibility
        id: aiken-v2-probe
        if: always() && (steps.aiken-cache.outputs.cache-hit == 'true' || steps.aiken-build.outcome == 'success')
        continue-on-error: true
        shell: bash
        run: bash ../../scripts/probe-aiken-v2-compatibility.sh

      - name: Isolate Aiken compiler with dependency-free smoke package
        id: aiken-smoke
        if: always() && steps.aiken-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set +e
          smoke_dir="$(mktemp -d)"
          mkdir -p "$smoke_dir/lib"
          cat > "$smoke_dir/aiken.toml" <<'TOML'
          name = "immortal/aiken-compiler-smoke"
          version = "0.0.0"
          compiler = "v1.1.22"
          plutus = "v3"
          license = "Apache-2.0"
          description = "Dependency-free Aiken compiler diagnostic."
          TOML
          cat > "$smoke_dir/lib/smoke.ak" <<'AIKEN'
          pub fn identity(value: Int) -> Int {
            value
          }

          test identity_smoke() {
            identity(42) == 42
          }
          AIKEN
          (
            cd "$smoke_dir"
            aiken --version
            script -qec 'RUST_BACKTRACE=full aiken check' /dev/null
          ) > aiken-smoke.stdout.log 2> aiken-smoke.stderr.log
          status=$?
          {
            printf 'AIKEN_SMOKE_EXIT=%s\n' "$status"
            printf 'AIKEN_SMOKE_STDOUT_BYTES='
            wc -c < aiken-smoke.stdout.log
            printf 'AIKEN_SMOKE_STDERR_BYTES='
            wc -c < aiken-smoke.stderr.log
            printf '\n--- stdout ---\n'
            cat aiken-smoke.stdout.log
            printf '\n--- stderr ---\n'
            cat aiken-smoke.stderr.log
          } > aiken-smoke.log
          cat aiken-smoke.log
          exit "$status"

      - name: Isolate standard-library dependency compilation
        id: aiken-stdlib-smoke
        if: always() && steps.aiken-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set +e
          smoke_dir="$(mktemp -d)"
          mkdir -p "$smoke_dir/lib"
          cat > "$smoke_dir/aiken.toml" <<'TOML'
          name = "immortal/aiken-stdlib-smoke"
          version = "0.0.0"
          compiler = "v1.1.22"
          plutus = "v3"
          license = "Apache-2.0"
          description = "Aiken stdlib dependency isolation diagnostic."
          [[dependencies]]
          name = "aiken-lang/stdlib"
          version = "v3.1.0"
          source = "github"
          TOML
          cat > "$smoke_dir/lib/smoke.ak" <<'AIKEN'
          use aiken/collection/list

          pub fn identity(value: Int) -> Int {
            value
          }

          test identity_smoke() {
            list.length([42]) == identity(1)
          }
          AIKEN
          (
            cd "$smoke_dir"
            aiken --version
            script -qec 'RUST_BACKTRACE=full aiken check' /dev/null
          ) > aiken-stdlib-smoke.stdout.log 2> aiken-stdlib-smoke.stderr.log
          status=$?
          {
            printf 'AIKEN_STDLIB_SMOKE_EXIT=%s\n' "$status"
            printf 'AIKEN_STDLIB_SMOKE_STDOUT_BYTES='
            wc -c < aiken-stdlib-smoke.stdout.log
            printf 'AIKEN_STDLIB_SMOKE_STDERR_BYTES='
            wc -c < aiken-stdlib-smoke.stderr.log
            printf '\n--- stdout ---\n'
            cat aiken-stdlib-smoke.stdout.log
            printf '\n--- stderr ---\n'
            cat aiken-stdlib-smoke.stderr.log
          } > aiken-stdlib-smoke.log
          cat aiken-stdlib-smoke.log
          exit "$status"

      - name: Compare stdlib compatibility with its declared compiler
        id: aiken-stdlib-compat
        if: always() && steps.aiken-cache.outputs.cache-hit != 'true'
        uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.21

      - name: Run stdlib smoke test on declared compiler version
        id: aiken-stdlib-compat-check
        if: always() && steps.aiken-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set +e
          smoke_dir="$(mktemp -d)"
          mkdir -p "$smoke_dir/lib"
          cat > "$smoke_dir/aiken.toml" <<'TOML'
          name = "immortal/aiken-stdlib-compat"
          version = "0.0.0"
          compiler = "v1.1.21"
          plutus = "v3"
          license = "Apache-2.0"
          description = "Aiken stdlib/compiler compatibility diagnostic."
          [[dependencies]]
          name = "aiken-lang/stdlib"
          version = "v3.1.0"
          source = "github"
          TOML
          cat > "$smoke_dir/lib/smoke.ak" <<'AIKEN'
          use aiken/collection/list

          test identity_smoke() {
            list.length([42]) == 1
          }
          AIKEN
          (
            cd "$smoke_dir"
            aiken --version
            script -qec 'RUST_BACKTRACE=full aiken check' /dev/null
          ) > aiken-stdlib-compat.stdout.log 2> aiken-stdlib-compat.stderr.log
          status=$?
          {
            printf 'AIKEN_STDLIB_COMPAT_EXIT=%s\n' "$status"
            printf 'AIKEN_STDLIB_COMPAT_STDOUT_BYTES='
            wc -c < aiken-stdlib-compat.stdout.log
            printf 'AIKEN_STDLIB_COMPAT_STDERR_BYTES='
            wc -c < aiken-stdlib-compat.stderr.log
            printf '\n--- stdout ---\n'
            cat aiken-stdlib-compat.stdout.log
            printf '\n--- stderr ---\n'
            cat aiken-stdlib-compat.stderr.log
          } > aiken-stdlib-compat.log
          cat aiken-stdlib-compat.log
          exit "$status"

      - name: Test fail-closed parity evidence gate
        id: parity-gate-tests
        if: always()
        shell: bash
        run: |
          node ../../scripts/test-aiken-parity-gate.mjs
          node ../../scripts/test-measure-aiken-validator-size.mjs

      # JEV evidence is emitted even when Aiken fails. A cache hit is accepted
      # only for the exact source/config/workflow hash in the cache key above.
      - name: Generate JEV registry for Aiken parity
        id: jev-generation
        if: always()
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CACHE_HIT: ${{ steps.aiken-cache.outputs.cache-hit || 'false' }}
          AIKEN_CHECK_OUTCOME: ${{ steps.aiken-check.outcome || 'unknown' }}
          AIKEN_BUILD_OUTCOME: ${{ steps.aiken-build.outcome || 'unknown' }}
          AIKEN_SIZE_OUTCOME: ${{ steps.aiken-resource.outcome || 'unknown' }}
          AIKEN_V2_PROBE_OUTCOME: ${{ steps.aiken-v2-probe.outcome || 'unknown' }}
          HASKELL_FIXTURE_OUTCOME: ${{ steps.haskell-fixtures.outcome || 'unknown' }}
          AIKEN_FIXTURE_PARITY_OUTCOME: ${{ steps.aiken-fixture-parity.outcome || 'unknown' }}
        run: |
          set -euo pipefail
          mkdir -p jev-evidence
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const outcome = (v) => ['success','failure','cancelled','skipped'].includes(v) ? v : 'unknown';
          const cacheHit = process.env.CACHE_HIT === 'true';
          const metadata = {
            repository: process.env.GITHUB_REPOSITORY,
            commitSha: process.env.GITHUB_SHA,
            ref: process.env.GITHUB_REF,
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunUrl: process.env.RUN_URL,
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            executionContext: 'static-analysis',
          };
          const evidenceRefs = [{ kind: 'workflow-run', uri: process.env.RUN_URL }];
          const limitations = cacheHit
            ? ['Exact source/config/workflow hash matched the CI cache; PASS reflects previously validated artifacts, not a fresh compiler execution in this run.', 'This is an isolated Aiken parity harness, not full Reveal validator parity or protocol-wide GREEN.']
            : ['This result applies only to this commit, workflow run, and isolated Aiken harness.', 'This harness is not a deployable validator and does not establish full Reveal parity.'];
          const fixtureOutcome = outcome(process.env.HASKELL_FIXTURE_OUTCOME);
          const checks = [
            {
              checkId: 'HASKELL.REVEAL.SCHEMA.FIXTURES',
              requirementRef: 'Canonical Haskell Types.hs / Plutus Data schema fixtures',
              stepOutcome: fixtureOutcome,
              evidenceRefs,
              limitations: ['Includes selected Plutus Data encodings and 11 synthetic-context CEK executions of the compiled Plutus V2 validator; it does not establish native-ledger validity, current ledger cost-model feasibility, V2-to-V3 compatibility, or full Haskell/Aiken validator parity.', 'Fixture generation requires the canonical Plutus toolchain; no hand-copied fixture is accepted.'],
            },
            {
              checkId: 'HASKELL.REVEAL.VALIDATOR.CEK',
              requirementRef: 'Canonical compiled Plutus V2 PrizeValidator / compiledValidatorFactory',
              stepOutcome: fixtureOutcome,
              evidenceRefs,
              limitations: ['Executes the compiled Haskell validator with test-only synthetic ScriptContext values using the Plutus CEK evaluator; it is not a Yaci/native-ledger transaction and does not prove current protocol-cost-model feasibility.', 'The cases cover two acceptance paths and representative negative guards; this is not an exhaustive validator proof.'],
            },
            {
              checkId: 'AIKEN.REVEAL.SERIALIZATION.PARITY',
              requirementRef: 'Canonical Haskell PrizeAction Plutus Data serialization fixtures',
              stepOutcome: outcome(process.env.AIKEN_FIXTURE_PARITY_OUTCOME),
              evidenceRefs,
              limitations: ['Compares selected constructor encodings and Haskell-generated winning/loss transitions through Aiken serialization, payout/accounting predicates, and a pure state-transition predicate with negative twins; it does not yet evaluate a complete Aiken transaction-context validator or establish native-ledger parity.', 'Expected bytes and transition values are generated by the canonical Haskell fixture producer in this same workflow run.'],
            },
            {
              checkId: 'AIKEN.REVEAL.MUTATION.PARITY',
              requirementRef: 'Haskell Plutus V2 CEK single-fault mutations evaluated by Aiken transition and transaction predicates',
              stepOutcome: outcome(process.env.AIKEN_FIXTURE_PARITY_OUTCOME),
              evidenceRefs,
              observedValue: await (async () => {
                try {
                  const fixture = JSON.parse(await fs.readFile('jev-evidence/reveal-schema-fixtures.json', 'utf8'));
                  const cases = fixture.mutationEvaluations?.cases;
                  return Array.isArray(cases) ? {
                    canonicalCekCases: cases.length,
                    generatedAikenChecks: cases.length * 2,
                    accepted: cases.filter((item) => item.actualAccepted === true).length,
                    rejected: cases.filter((item) => item.actualAccepted === false).length,
                    decisionsMatched: cases.every((item) => item.actualAccepted === item.expectedAccepted),
                  } : { status: 'unavailable' };
                } catch {
                  return { status: 'unavailable' };
                }
              })(),
              expectedValue: 'Every generated transition and typed-transaction mutation check passes; Haskell CEK expected and actual decisions agree.',
              limitations: ['Synthetic typed Aiken transactions and pure transition predicates only; this does not establish native-ledger validity, current cost-model feasibility, transaction-size feasibility, or full Haskell/Aiken validator equivalence.', 'Characterization cases preserve observed Haskell behavior and are not endorsements of unconstrained fields as normative policy.'],
            },
            {
              checkId: 'AIKEN.REVEAL.PLUTUS_V2.COMPATIBILITY_PROBE',
              requirementRef: 'Determine whether the isolated Aiken Reveal source compiles for Plutus V2 while preserving the canonical Plutus V3 parity harness',
              stepOutcome: outcome(process.env.AIKEN_V2_PROBE_OUTCOME),
              evidenceRefs,
              observedValue: await (async () => {
                try {
                  return JSON.parse(await fs.readFile('jev-evidence/aiken-v2-compatibility.json', 'utf8'));
                } catch {
                  return { status: 'unavailable' };
                }
              })(),
              expectedValue: 'Compile-only diagnostic; success does not establish Haskell parity, native-ledger acceptance, cost-model compatibility, or production readiness.',
              limitations: [
                'The probe uses a temporary copy and does not change the canonical V3 package or production validator.',
                'A successful build is not proof of semantic or ledger equivalence.',
              ],
            },
            {
              checkId: 'AIKEN.REVEAL.SCRIPT.SIZE.LOWER_BOUND',
              requirementRef: 'Compiled Aiken Reveal script lower bound against the 16,384-byte Cardano transaction limit',
              stepOutcome: outcome(process.env.AIKEN_SIZE_OUTCOME),
              evidenceRefs,
              observedValue: await (async () => {
                try {
                  const report = JSON.parse(await fs.readFile('jev-evidence/aiken-script-size.json', 'utf8'));
                  return {
                    targetLanguageVersion: report.targetLanguageVersion,
                    transactionSizeLimitBytes: report.transactionSizeLimitBytes,
                    validators: report.validators,
                    fullTransactionSize: report.fullTransactionSize,
                    result: report.result,
                    deploymentGateClosed: report.deploymentGateClosed,
                  };
                } catch {
                  return { status: 'unavailable' };
                }
              })(),
              expectedValue: 'The compiled script alone is strictly below 16,384 bytes; this is only a lower bound and never a full transaction/deployability pass.',
              limitations: [
                'This check measures compiledCode bytes only; complete reference-script publication and Reveal transaction CBOR sizes are still unmeasured.',
                'Passing this lower-bound measurement does not establish native-ledger acceptance, CPU/memory feasibility, or actual transaction-size compliance.',
                'The Aiken prototype targets Plutus V3 while the existing Haskell Reveal validator targets Plutus V2. The language-version compatibility gate remains open.',
              ],
            },
            {
              checkId: 'AIKEN.REVEAL.CHECK',
              requirementRef: 'Aiken Reveal parity harness / aiken check',
              stepOutcome: cacheHit ? 'success' : outcome(process.env.AIKEN_CHECK_OUTCOME),
              evidenceRefs,
              limitations,
            },
            {
              checkId: 'AIKEN.REVEAL.BUILD',
              requirementRef: 'Aiken Reveal parity harness / aiken build',
              stepOutcome: cacheHit ? 'success' : outcome(process.env.AIKEN_BUILD_OUTCOME),
              evidenceRefs,
              limitations,
            },
          ];
          await fs.writeFile('jev-evidence/registry-input.json', JSON.stringify({ metadata, checks }, null, 2) + '\n');
          NODE
          node ../../scripts/jev-verification-registry-generator.mjs jev-evidence/registry-input.json jev-evidence/verification-registry.json
          node ../../scripts/build-jev-operational-prompt.mjs jev-evidence/verification-registry.json jev-evidence/operational-prompt.md
          node ../../scripts/test-jev-verification-registry-generator.mjs
          node ../../scripts/test-jev-operational-prompt.mjs
          node ../../scripts/test-notion-evidence-ledger.mjs

      - name: Upload JEV Aiken evidence
        id: evidence-upload
        if: always() && hashFiles('poc/aiken-reveal-parity/jev-evidence/verification-registry.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: jev-aiken-reveal-parity-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            poc/aiken-reveal-parity/jev-evidence/verification-registry.json
            poc/aiken-reveal-parity/jev-evidence/aiken-script-size.json
            poc/aiken-reveal-parity/jev-evidence/aiken-v2-compatibility.json
            poc/aiken-reveal-parity/aiken-v2-compatibility.log
            poc/aiken-reveal-parity/jev-evidence/operational-prompt.md
            poc/aiken-reveal-parity/jev-evidence/registry-input.json
            poc/aiken-reveal-parity/jev-evidence/reveal-schema-fixtures.json
            poc/aiken-reveal-parity/aiken-check.log
            poc/aiken-reveal-parity/aiken-check.stdout.log
            poc/aiken-reveal-parity/aiken-check.stderr.log
            poc/aiken-reveal-parity/aiken-check.tty.log
            poc/aiken-reveal-parity/aiken-build.log
            poc/aiken-reveal-parity/aiken-build.stdout.log
            poc/aiken-reveal-parity/aiken-build.stderr.log
            poc/aiken-reveal-parity/aiken-build.tty.log
            poc/aiken-reveal-parity/aiken-smoke.log
            poc/aiken-reveal-parity/aiken-smoke.stdout.log
            poc/aiken-reveal-parity/aiken-smoke.stderr.log
            poc/aiken-reveal-parity/aiken-stdlib-smoke.log
            poc/aiken-reveal-parity/aiken-stdlib-smoke.stdout.log
            poc/aiken-reveal-parity/aiken-stdlib-smoke.stderr.log
            poc/aiken-reveal-parity/aiken-stdlib-compat.log
            poc/aiken-reveal-parity/aiken-stdlib-compat.stdout.log
            poc/aiken-reveal-parity/aiken-stdlib-compat.stderr.log
          if-no-files-found: warn

      - name: Register Aiken JEV evidence in Notion
        if: always() && steps.evidence-upload.outcome == 'success'
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_EVIDENCE_PAGE_ID: "3e2c4454-d6d5-819c-bec1-c6edede714b3"
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: ${{ steps.evidence-upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.evidence-upload.outputs.artifact-digest }}
          LAB_JOB_STATUS: ${{ job.status }}
          JEV_OPERATIONAL_PROMPT_PATH: jev-evidence/operational-prompt.md
          JEV_PROMPT_STATUS: ${{ steps.jev-generation.outcome || 'unknown' }}
        run: node ../../scripts/register-evidence-in-notion.mjs

      # Fail the job if required parity evidence was skipped or its producer failed.
      # The shell gate is separately tested against negative and cache-hit scenarios.
      - name: Enforce parity evidence gate
        if: always()
        env:
          CACHE_HIT: ${{ steps.aiken-cache.outputs.cache-hit || 'false' }}
          HASKELL_FIXTURE_OUTCOME: ${{ steps.haskell-fixtures.outcome || 'unknown' }}
          AIKEN_FIXTURE_TESTS_OUTCOME: ${{ steps.aiken-fixture-tests.outcome || 'unknown' }}
          AIKEN_FIXTURE_PARITY_OUTCOME: ${{ steps.aiken-fixture-parity.outcome || 'unknown' }}
          AIKEN_CHECK_OUTCOME: ${{ steps.aiken-check.outcome || 'unknown' }}
          AIKEN_BUILD_OUTCOME: ${{ steps.aiken-build.outcome || 'unknown' }}
          AIKEN_SIZE_OUTCOME: ${{ steps.aiken-resource.outcome || 'unknown' }}
          GATE_TESTS_OUTCOME: ${{ steps.parity-gate-tests.outcome || 'unknown' }}
        shell: bash
        run: bash ../../scripts/enforce-aiken-parity-gate.sh
